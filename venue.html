<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOAT COMMAND">
<link rel="manifest" href="manifest.webmanifest?v=3520">
<link rel="icon" href="icon.svg?v=3520" type="image/svg+xml">
<title>BOAT COMMAND VENUE</title>
<style>
:root{--bg:#06101c;--panel:#0b1b2d;--line:#1c3d5f;--text:#f4f8fc;--muted:#8ea7bd;--cyan:#20e0c7;--blue:#178cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#071521,#04101b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:1040px;margin:auto;padding:22px 18px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.back{appearance:none;border:1px solid #244765;background:#0a1a2b;color:#dbeaf5;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}
.brand{font-size:12px;letter-spacing:.12em;color:#7e9ab0}.brand b{display:block;font-size:18px;letter-spacing:0;color:#f3f8fc;margin-top:2px}
.hero{border:1px solid var(--line);border-radius:20px;padding:22px;background:radial-gradient(circle at 88% 12%,rgba(32,224,199,.09),transparent 27%),linear-gradient(135deg,#0a1a2b,#0b2238)}
.code{font-size:10px;color:#6f8ba1;letter-spacing:.14em}.hero h1{font-size:clamp(30px,6vw,52px);margin:6px 0 8px}.hero p{margin:0;color:#a7bed0;line-height:1.6}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:6px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;color:#90a8ba;font-size:11px;font-weight:900}.status i{width:8px;height:8px;border-radius:50%;background:#70889b}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.panel{border:1px solid var(--line);border-radius:16px;padding:18px;background:linear-gradient(180deg,#0c1f33,#091725)}
.panel h2{margin:0 0 12px;font-size:18px}.panel p{margin:0;color:#9eb3c4;font-size:13px;line-height:1.65}
.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.03)}.step span{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#0b2941;color:#8fcdeb;font-weight:900}.step b{display:block;font-size:12px}.step small{display:block;color:#708ba1;margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.tab{border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:12px 8px;text-align:center;color:#6f879b;background:rgba(255,255,255,.025);font-size:11px}.tab:first-child{color:#d8e8f4;border-color:#315675}
.note{margin-top:14px;padding:14px 16px;border:1px dashed rgba(255,255,255,.11);border-radius:13px;color:#7892a6;font-size:11px;line-height:1.6}
.actions{display:flex;gap:10px;margin-top:16px}.primary,.ghost{border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#087dbb,#5c54ff);color:white}.ghost{border:1px solid #294c68;background:#091927;color:#d8e7f2}
@media(max-width:720px){.grid{grid-template-columns:1fr}.shell{padding:16px 12px 90px}.hero{padding:18px}.tabs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><button class="back" id="backBtn">← 24場へ</button><div class="brand">BOAT COMMAND<b id="topVenue">VENUE</b></div></header>
<section class="hero">
<div class="code" id="venueCode">VENUE --</div>
<h1 id="venueName">競艇場</h1>
<p>この競艇場専用の入口です。画面構成は先に共通化し、予想ロジックは場ごとに検証してから接続します。</p>
<div class="status"><i></i><span>MODEL準備中</span></div>
</section>
<section class="grid">
<div class="panel">
<h2>この場の進行</h2>
<div class="steps">
 <div class="step"><span>1</span><div><b>入口・共通UI</b><small>OPEN</small></div></div>
 <div class="step"><span>2</span><div><b>場別データ収集・特性分析</b><small>未接続</small></div></div>
 <div class="step"><span>3</span><div><b>メイン予想モデル</b><small>場ごとに構築</small></div></div>
 <div class="step"><span>4</span><div><b>TRY検証・資金連動</b><small>モデル検証後に解禁</small></div></div>
</div>
</div>
<div class="panel">
<h2>共通画面</h2>
<p>蒲郡で固めた構成を土台に、各場へ順次接続します。未完成の予想を共通モデルで無理に出すことはしません。</p>
<div class="tabs"><div class="tab">今日</div><div class="tab">12R</div><div class="tab">結果</div><div class="tab">履歴</div></div>
<div class="note">現在は入口のみ。予想・結果取得・TRY・仮資金処理はこの場ではまだ動きません。</div>
<div class="actions"><button class="primary" id="portalBtn">24場一覧へ戻る</button></div>
</div>
</section>
</main>
<script>
const VENUES={
 '01':['桐生','KIRYU'],'02':['戸田','TODA'],'03':['江戸川','EDOGAWA'],'04':['平和島','HEIWAJIMA'],
 '05':['多摩川','TAMAGAWA'],'06':['浜名湖','HAMANAKO'],'07':['蒲郡','GAMAGORI'],'08':['常滑','TOKONAME'],
 '09':['津','TSU'],'10':['三国','MIKUNI'],'11':['びわこ','BIWAKO'],'12':['住之江','SUMINOE'],
 '13':['尼崎','AMAGASAKI'],'14':['鳴門','NARUTO'],'15':['丸亀','MARUGAME'],'16':['児島','KOJIMA'],
 '17':['宮島','MIYAJIMA'],'18':['徳山','TOKUYAMA'],'19':['下関','SHIMONOSEKI'],'20':['若松','WAKAMATSU'],
 '21':['芦屋','ASHIYA'],'22':['福岡','FUKUOKA'],'23':['唐津','KARATSU'],'24':['大村','OMURA']
};
const q=new URLSearchParams(location.search),jcd=String(q.get('jcd')||'').padStart(2,'0'),v=VENUES[jcd];
if(jcd==='07'){location.replace('./?venue=gamagori')}
else if(!v){location.replace('./portal.html')}
else{
 document.title=`BOAT COMMAND | ${v[0]}`;
 document.getElementById('venueCode').textContent=`VENUE ${jcd} · ${v[1]}`;
 document.getElementById('venueName').textContent=v[0];
 document.getElementById('topVenue').textContent=v[0];
}
document.getElementById('backBtn').onclick=()=>location.href='./portal.html';
document.getElementById('portalBtn').onclick=()=>location.href='./portal.html';
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#020b12"/><stop offset=".46" stop-color="#06303b"/><stop offset="1" stop-color="#01080d"/>
  </linearGradient>
  <linearGradient id="hull" x1="0" y1=".2" x2="1" y2=".8">
    <stop stop-color="#03131a"/><stop offset=".42" stop-color="#0a5b62"/><stop offset=".72" stop-color="#13d8c1"/><stop offset="1" stop-color="#03141a"/>
  </linearGradient>
  <linearGradient id="suit" x1=".2" y1="0" x2=".8" y2="1">
    <stop stop-color="#0a1a1e"/><stop offset=".5" stop-color="#0e6c61"/><stop offset=".85" stop-color="#071b20"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop stop-color="#5affdf" stop-opacity=".36"/><stop offset=".55" stop-color="#2dffcb" stop-opacity=".09"/><stop offset="1" stop-color="#2dffcb" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="rain" width="48" height="70" patternUnits="userSpaceOnUse">
    <text x="4" y="14" fill="#2dffcb" opacity=".12" font-size="10" font-family="monospace">01</text>
    <text x="22" y="38" fill="#2dffcb" opacity=".06" font-size="8" font-family="monospace">10</text>
    <text x="7" y="62" fill="#2dffcb" opacity=".08" font-size="7" font-family="monospace">001</text>
  </pattern>
</defs>
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#rain)" opacity=".55"/>
<ellipse cx="820" cy="178" rx="330" ry="145" fill="url(#halo)" filter="url(#blur8)"/>

name: PROGRAM HISTORY 2026 frozen-rule OOS v2.1.0
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download frozen 2025 DB
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: program-history-2025-finalize-db-v181.yml
          workflow_conclusion: success
          name: gamagori-2025-final
          path: source2025
      - name: Download finalized 2026 DB
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: program-history-2026-exception-finalization-v202.yml
          workflow_conclusion: success
          name: gamagori-2026-final
          path: source2026
      - name: Frozen 2025 rule on 2026 walk-forward OOS
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json,math
          from collections import Counter
          from pathlib import Path
          a=sorted(json.load(open("source2025/gamagori-2025.json"))["races"],key=lambda r:(r["d"],int(r["r"])))
          b=sorted(json.load(open("source2026/gamagori-2026.json"))["races"],key=lambda r:(r["d"],int(r["r"])))
          assert len(a)==2381 and len(b)==1690 and max(r["d"] for r in a)<min(r["d"] for r in b)
          rank={"A1":3,"A2":2,"B1":1,"B2":0}; lw=[1.35,1.20,1.10,1.00,.95,.90]
          threshold=1.5; decay=.55; minw=30.0; baseline=56.61
          def cv(r):
              c=tuple(r["c"]); assert len(c)==6 and all(x in rank for x in c); return c
          def feat(c):
              n=[rank[x] for x in c]
              return (sum(x=="A1" for x in c),sum(x in {"A1","A2"} for x in c),sum(n[:3]),sum(n[3:]))
          def dist(x,y):
              lane=sum(lw[i]*abs(rank[x[i]]-rank[y[i]]) for i in range(6)); p,q=feat(x),feat(y)
              return lane+.45*abs(p[0]-q[0])+.25*abs(p[1]-q[1])+.12*abs(p[2]-q[2])+.08*abs(p[3]-q[3])
          def winner(r):
              try:return int(str(r["o"]).split("-")[0])
              except:return None
          rec=[]; hist=list(a)
          for d in sorted({r["d"] for r in b}):
              assert all(r["d"]<d for r in hist)
              day=[r for r in b if r["d"]==d]
              for t in day:
                  if not 5<=int(t["r"])<=8: continue
                  wc=Counter(); wn=0.; raw=0; tc=cv(t)
                  for r in hist:
                      dd=dist(tc,cv(r))
                      if dd<=threshold:
                          raw+=1; w=math.exp(-decay*dd); rw=winner(r)
                          if rw in range(1,7): wc[rw]+=w; wn+=w
                  pick=wc.most_common(1)[0][0] if wn>=minw and wc else None; actual=winner(t)
                  if pick is not None and actual is not None:
                      rec.append({"date":d,"race":int(t["r"]),"pick":pick,"actual":actual,"hit":pick==actual,
                                  "rawSamples":raw,"weightedSamples":round(wn,4)})
              hist.extend(day)
          def st(x):
              n=len(x); h=sum(z["hit"] for z in x)
              return {"eligible":n,"hits":h,"accuracyPct":round(100*h/n,2) if n else None}
          overall=st(rec)
          monthly=[{"month":m,**st([x for x in rec if x["date"][:7]==m])} for m in sorted({x["date"][:7] for x in rec})]
          blocks=[{"block":i//20+1,"start":x[0]["date"],"end":x[-1]["date"],**st(x)}
                  for i in range(0,len(rec),20) if (x:=rec[i:i+20])]
          recent={str(n):st(rec[-n:]) for n in (8,16,24,32,40)}
          acc=overall["accuracyPct"] or 0
          verdict=("REVIVED_DIAGNOSTIC" if overall["eligible"]>=100 and acc>=65 and recent["32"]["accuracyPct"]>=baseline
                   else "REJECT_FROZEN_RULE" if overall["eligible"]>=100 and acc<baseline else "HOLD_SHADOW")
          out={"schema":"boat-command-2026-frozen-rule-oos-v1","venueCode":"07","trainYear":2025,"testYear":2026,
               "trainRaceCount":len(a),"testRaceCount":len(b),"candidate":"R05-08","threshold":threshold,"decay":decay,
               "minimumWeightedSamples":minw,"strictPastOnly":True,"sameDayTrainingExcluded":True,
               "distanceUsesResults":False,"distanceUsesPayouts":False,"predictionEnabled":False,
               "mode":"SHADOW_OBSERVE_ONLY","baselineAccuracyPct":baseline,"overall":overall,
               "monthly":monthly,"eligibleSequenceBlocks20":blocks,"recent":recent,"verdict":verdict}
          Path("out/gamagori-2026-frozen-rule-oos.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print("2026 FROZEN-RULE OOS PASS"); print("OVERALL",overall)
          for x in monthly: print("MONTH",x)
          for x in blocks: print("BLOCK20",x)
          print("RECENT",recent); print("VERDICT",verdict)
          print("PREDICTION ENABLED false · SHADOW/OBSERVE ONLY")
          PY
      - name: Safety audit
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open("out/gamagori-2026-frozen-rule-oos.json"))
          assert x["trainRaceCount"]==2381 and x["testRaceCount"]==1690
          assert x["candidate"]=="R05-08" and x["threshold"]==1.5 and x["decay"]==.55
          assert x["minimumWeightedSamples"]==30.0 and x["strictPastOnly"] and x["sameDayTrainingExcluded"]
          assert not x["distanceUsesResults"] and not x["distanceUsesPayouts"] and not x["predictionEnabled"]
          assert x["mode"]=="SHADOW_OBSERVE_ONLY"
          print("SAFETY PASS · 2025→2026 STRICT WALK-FORWARD OOS · SHADOW ONLY")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gamagori-2026-frozen-rule-oos
          path: out/gamagori-2026-frozen-rule-oos.json
          retention-days: 7

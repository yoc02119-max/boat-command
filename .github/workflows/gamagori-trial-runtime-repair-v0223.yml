name: Gamagori trial runtime repair v0.22.3

on:
  push:
    paths:
      - '.github/workflows/gamagori-trial-runtime-repair-v0223.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair missing LIVE integration dependency and cache key
        shell: python
        run: |
          from pathlib import Path

          # index.html: live-autopoll depends on loadVerifiedLiveRace from the integration module.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '<script src="app.js?v=221"></script>'
          integration = '<script src="gamagori-live-integration-v0198.js?v=221"></script>'
          if integration not in s:
              if anchor not in s:
                  raise SystemExit('INDEX_APP_ANCHOR_MISSING')
              s = s.replace(anchor, anchor + '\n' + integration, 1)
          s = s.replace('live-snapshot-hash-guard-v0209.js?v=214', 'live-snapshot-hash-guard-v0209.js?v=221')
          p.write_text(s, encoding='utf-8')

          # Runtime readiness gate must fail if the integration module disappears again.
          p = Path('trial-readiness-v0218.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'app.js','live-autopoll-v0199.js'", "'app.js','gamagori-live-integration-v0198.js','live-autopoll-v0199.js'")
          s = s.replace("lockRace:typeof window.lockRace==='function',", "liveRelayLoader:typeof window.loadVerifiedLiveRace==='function',\n      lockRace:typeof window.lockRace==='function',")
          p.write_text(s, encoding='utf-8')

          # Public smoke audit: include integration in trigger, syntax audit, local/public order contract.
          p = Path('.github/workflows/gamagori-public-trial-smoke-v0219.yml')
          s = p.read_text(encoding='utf-8')
          if "      - 'gamagori-live-integration-v0198.js'" not in s:
              s = s.replace("      - 'manifest.webmanifest'\n", "      - 'manifest.webmanifest'\n      - 'gamagori-live-integration-v0198.js'\n", 1)
          if '            gamagori-live-integration-v0198.js \\\n' not in s:
              s = s.replace('            app.js \\\n', '            app.js \\\n            gamagori-live-integration-v0198.js \\\n', 1)
          s = s.replace("'app.js','live-autopoll-v0199.js'", "'app.js','gamagori-live-integration-v0198.js','live-autopoll-v0199.js'")
          p.write_text(s, encoding='utf-8')

          # Static readiness workflow: include integration in trigger and script-order contract.
          p = Path('.github/workflows/gamagori-early-trial-readiness-v0218.yml')
          s = p.read_text(encoding='utf-8')
          if "      - 'gamagori-live-integration-v0198.js'" not in s:
              s = s.replace("      - 'trial-readiness-v0218.js'\n", "      - 'trial-readiness-v0218.js'\n      - 'gamagori-live-integration-v0198.js'\n", 1)
          s = s.replace("'app.js','live-autopoll-v0199.js'", "'app.js','gamagori-live-integration-v0198.js','live-autopoll-v0199.js'")
          p.write_text(s, encoding='utf-8')

      - name: Verify repaired dependency chain
        shell: bash
        run: |
          set -euo pipefail
          node --check gamagori-live-integration-v0198.js
          node --check live-autopoll-v0199.js
          node --check trial-readiness-v0218.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          srcs=re.findall(r'<script\s+src="([^"]+)"',html)
          bases=[x.split('?',1)[0] for x in srcs]
          required=['app.js','gamagori-live-integration-v0198.js','live-autopoll-v0199.js','live-predictor-v0200.js','live-autofill-v0201.js','live-lock-guard-v0202.js','live-lock-snapshot-v0203.js','live-result-v0204.js','live-learning-v0205.js','live-learning-dashboard-v0206.js','live-learning-guard-v0207.js','live-integrity-audit-v0208.js','live-snapshot-hash-guard-v0209.js','development-status-v0217.js','trial-readiness-v0218.js']
          miss=[x for x in required if x not in bases]
          if miss: raise SystemExit(f'MISSING:{miss}')
          pos=[bases.index(x) for x in required]
          if pos != sorted(pos): raise SystemExit('SCRIPT_ORDER_BAD')
          stale=[x for x in srcs if not x.endswith('?v=221')]
          if stale: raise SystemExit(f'STALE_CACHE_KEY:{stale}')
          gate=Path('trial-readiness-v0218.js').read_text(encoding='utf-8')
          for token in ['gamagori-live-integration-v0198.js','liveRelayLoader','loadVerifiedLiveRace']:
              if token not in gate: raise SystemExit(f'READINESS_TOKEN_MISSING:{token}')
          print('GAMAGORI_TRIAL_RUNTIME_REPAIR_PASS')
          PY

      - name: Commit repaired app runtime
        run: |
          if git diff --quiet -- index.html trial-readiness-v0218.js .github/workflows/gamagori-public-trial-smoke-v0219.yml .github/workflows/gamagori-early-trial-readiness-v0218.yml; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trial-readiness-v0218.js .github/workflows/gamagori-public-trial-smoke-v0219.yml .github/workflows/gamagori-early-trial-readiness-v0218.yml
          git commit -m 'fix: restore Gamagori LIVE runtime dependency chain'
          git push

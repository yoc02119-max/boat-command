name: Gamagori LIVE candidate predictor v0.20.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'live-predictor-v0200.js'
      - 'live-two-stage-v0260.js'
      - '.github/workflows/gamagori-live-predictor-v0200.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-live-predictor-v0200
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate predictor JavaScript
        run: |
          node --check live-predictor-v0200.js
          node --check live-two-stage-v0260.js

      - name: Ensure predictor and two-stage modules are loaded once in order
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'<script\s+src="app\.js\?v=(\d+)"></script>',s)
          token=m.group(1) if m else '1'

          for name in ('live-predictor-v0200.js','live-two-stage-v0260.js'):
              s=re.sub(rf'\s*<script\s+src="{re.escape(name)}(?:\?v=\d+)?"></script>','',s)

          anchor=re.search(r'<script\s+src="live-autopoll-v0199\.js(?:\?v=\d+)?"></script>',s)
          tags=(f'\n<script src="live-predictor-v0200.js?v={token}"></script>'
                f'\n<script src="live-two-stage-v0260.js?v={token}"></script>')
          if anchor:
              pos=anchor.end()
              s=s[:pos]+tags+s[pos:]
          else:
              s=s.replace('</body>',tags+'\n</body>')

          for name in ('live-predictor-v0200.js','live-two-stage-v0260.js'):
              n=len(re.findall(rf'<script\s+src="{re.escape(name)}(?:\?v=\d+)?"></script>',s))
              if n!=1: raise SystemExit(f'{name}_INCLUDE_COUNT_INVALID:{n}')
          if s.index('live-predictor-v0200.js')>s.index('live-two-stage-v0260.js'):
              raise SystemExit('TWO_STAGE_SCRIPT_ORDER_INVALID')
          p.write_text(s,encoding='utf-8')
          print(f'TWO_STAGE_INCLUDE_OK token={token}')

      - name: Commit app predictor enablement
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo NO_CHANGES
            exit 0
          fi
          git config user.name 'boat-command-relay'
          git config user.email 'boat-command-relay@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: load Gamagori two-stage prediction overlay'
          git push

name: Gamagori LIVE candidate predictor v0.20.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'live-predictor-v0200.js'
      - '.github/workflows/gamagori-live-predictor-v0200.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-live-predictor-v0200
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate predictor JavaScript
        run: node --check live-predictor-v0200.js

      - name: Ensure exactly one predictor module include
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Do not pin/rollback the current cache token. Reuse the app shell's
          # current numeric token and make the module include idempotent.
          m=re.search(r'<script\s+src="app\.js\?v=(\d+)"></script>',s)
          token=m.group(1) if m else '1'
          pattern=r'\s*<script\s+src="live-predictor-v0200\.js(?:\?v=\d+)?"></script>'
          s=re.sub(pattern,'',s)

          anchor=re.search(r'<script\s+src="live-autopoll-v0199\.js(?:\?v=\d+)?"></script>',s)
          tag=f'\n<script src="live-predictor-v0200.js?v={token}"></script>'
          if anchor:
              pos=anchor.end()
              s=s[:pos]+tag+s[pos:]
          else:
              s=s.replace('</body>',tag+'\n</body>')

          if len(re.findall(r'<script\s+src="live-predictor-v0200\.js(?:\?v=\d+)?"></script>',s)) != 1:
              raise SystemExit('PREDICTOR_INCLUDE_COUNT_INVALID')
          p.write_text(s,encoding='utf-8')
          print(f'PREDICTOR_INCLUDE_OK token={token}')

      - name: Commit app predictor enablement
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo NO_CHANGES
            exit 0
          fi
          git config user.name 'boat-command-relay'
          git config user.email 'boat-command-relay@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: keep one Gamagori LIVE candidate predictor include'
          git push

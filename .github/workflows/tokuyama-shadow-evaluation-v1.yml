name: Tokuyama SHADOW evaluation v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tokuyama POST-RACE result collector v1"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/tokuyama-shadow-evaluate-v1.js'
      - 'scripts/tokuyama-shadow-evaluation-v1.js'
      - 'live/tokuyama/**/post/**'
      - 'live/tokuyama/**/shadow/**'

permissions:
  contents: write

concurrency:
  group: tokuyama-shadow-evaluation-v1
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Resolve latest Tokuyama result date
        id: date
        run: |
          DATE=$(python3 - <<'PY'
          from pathlib import Path
          d=sorted(p.name for p in Path('live/tokuyama').glob('20??-??-??') if (p/'post').exists())
          print(d[-1] if d else '')
          PY
          )
          if [ -z "$DATE" ]; then echo 'ready=false' >> "$GITHUB_OUTPUT"; else echo "date=$DATE" >> "$GITHUB_OUTPUT"; echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Evaluate immutable Tokuyama snapshots
        if: steps.date.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node --check scripts/tokuyama-shadow-evaluate-v1.js
          node --check scripts/tokuyama-shadow-evaluation-v1.js
          node scripts/tokuyama-shadow-evaluate-v1.js "${{ steps.date.outputs.date }}"
          node scripts/tokuyama-shadow-evaluation-v1.js
          node - <<'NODE'
          const fs=require('fs'),d=process.env.DATE;
          const day=JSON.parse(fs.readFileSync(`live/tokuyama/${d}/research-evaluation-v1.json`,'utf8'));
          if(day.venueCode!=='18'||day.bankrollAffected!==false||day.tryAffected!==false||day.productionAffected!==false)throw new Error('DAY_BOUNDARY');
          const all=require('./tokuyama-shadow-evaluation-v1.json');
          if(all.venueCode!=='18'||all.cashNeutral!==true||all.realMoney!==false)throw new Error('AGG_BOUNDARY');
          if(typeof all.forwardUpliftReady!=='boolean')throw new Error('UPLIFT_FLAG');
          if(!all.classBaseline||!all.programOnly)throw new Error('PAIRED_STATS');
          console.log('TOKUYAMA_SHADOW_EVALUATION_PASS',{classBaseline:all.classBaseline,programOnly:all.programOnly,pairedRaces:all.pairedRaces,hitRateDelta:all.hitRateDelta,roiDelta:all.roiDelta,forwardUpliftReady:all.forwardUpliftReady});
          NODE
        env:
          DATE: ${{ steps.date.outputs.date }}
      - name: Commit evaluation
        if: steps.date.outputs.ready == 'true'
        run: |
          set -euo pipefail
          DATE="${{ steps.date.outputs.date }}"
          cp "live/tokuyama/$DATE/research-evaluation-v1.json" /tmp/tokuyama-day-evaluation.json
          cp tokuyama-shadow-evaluation-v1.json /tmp/tokuyama-shadow-evaluation-v1.json
          git config user.name 'boat-command-tokuyama-eval'
          git config user.email 'boat-command-tokuyama-eval@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "live/tokuyama/$DATE"
            cp /tmp/tokuyama-day-evaluation.json "live/tokuyama/$DATE/research-evaluation-v1.json"
            cp /tmp/tokuyama-shadow-evaluation-v1.json tokuyama-shadow-evaluation-v1.json
            git add "live/tokuyama/$DATE/research-evaluation-v1.json" tokuyama-shadow-evaluation-v1.json
            git diff --cached --quiet && { echo 'TOKUYAMA_EVALUATION_CURRENT'; exit 0; }
            git commit -m 'analysis(tokuyama): refresh cash-neutral SHADOW evaluation'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1

name: Shared 24-venue virtual TRY portfolio v1
# The Pages sync workflow listens for this workflow's successful completion.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared-try-config-v1.json'
      - 'scripts/shared-try-portfolio-v1.js'
      - 'scripts/venue-post-result-v1.py'
      - 'daily-lab/venue-expansion-policy-v1.json'
      - '.github/workflows/shared-try-portfolio-v1.yml'
      - 'venue-registry-v1.js'
      - 'live/*/*/post/day-status.json'
      - 'venues/toda/config-v1.json'
      - 'venues/edogawa/config-v1.json'
      - 'venues/karatsu/config-v1.json'
      - 'venues/mikuni/config-v1.json'
      - 'venues/naruto/config-v1.json'
      - 'venues/tokuyama/config-v1.json'
      - 'venues/ashiya/config-v1.json'
      - 'venues/gamagori/config-v1.json'
  schedule:
    # Freeze daily TRY selections at 07:30 JST, after early Karatsu PRE-RACE snapshots.
    - cron: '30 22 * * *'
    # Independent reconciliation if a collector completion event is delayed or missed.
    # Existing TRY selections are immutable; only POST-derived settlement is rebuilt.
    - cron: '15,35,55 0-15 * * *'
  workflow_run:
    workflows:
      - 'Venue POST-RACE batch generic v1'
      - 'Toda POST-RACE result collector v1'
      - 'Edogawa POST-RACE result collector v1'
      - 'Karatsu POST-RACE result collector v1'
      - 'Mikuni POST-RACE result collector v1'
      - 'Naruto POST-RACE result collector v1'
      - 'Tokuyama POST-RACE result collector v1'
      - 'Ashiya POST-RACE result collector v1'
    types: [completed]

permissions:
  contents: write

concurrency:
  group: shared-try-portfolio-v1
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover only missing POST results for frozen pending TRY
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python scripts/test-partial-cancellation-v1.py
          python - <<'PYCODE'
          import json,subprocess,pathlib,shutil
          p=json.load(open('shared-try-portfolio-v1.json'))
          rows=[x for x in p.get('ledger',[]) if not x.get('settled')]
          for date,code,venue in sorted({(x['date'],x['venueCode'],x['venue']) for x in rows}):
              cfg=json.load(open('shared-try-config-v1.json'))
              adapter=next(a for a in cfg['activeAdapters'] if a['venueCode']==code)
              subprocess.run(['python','scripts/venue-post-result-v1.py','--slug',adapter['slug'],'--venue',venue,'--code',code,'--date',date,'--recover-pending'],check=True)
          for row in rows:
              adapter=next(a for a in cfg['activeAdapters'] if a['venueCode']==row['venueCode'])
              for suffix in ('result','status'):
                  src=pathlib.Path('live')/adapter['slug']/row['date']/'post'/f"race-{row['race']}-{suffix}.json"
                  if src.exists():
                      dst=pathlib.Path('/tmp/recovered-post')/src
                      dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst)
          PYCODE

      - name: Build immutable TRY selection and settle shared virtual bankroll
        run: |
          set -euo pipefail
          node --check scripts/shared-try-portfolio-v1.js
          node scripts/shared-try-portfolio-v1.js

      - name: Boundary audit
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('shared-try-portfolio-v1.json','utf8'));
          const cfg=JSON.parse(fs.readFileSync('shared-try-config-v1.json','utf8'));
          if(p.realMoney!==false)throw new Error('REAL_MONEY_MUST_BE_FALSE');
          if(p.startingBankrollYen!==Number(cfg.startingBankrollYen))throw new Error('START_BANKROLL_CONFIG_MISMATCH');
          if(Number(p.confirmedBankrollYen)!==Number(cfg.startingBankrollYen)+Number(p.profitYen||0))throw new Error('CONFIRMED_BANKROLL_IDENTITY');
          if(Number(p.availableBankrollYen)!==Number(p.confirmedBankrollYen)-Number(p.pendingStakeYen||0))throw new Error('AVAILABLE_BANKROLL_IDENTITY');
          if(p.capitalPolicy?.resetAllowed!==false)throw new Error('CAPITAL_MUST_NOT_AUTO_RESET');
          if(p.boundaries?.resultInputForSelection!==false||p.boundaries?.payoutInputForSelection!==false)throw new Error('SELECTION_LEAKAGE');
          for(const row of p.ledger||[]){
            if(!Array.isArray(row.picks)||![4,6,8].includes(row.picks.length))throw new Error('TRY_PICKS');
            const selection=JSON.parse(fs.readFileSync(`live/portfolio/${row.date}/try-selection-v1.json`,'utf8'));
            const frozen=selection.selected.find(x=>x.venueCode===row.venueCode&&Number(x.race)===Number(row.race));
            if(!frozen||JSON.stringify(row.picks)!==JSON.stringify(frozen.picks)||Number(row.stakeYen)!==Number(frozen.stakeYen)||Number(row.stakeYen)!==row.picks.length*Number(frozen.stakePerPickYen)||Number(frozen.stakePerPickYen)<100||Number(frozen.stakePerPickYen)%100!==0)throw new Error('VARIABLE_STAKE_IDENTITY');
            if(selection.riskBudget){
              const b=selection.riskBudget,total=selection.selected.reduce((s,x)=>s+Number(x.stakeYen),0);
              if(total!==selection.totalCommittedStakeYen||total>b.dailyLimitYen||Number(row.stakeYen)>b.raceLimitYen||b.dailyLimitYen>Math.floor(b.capitalBasisYen*b.maxDailyBankrollFraction)||b.raceLimitYen>Math.min(b.maxRaceStakeYen,Math.floor(b.capitalBasisYen*b.maxRaceBankrollFraction)))throw new Error('RISK_BUDGET_EXCEEDED');
            }
          }
          console.log('SHARED_TRY_PORTFOLIO_BOUNDARY_PASS');
          NODE

      - name: Publish generated simulation state
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- shared-try-portfolio-v1.json live/portfolio)" ]; then
            echo 'NO_SHARED_TRY_CHANGE'
            exit 0
          fi
          cp shared-try-portfolio-v1.json /tmp/shared-try-portfolio-v1.json
          rm -rf /tmp/portfolio-day
          if [ -d "live/portfolio/$(TZ=Asia/Tokyo date +%F)" ]; then
            cp -R "live/portfolio/$(TZ=Asia/Tokyo date +%F)" /tmp/portfolio-day
          fi
          git config user.name 'boat-command-shared-try'
          git config user.email 'boat-command-shared-try@users.noreply.github.com'
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            # Restore only newly recovered immutable POST; rebuild against latest main.
            python - <<'PYCODE'
          import pathlib,shutil,subprocess
          for src in pathlib.Path('/tmp/recovered-post').rglob('race-*.json'):
              dst=pathlib.Path(src.relative_to('/tmp/recovered-post'))
              if dst.exists():
                  if dst.read_bytes()!=src.read_bytes():subprocess.run(['python','scripts/immutable-post-compare-v1.py',str(src),str(dst)],check=True)
              else:
                  dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst)
          PYCODE
            if [ -d /tmp/portfolio-day ]; then
              mkdir -p "live/portfolio/$(TZ=Asia/Tokyo date +%F)"
              DST="live/portfolio/$(TZ=Asia/Tokyo date +%F)/try-selection-v1.json"
              SRC=/tmp/portfolio-day/try-selection-v1.json
              if [ -f "$SRC" ]; then
                if [ -f "$DST" ]; then cmp -s "$SRC" "$DST" || { echo SELECTION_IMMUTABILITY_CONFLICT; exit 1; }
                else cp "$SRC" "$DST"; fi
              fi
            fi
            node scripts/shared-try-portfolio-v1.js
            git add shared-try-portfolio-v1.json live/portfolio
            if [ -d /tmp/recovered-post ]; then
              while IFS= read -r src; do git add "${src#/tmp/recovered-post/}"; done < <(find /tmp/recovered-post -name 'race-*.json')
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'sim: update shared virtual TRY portfolio'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*2))
          done
          echo 'SHARED_TRY_PUBLISH_FAILED'
          exit 1

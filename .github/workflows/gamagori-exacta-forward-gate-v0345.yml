name: Gamagori exacta forward shadow gate v0.34.5

on:
  workflow_dispatch:
  push:
    paths:
      - 'live/gamagori/**/program/race-3.json'
      - 'scripts/gamagori-exacta-forward-gate-v0345.js'
      - 'gamagori-main-model-v0320.js'
      - 'gamagori-main-history-v0320.json'
      - '.github/workflows/gamagori-exacta-forward-gate-v0345.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-exacta-forward-shadow-v0345
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze latest 3R exacta shadow gate
        run: node scripts/gamagori-exacta-forward-gate-v0345.js
      - name: Commit frozen shadow decision
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- live/gamagori)" ]; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-shadow'
          git config user.email 'boat-command-shadow@users.noreply.github.com'
          git add live/gamagori/*/shadow/race-3-exacta-gate-v0345.json
          if git diff --cached --quiet; then
            echo 'NO_SHADOW_CHANGES'
            exit 0
          fi
          git commit -m 'shadow(gamagori): freeze 3R exacta gate v0.34.5'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          exit 1

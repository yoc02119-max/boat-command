name: Gamagori LIVE auto-fill v0.20.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'live-autofill-v0201.js'
      - 'index.html'
      - '.github/workflows/gamagori-live-autofill-v0201.yml'

permissions:
  contents: read

concurrency:
  group: gamagori-live-autofill-v0201
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate auto-fill JavaScript
        run: |
          set -euo pipefail
          node --check live-autofill-v0201.js

      - name: Verify current app integration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          s=Path('index.html').read_text()
          scripts=re.findall(r'<script\s+src="([^"]+)"',s)
          bases=[x.split('?',1)[0].split('/')[-1] for x in scripts]

          target='live-autofill-v0201.js'
          predictor='live-predictor-v0200.js'
          skip_gate='live-skip-gate-v0225.js'
          lock_guard='live-lock-guard-v0202.js'

          if bases.count(target)!=1:
              raise SystemExit(f'AUTOFILL_SCRIPT_COUNT_INVALID:{bases.count(target)}')
          for required in (predictor,skip_gate,lock_guard):
              if bases.count(required)!=1:
                  raise SystemExit(f'REQUIRED_SCRIPT_COUNT_INVALID:{required}:{bases.count(required)}')

          pos={name:bases.index(name) for name in (predictor,skip_gate,target,lock_guard)}
          if not (pos[predictor] < pos[skip_gate] < pos[target] < pos[lock_guard]):
              raise SystemExit(f'AUTOFILL_SCRIPT_ORDER_INVALID:{pos}')

          src=next(x for x in scripts if x.split('?',1)[0].split('/')[-1]==target)
          m=re.search(r'(?:^|[?&])v=([^&]+)',src)
          if not m or not m.group(1):
              raise SystemExit('AUTOFILL_CACHE_KEY_MISSING')

          print('AUTO_FILL_INTEGRATION_OK',src)
          PY

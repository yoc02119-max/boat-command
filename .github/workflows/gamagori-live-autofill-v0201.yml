name: Gamagori LIVE auto-fill v0.20.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'live-autofill-v0201.js'
      - '.github/workflows/gamagori-live-autofill-v0201.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-live-autofill-v0201
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate auto-fill JavaScript
        run: |
          set -euo pipefail
          node --check live-autofill-v0201.js

      - name: Enable module and bump app version
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BOAT COMMAND v0.20.0','BOAT COMMAND v0.20.1')
          s=s.replace('v0.20.0 · LIVE PREDICT','v0.20.1 · LIVE AUTO FILL')
          s=s.replace('styles.css?v=200','styles.css?v=201')
          s=s.replace('app.js?v=200','app.js?v=201')
          s=s.replace('live-autopoll-v0199.js?v=200','live-autopoll-v0199.js?v=201')
          s=s.replace('live-predictor-v0200.js?v=200','live-predictor-v0200.js?v=201')
          tag='<script src="live-autofill-v0201.js?v=201"></script>'
          if tag not in s:
              anchor='<script src="live-predictor-v0200.js?v=201"></script>'
              if anchor not in s:
                  anchor='<script src="live-predictor-v0200.js?v=200"></script>'
              if anchor not in s:
                  raise SystemExit('PREDICTOR_SCRIPT_ANCHOR_NOT_FOUND')
              s=s.replace(anchor,anchor+'\n'+tag)
          p.write_text(s)
          PY

      - name: Commit app auto-fill enablement
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-relay'
          git config user.email 'boat-command-relay@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: enable safe Gamagori LIVE candidate auto-fill'
          git push

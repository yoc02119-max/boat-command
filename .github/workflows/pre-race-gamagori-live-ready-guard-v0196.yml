name: PRE-RACE Gamagori live-ready guard v0.19.6

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real PRE-RACE values and dispatch auto-chain only when READY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%F)
          HD="${DATE//-/}"
          CODE=07
          BASE='https://www.boatrace.jp/owpc/pc/race'
          mkdir -p tmp_guard

          RACELIST="$BASE/racelist?hd=$HD&jcd=$CODE&rno=1"
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-LIVE-GUARD/0.19.6' \
            "$RACELIST" -o tmp_guard/racelist.html

          export DATE
          RACE=$(python3 - <<'PY'
          import re,html,datetime,pathlib,os
          from zoneinfo import ZoneInfo
          text=pathlib.Path('tmp_guard/racelist.html').read_text(encoding='utf-8',errors='replace')
          plain=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',text)))
          times=re.findall(r'(?<!\d)([0-2]?\d:[0-5]\d)(?!\d)',plain)
          if len(times)<12:
              print('')
              raise SystemExit
          now=datetime.datetime.now(ZoneInfo('Asia/Tokyo'))
          date=os.environ['DATE']
          for i,t in enumerate(times[:12],1):
              hh,mm=map(int,t.split(':'))
              dt=datetime.datetime.fromisoformat(date).replace(hour=hh,minute=mm,tzinfo=ZoneInfo('Asia/Tokyo'))
              if (dt-now).total_seconds()/60 >= 5:
                  print(i)
                  break
          else:
              print('')
          PY
          )

          if [ -z "$RACE" ]; then
            echo 'NO_ELIGIBLE_RACE'
            exit 0
          fi

          BEFOREINFO="$BASE/beforeinfo?hd=$HD&jcd=$CODE&rno=$RACE"
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-LIVE-GUARD/0.19.6' \
            "$BEFOREINFO" -o tmp_guard/beforeinfo.html

          export RACE
          READY=$(python3 - <<'PY'
          import re,html,pathlib
          from html.parser import HTMLParser

          raw=pathlib.Path('tmp_guard/beforeinfo.html').read_bytes()
          text=None
          for enc in ('utf-8','cp932','shift_jis','euc_jp'):
              try:
                  text=raw.decode(enc); break
              except UnicodeDecodeError:
                  pass
          if text is None: text=raw.decode('utf-8','replace')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth=0; self.in_cell=False
                  self.cell=[]; self.row=[]; self.table=[]; self.tables=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='table':
                      if self.depth==0:self.table=[]
                      self.depth+=1
                  elif tag in ('td','th') and self.depth:
                      self.in_cell=True; self.cell=[]
                  elif tag=='tr' and self.depth:
                      self.row=[]
                  elif tag=='br' and self.in_cell:
                      self.cell.append(' / ')
              def handle_data(self,data):
                  if self.in_cell:self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.in_cell:
                      self.row.append(re.sub(r'\s+',' ',html.unescape(''.join(self.cell))).strip())
                      self.in_cell=False; self.cell=[]
                  elif tag=='tr' and self.depth and self.row:
                      if any(self.row):self.table.append(self.row)
                      self.row=[]
                  elif tag=='table' and self.depth:
                      self.depth-=1
                      if self.depth==0 and self.table:
                          self.tables.append(self.table); self.table=[]

          p=P(); p.feed(text)
          ex={}; st={}
          for t in p.tables:
              joined=' '.join(' '.join(r) for r in t[:6])
              if '展示' in joined and 'タイム' in joined and '体重' in joined:
                  for row in t:
                      if not row or row[0] not in set('123456'): continue
                      if len(row)>4 and re.fullmatch(r'\d+\.\d+',row[4].strip()):
                          ex[int(row[0])]=float(row[4])
                  if len(ex)==6: break
          for t in p.tables:
              joined=' '.join(' '.join(r) for r in t)
              if 'スタート展示' not in joined: continue
              for row in t:
                  s=' '.join(row)
                  m=re.search(r'([1-6])\s+(F)?\.?([0-9]{2})',s)
                  if m: st[int(m.group(1))]=('F.' if m.group(2) else '.')+m.group(3)
              if len(st)==6: break

          ready=(len(ex)==6 and len(st)==6)
          print('true' if ready else 'false')
          print(f'GUARD race={__import__("os").environ["RACE"]} exhibition={len(ex)}/6 start={len(st)}/6 ready={ready}',file=__import__('sys').stderr)
          PY
          )

          if [ "$READY" != 'true' ]; then
            echo "WAIT · race=$RACE · real exhibition/start values not complete"
            exit 0
          fi

          echo "READY · race=$RACE · real exhibition/start values complete"
          gh workflow run pre-race-gamagori-auto-chain-v0194.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'DISPATCHED · verified auto-chain v0.19.4'

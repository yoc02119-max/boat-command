name: Toda feature contract v1

on:
  push:
    branches: [main]
    paths:
      - 'toda-feature-contract-v1.js'
      - 'scripts/toda-feature-contract-test-v1.js'
      - '.github/workflows/toda-feature-contract-v1.yml'
  pull_request:
    paths:
      - 'toda-feature-contract-v1.js'
      - 'scripts/toda-feature-contract-test-v1.js'
      - '.github/workflows/toda-feature-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check toda-feature-contract-v1.js
      - run: node --check scripts/toda-feature-contract-test-v1.js
      - run: node scripts/toda-feature-contract-test-v1.js

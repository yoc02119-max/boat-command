name: Gamagori forward strategy dashboard v0.34.7

on:
  workflow_dispatch:
  push:
    paths:
      - 'live/gamagori/**/program/manifest.json'
      - 'live/gamagori/**/shadow/all-race-try-gates-v0349.json'
      - 'live/gamagori/**/post/**'
      - 'scripts/gamagori-forward-status-v0347.js'
      - 'gamagori-main-model-v0320.js'
      - 'gamagori-main-history-v0320.json'
      - 'gamagori-forward-validation-policy-v0346.json'
      - '.github/workflows/gamagori-forward-status-v0347.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-forward-status-v0347
  cancel-in-progress: true

jobs:
  build-status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build forward strategy status
        run: |
          node --check scripts/gamagori-forward-status-v0347.js
          node scripts/gamagori-forward-status-v0347.js

      - name: Commit frozen gate and dashboard status
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- live/gamagori)" ]; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-shadow'
          git config user.email 'boat-command-shadow@users.noreply.github.com'
          git add live/gamagori/forward-status-v0347.json
          if git diff --cached --quiet; then
            echo 'NO_STATUS_CHANGES'
            exit 0
          fi
          git commit -m 'shadow(gamagori): update all-race TRY dashboard'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          exit 1

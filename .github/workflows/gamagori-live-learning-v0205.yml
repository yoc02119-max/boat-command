name: Gamagori LIVE learning records v0.20.5

on:
  workflow_dispatch:
  push:
    paths:
      - 'live-learning-v0205.js'
      - '.github/workflows/gamagori-live-learning-v0205.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-live-learning-v0205
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate learning JavaScript
        run: node --check live-learning-v0205.js
      - name: Enforce singleton learning bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BOAT COMMAND v0.21.1','BOAT COMMAND v0.21.4')
          s=s.replace('v0.21.1 · RUNTIME AUDIT','v0.21.4 · RESULT METHOD')
          # Remove every prior cache-busted copy, then insert exactly one after result layer.
          s=re.sub(r'\n?<script src="live-learning-v0205\.js\?v=\d+"></script>','',s)
          anchor='<script src="live-result-v0204.js?v=214"></script>'
          tag='<script src="live-learning-v0205.js?v=214"></script>'
          if anchor not in s:
              raise SystemExit('LEARNING_BOOTSTRAP_ANCHOR_MISSING')
          s=s.replace(anchor,anchor+'\n'+tag,1)
          if s.count('live-learning-v0205.js')!=1:
              raise SystemExit('LEARNING_BOOTSTRAP_SINGLETON_FAIL')
          p.write_text(s)
          PY
      - name: Commit app learning enablement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
          else
            git commit -m 'app: maintain singleton Gamagori LIVE learning bootstrap'
            git push
          fi

name: Gamagori app LIVE auto-poll v0.19.9

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-app-autopoll-v0199.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-app-autopoll-v0199
  cancel-in-progress: false

jobs:
  patch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable automatic LIVE relay polling module
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BOAT COMMAND v0.19.8','BOAT COMMAND v0.19.9')
          s=s.replace('v0.19.8 · LIVE VERIFIED','v0.19.9 · LIVE AUTO')
          s=s.replace('app.js?v=198','app.js?v=199')
          s=s.replace('styles.css?v=198','styles.css?v=199')
          tag='<script src="live-autopoll-v0199.js?v=199"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY

      - name: Commit app auto-poll enablement
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-relay'
          git config user.email 'boat-command-relay@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: enable automatic verified Gamagori LIVE refresh'
          git push

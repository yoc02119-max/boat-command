name: Gamagori learning promotion guard v0.20.7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-live-learning-guard-v0207.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate learning guard JavaScript
        run: node --check live-learning-guard-v0207.js
      - name: Enforce singleton learning guard bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'\n?<script src="live-learning-guard-v0207\.js\?v=\d+"></script>','',s)
          anchor_re=r'(<script src="live-learning-dashboard-v0206\.js\?v=\d+"></script>)'
          if not re.search(anchor_re,s):
              raise SystemExit('LEARNING_GUARD_ANCHOR_MISSING')
          tag='<script src="live-learning-guard-v0207.js?v=214"></script>'
          s=re.sub(anchor_re,lambda m:m.group(1)+'\n'+tag,s,count=1)
          if s.count('live-learning-guard-v0207.js')!=1:
              raise SystemExit('LEARNING_GUARD_SINGLETON_FAIL')
          p.write_text(s)
          PY
      - name: Verify safety boundaries
        run: |
          grep -q 'autoPromotion:false' live-learning-guard-v0207.js
          grep -q 'productionPredictorChanged:false' live-learning-guard-v0207.js
          grep -q 'live-learning-v0205.js' index.html
          grep -q 'live-learning-dashboard-v0206.js' index.html
          grep -q 'live-learning-guard-v0207.js' index.html
      - name: Commit app learning guard enablement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'NO_CHANGES'; exit 0; fi
          git commit -m 'app: maintain singleton Gamagori learning promotion guard bootstrap'
          git push

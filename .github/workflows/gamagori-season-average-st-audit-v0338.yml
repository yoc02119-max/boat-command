name: Gamagori season averageST source audit v0.33.8
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gamagori-season-average-st-audit-v0338.py'
      - 'scripts/gamagori-season-average-st-contract-v0338.py'
      - '.github/workflows/gamagori-season-average-st-audit-v0338.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen ST reconstruction contract
        run: python3 scripts/gamagori-season-average-st-contract-v0338.py
      - name: Syntax check fail-closed season parser
        run: python3 -m py_compile scripts/gamagori-season-average-st-audit-v0338.py
      - name: Guard against result leakage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/gamagori-season-average-st-audit-v0338.py').read_text()
          assert "'resultArchiveOpened':False" in s
          assert 'COLUMN_LAYOUT_REVIEW_REQUIRED' in s
          print('PASS averageST parser remains PRE-only and fail-closed')
          PY

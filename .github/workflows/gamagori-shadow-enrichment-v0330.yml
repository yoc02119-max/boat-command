name: GAMAGORI SHADOW pre-race enrichment v0.33.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamagori-shadow-enrichment-v0330.yml
      - scripts/gamagori-shadow-enrich-v0330.py

permissions:
  contents: write

concurrency:
  group: gamagori-shadow-enrichment-v0330
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - name: Collect one result-free pre-race shard
        run: |
          set -euo pipefail
          python3 scripts/gamagori-shadow-enrich-v0330.py \
            --shard "${{ matrix.shard }}" \
            --shards 6 \
            --output "shadow-pre-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-pre-shard-${{ matrix.shard }}
          path: shadow-pre-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: shadow-pre-shard-*
          path: shadow-pre-shards
          merge-multiple: true
      - name: Prove and merge 360 pre-race records
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, pathlib

          paths=sorted(pathlib.Path('shadow-pre-shards').glob('shadow-pre-shard-*.json'))
          if len(paths)!=6:raise SystemExit(f'SHARD_COUNT_INVALID {len(paths)}')
          shards=[json.loads(path.read_text(encoding='utf-8')) for path in paths]
          races=[race for shard in shards for race in shard['races']]
          dates=sorted({date for shard in shards for date in shard['dates']})
          ids=[race['id'] for race in races]
          failures=[failure for shard in shards for failure in shard['failures']]
          audit={
              'schema':'boat-command-shadow-enrichment-audit-v1','target':'LATEST_30_RACE_DAYS',
              'firstDate':dates[0] if dates else None,'lastDate':dates[-1] if dates else None,
              'dates':len(dates),'expectedRaces':360,'validRaces':len(races),'failures':failures,
              'duplicateIds':len(ids)-len(set(ids)),'outcomeFieldsIncluded':False,
              'resultOddsIncluded':False,'exhibitionIncluded':False,
              'ready':len(races)==360 and len(dates)==30 and not failures and len(ids)==len(set(ids))
          }
          pathlib.Path('gamagori-shadow-enrichment-audit-v0330.json').write_text(
              json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          if not audit['ready']:raise SystemExit(f'ENRICHMENT_INCOMPLETE {audit}')
          races.sort(key=lambda race:(race['date'],race['race']))
          data={
              'schema':'boat-command-shadow-pre-race-v1','venue':'GAMAGORI','venueCode':'07',
              'target':'LATEST_30_RACE_DAYS','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'firstDate':dates[0],'lastDate':dates[-1],'raceDays':30,'races':races,
              'outcomeFieldsIncluded':False,'resultOddsIncluded':False,'exhibitionIncluded':False
          }
          pathlib.Path('gamagori-shadow-pre-v0330.json').write_text(
              json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('SHADOW_ENRICHMENT_PASS',audit)
          PY
      - name: Commit immutable SHADOW pre-race enrichment
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gamagori-shadow-pre-v0330.json gamagori-shadow-enrichment-audit-v0330.json
          git diff --cached --quiet && exit 0
          git commit -m "data(gamagori): add 360-race shadow pre-race enrichment"
          git pull --rebase origin main
          git push origin HEAD:main

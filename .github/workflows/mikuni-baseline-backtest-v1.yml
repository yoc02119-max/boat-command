name: Mikuni baseline backtest v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Mikuni history bootstrap 180d v1"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: mikuni-baseline-backtest-v1
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh main after bootstrap
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            git fetch origin main && git reset --hard origin/main
            test -f mikuni-history-bootstrap-v1.json && exit 0
            sleep 5
          done
          exit 1
      - name: Strict Mikuni walk-forward baseline
        run: |
          set -euo pipefail
          node --check scripts/mikuni-baseline-backtest-v1.js
          node scripts/mikuni-baseline-backtest-v1.js
          node - <<'NODE'
          const x=require('./mikuni-baseline-backtest-v1.json');
          if(x.schema!=='boat-command-mikuni-baseline-backtest-v1'||x.venueCode!=='10')throw new Error('MIKUNI_TARGET');
          if(x.strictWalkForward!==true||x.sameDayRowsExcluded!==true||x.resultBlockedUntilPrediction!==true)throw new Error('TIME_BOUNDARY');
          if(x.crossVenueWeightsReused!==false||x.productionEnabled!==false||x.tryEnabled!==false)throw new Error('MODEL_BOUNDARY');
          if(!x.holdout?.programOnly4?.races||!x.holdout?.classBaseline4?.races)throw new Error('NO_PAIRED_HOLDOUT');
          if(x.primaryRecencyWindowRaces!==300)throw new Error('RECENCY_WINDOW');
          if(typeof x.holdout.candidateUplift!=='boolean')throw new Error('UPLIFT_FLAG');
          console.log('MIKUNI_BASELINE_PASS',{classBaseline4:x.holdout.classBaseline4,programOnly4:x.holdout.programOnly4,hitRateDelta:x.holdout.hitRateDelta,roiDelta:x.holdout.roiDelta,candidateUplift:x.holdout.candidateUplift});
          NODE
      - name: Commit Mikuni baseline
        run: |
          set -euo pipefail
          cp mikuni-baseline-backtest-v1.json /tmp/mikuni-baseline-backtest-v1.json
          git config user.name 'boat-command-mikuni-model'
          git config user.email 'boat-command-mikuni-model@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mikuni-baseline-backtest-v1.json mikuni-baseline-backtest-v1.json
            git add mikuni-baseline-backtest-v1.json
            git diff --cached --quiet && { echo 'MIKUNI_BASELINE_CURRENT'; exit 0; }
            git commit -m 'analysis(mikuni): publish strict venue-specific baseline'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "MIKUNI_BASELINE_PUSH_RETRY attempt=$attempt"
            sleep 3
          done
          echo 'MIKUNI_BASELINE_PUSH_RETRY_EXHAUSTED' >&2
          exit 1

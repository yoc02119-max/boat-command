name: Gamagori LIVE PRE-RACE dispatcher v0.25.2 (manual only)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: gamagori-live-pre-race-dispatcher
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Gate to Gamagori meeting dates and night-race window
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%F)
          HM=$(TZ=Asia/Tokyo date +%H%M)
          active=false
          case "$DATE" in
            2026-09-1[3-8]|2026-09-29|2026-09-30|2026-10-0[1-4]|2026-10-0[7-9]|2026-10-10|2026-10-2[7-9]|2026-10-30|2026-10-31|2026-11-01|2026-11-0[9]|2026-11-1[0-4]|2026-11-2[1-4]|2026-11-2[7-9]|2026-11-30|2026-12-0[1-2]|2026-12-0[6-9]|2026-12-10|2026-12-11|2026-12-2[5-9]) active=true ;;
          esac
          # 蒲郡ナイターのPRE-RACE取得に必要な時間帯だけ動かす。UTC cronでも判定はJST。
          if [ "$active" = true ] && [ "$HM" -ge 1445 ] && [ "$HM" -le 2045 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "GAMAGORI_WINDOW_OPEN $DATE $HM JST"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "GAMAGORI_WINDOW_CLOSED $DATE $HM JST"
          fi

      - name: Dispatch verified PRE-RACE auto-chain
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pre-race-gamagori-auto-chain-v0194.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'GAMAGORI_PRE_RACE_CHAIN_DISPATCHED'

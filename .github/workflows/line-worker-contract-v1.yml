name: LINE Worker contract v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'line-worker/**'
      - 'line/intent-routes.json'
      - '.github/workflows/line-worker-contract-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate intent contract
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path('line/intent-routes.json').read_text(encoding='utf-8'))
          assert p['schema'] == 'boat-command-line-intents-v1'
          assert isinstance(p['intents'], list) and p['intents']
          names = [x['name'] for x in p['intents']]
          assert len(names) == len(set(names))
          for x in p['intents']:
              assert isinstance(x['name'], str) and x['name']
              assert isinstance(x['patterns'], list) and x['patterns']
              assert all(isinstance(y, str) and y for y in x['patterns'])
          print('LINE_INTENT_CONTRACT_PASS')

      - name: Validate representative intent routing
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          p = json.loads(Path('line/intent-routes.json').read_text(encoding='utf-8'))
          routes = p['intents']

          def detect(text):
              for route in routes:
                  for pattern in route['patterns']:
                      if re.search(pattern, text, flags=re.I):
                          return route['name']
              return None

          samples = {
              '進捗どう？': 'progress',
              '試せる？': 'trial',
              '今日の蒲郡は？': 'today_gamagori',
              '次のレースはいつ？': 'next_race',
              '次回開催はいつから？': 'next_event',
              '蒲郡次いつ？': 'next_event',
              '次節いつ？': 'next_event',
              'このあと何する？': 'next_task',
              '何ができる？': 'help',
          }
          for text, expected in samples.items():
              actual = detect(text)
              assert actual == expected, f'{text}: expected={expected} actual={actual}'
          print('LINE_INTENT_ROUTING_PASS')

      - name: Validate Worker config
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path('line-worker/wrangler.jsonc').read_text(encoding='utf-8'))
          assert p['name'] == 'boat-command-line-webhook'
          assert p['main'] == 'src/index.js'
          kv = p.get('kv_namespaces') or []
          learning = [x for x in kv if x.get('binding') == 'LEARNING_QUEUE']
          assert len(learning) == 1, learning
          namespace_id = learning[0].get('id', '')
          assert len(namespace_id) == 32 and all(c in '0123456789abcdef' for c in namespace_id.lower())
          print('LINE_WORKER_CONFIG_PASS')
          print('LINE_LEARNING_KV_BINDING_PASS')

      - name: Check JavaScript syntax
        working-directory: line-worker
        run: node --check src/index.js

      - name: Validate required safety strings
        shell: python
        run: |
          from pathlib import Path
          s = Path('line-worker/src/index.js').read_text(encoding='utf-8')
          required = [
              'x-line-signature',
              'LINE_CHANNEL_SECRET',
              'LINE_CHANNEL_ACCESS_TOKEN',
              'Invalid signature',
              'LEARNING_QUEUE',
              'ユーザーIDやグループIDは保存していません',
          ]
          for item in required:
              assert item in s, item
          assert 'github_pat_' not in s
          assert 'Channel secret' not in s
          print('LINE_WORKER_SAFETY_CONTRACT_PASS')

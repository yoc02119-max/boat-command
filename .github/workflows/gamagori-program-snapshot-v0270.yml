name: Gamagori 12R program snapshot v0.27.0 (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamagori-program-snapshot-v0270
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect result-free 12R program snapshots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, html, json, os, pathlib, re, time, urllib.request
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo

          JST=ZoneInfo('Asia/Tokyo')
          now=datetime.datetime.now(JST)
          targets=[now.date()]
          # The next day's program is often published the night before. Capture it early when available.
          if now.hour >= 21:
              targets.append(now.date()+datetime.timedelta(days=1))

          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth=0; self.in_cell=False
                  self.cell=[]; self.row=[]; self.table=[]; self.tables=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='table':
                      if self.depth==0:self.table=[]
                      self.depth+=1
                  elif tag in ('td','th') and self.depth:
                      self.in_cell=True; self.cell=[]
                  elif tag=='tr' and self.depth:
                      self.row=[]
                  elif tag=='br' and self.in_cell:
                      self.cell.append(' / ')
              def handle_data(self,data):
                  if self.in_cell:self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.in_cell:
                      self.row.append(re.sub(r'\s+',' ',html.unescape(''.join(self.cell))).strip())
                      self.in_cell=False; self.cell=[]
                  elif tag=='tr' and self.depth:
                      if self.row and any(self.row): self.table.append(self.row)
                      self.row=[]
                  elif tag=='table' and self.depth:
                      self.depth-=1
                      if self.depth==0 and self.table:
                          self.tables.append(self.table); self.table=[]

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'BOAT-COMMAND-PROGRAM-SNAPSHOT/0.27.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read()
              for enc in ('utf-8','cp932','shift_jis','euc_jp'):
                  try:return raw.decode(enc)
                  except UnicodeDecodeError: pass
              return raw.decode('utf-8','replace')

          def parse_race(text, date_s, race):
              p=Tables(); p.feed(text)
              plain=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',text)))
              times=re.findall(r'(?<!\d)([0-2]?\d:[0-5]\d)(?!\d)',plain)
              deadline=times[race-1] if len(times)>=12 else None
              racer=None
              for t in p.tables:
                  joined=' '.join(' '.join(r) for r in t[:8])
                  if all(k in joined for k in ('級別','モーター','ボート')):
                      racer=t; break
              if racer is None:return None
              lane_map={'１':1,'２':2,'３':3,'４':4,'５':5,'６':6}
              boats={}
              for row in racer:
                  if not row:continue
                  raw_lane=row[0].strip()
                  if raw_lane not in set(lane_map)|set('123456'):continue
                  lane=lane_map.get(raw_lane,int(raw_lane) if raw_lane.isdigit() else None)
                  joined=' | '.join(row)
                  m=re.search(r'(\d{4})\s*/\s*(A1|A2|B1|B2)',joined)
                  if not m:continue
                  reg=int(m.group(1)); cls=m.group(2)
                  name=''
                  # The racer name is normally in the same cell after registration/class.
                  mm=re.search(r'\d{4}\s*/\s*(?:A1|A2|B1|B2)\s+([^|/]+)',joined)
                  if mm:name=re.sub(r'\s+',' ',mm.group(1)).strip()
                  motor=boat=None
                  motor2_rate=boat2_rate=None
                  # Current official desktop table places motor/boat in cells 6/7.
                  if len(row)>7:
                      mo=re.match(r'\s*(\d+)\s*/',row[6]); bo=re.match(r'\s*(\d+)\s*/',row[7])
                      motor=int(mo.group(1)) if mo else None
                      boat=int(bo.group(1)) if bo else None
                      mr=re.search(r'/\s*([0-9]+(?:\.[0-9]+)?)',row[6])
                      br=re.search(r'/\s*([0-9]+(?:\.[0-9]+)?)',row[7])
                      motor2_rate=round(float(mr.group(1))/100,4) if mr else None
                      boat2_rate=round(float(br.group(1))/100,4) if br else None
                  boats[lane]={'lane':lane,'registration':reg,'name':name,'class':cls,'motor':motor,'boat':boat,'motor2Rate':motor2_rate,'boat2Rate':boat2_rate}
              if len(boats)!=6 or set(boats)!={1,2,3,4,5,6}:return None
              race_types=['ドリーム戦','準優勝戦','準優進出戦','優勝戦','予選特選','一般特選','一般特賞','選抜戦','予選','一般戦','一般','特選']
              race_type=next((x for x in race_types if x in plain),'')
              return {
                  'schema':'boat-command-program-pack-v1',
                  'venue':'GAMAGORI','venueCode':'07','date':date_s,'race':race,
                  'fetchedAt':datetime.datetime.now(JST).isoformat(),
                  'deadline':deadline,'raceType':race_type,
                  'boats':[boats[i] for i in range(1,7)],
                  'programReady':True,
                  'exhibitionIncluded':False,
                  'resultEndpointsIncluded':False,
                  'resultIncluded':False,
                  'source':'BOAT RACE official racelist'
              }

          wrote=[]
          for d in targets:
              date_s=d.isoformat(); hd=date_s.replace('-','')
              packs=[]
              for race in range(1,13):
                  url=f'https://www.boatrace.jp/owpc/pc/race/racelist?hd={hd}&jcd=07&rno={race}'
                  try:
                      text=fetch(url)
                      pack=parse_race(text,date_s,race)
                  except Exception as e:
                      print(f'PROGRAM_FETCH_ERROR date={date_s} race={race} error={e}')
                      pack=None
                  if not pack:
                      packs=[]
                      print(f'PROGRAM_WAIT date={date_s} race={race} reason=incomplete_official_racelist')
                      break
                  packs.append(pack)
                  time.sleep(.35)
              if len(packs)!=12:
                  continue
              base=pathlib.Path('live/gamagori')/date_s/'program'
              base.mkdir(parents=True,exist_ok=True)
              for pack in packs:
                  out=base/f'race-{pack["race"]}.json'
                  out.write_text(json.dumps(pack,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              manifest={
                  'schema':'boat-command-program-manifest-v1','venue':'GAMAGORI','date':date_s,
                  'fetchedAt':datetime.datetime.now(JST).isoformat(),'races':12,
                  'allProgramReady':True,'exhibitionIncluded':False,
                  'resultEndpointsIncluded':False,'resultIncluded':False
              }
              (base/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              wrote.append(date_s)
              print(f'PROGRAM_READY_12_OF_12 date={date_s}')

          pathlib.Path('/tmp/program-dates.txt').write_text('\n'.join(wrote),encoding='utf-8')
          PY

      - name: Safety audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          dates=[x for x in pathlib.Path('/tmp/program-dates.txt').read_text().splitlines() if x]
          for date in dates:
              base=pathlib.Path('live/gamagori')/date/'program'
              manifest=json.load(open(base/'manifest.json',encoding='utf-8'))
              assert manifest['races']==12 and manifest['allProgramReady'] is True
              assert manifest['exhibitionIncluded'] is False
              assert manifest['resultEndpointsIncluded'] is False and manifest['resultIncluded'] is False
              for n in range(1,13):
                  p=json.load(open(base/f'race-{n}.json',encoding='utf-8'))
                  assert p['race']==n and len(p['boats'])==6
                  assert [b['lane'] for b in p['boats']]==[1,2,3,4,5,6]
                  assert all(b['class'] in ('A1','A2','B1','B2') for b in p['boats'])
                  assert p['exhibitionIncluded'] is False
                  assert p['resultEndpointsIncluded'] is False and p['resultIncluded'] is False
          print(f'PROGRAM_SAFETY_PASS dates={dates}')
          PY

      - name: Commit program snapshots
        run: |
          set -euo pipefail
          git config user.name 'boat-command-program-relay'
          git config user.email 'boat-command-program-relay@users.noreply.github.com'
          git add live/gamagori/*/program/ 2>/dev/null || true
          git diff --cached --quiet && { echo 'NO_PROGRAM_CHANGE'; exit 0; }
          git commit -m 'live: publish Gamagori result-free 12R program snapshot'
          git pull --rebase origin main
          git push origin HEAD:main

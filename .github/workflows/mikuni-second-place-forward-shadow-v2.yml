name: Mikuni second-place forward shadow v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'live/mikuni/**/program/*.json'
      - 'mikuni-history-bootstrap-v1.json'
      - 'mikuni-research-model-v1.js'
      - 'mikuni-second-place-concentration-guard-v2.json'
      - 'scripts/mikuni-second-place-forward-shadow-v2.js'
      - '.github/workflows/mikuni-second-place-forward-shadow-v2.yml'

permissions:
  contents: write

concurrency:
  group: mikuni-second-place-forward-shadow-v2
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze only result-blind future races
        run: |
          node --check scripts/mikuni-second-place-forward-shadow-v2.js
          node scripts/mikuni-second-place-forward-shadow-v2.js
      - name: Commit immutable forward shadow
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- live/mikuni)" ]; then
            echo NO_ELIGIBLE_FUTURE_RACES
            exit 0
          fi
          git config user.name 'boat-command-shadow'
          git config user.email 'boat-command-shadow@users.noreply.github.com'
          git add 'live/mikuni/*/shadow/second-place-concentration-guard-v2/race-*.json' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo NO_NEW_IMMUTABLE_SHADOW
            exit 0
          fi
          git commit -m 'shadow(mikuni): freeze second-place concentration guard v2'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1

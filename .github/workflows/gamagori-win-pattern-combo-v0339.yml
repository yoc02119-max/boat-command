name: Gamagori win-pattern combo v0.33.9
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamagori-win-pattern-combo-v0339.yml'
      - 'scripts/gamagori-win-pattern-combo-v0339.js'
      - 'gamagori-replay-predictions-v0333.json'
      - 'gamagori-replay-results-v0333.json'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run three-way leakage-safe win-pattern isolation
        run: node scripts/gamagori-win-pattern-combo-v0339.js
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamagori-win-pattern-combo-v0339.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(gamagori): publish win-pattern combo v0.33.9'
          git push

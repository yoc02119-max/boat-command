name: Tokuyama readiness v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tokuyama history bootstrap 180d v1", "Tokuyama history analysis v1", "Tokuyama baseline backtest v1", "Tokuyama 12R program snapshot v1", "Tokuyama PRE-RACE collector v1", "Tokuyama SHADOW research v1", "Tokuyama POST-RACE result collector v1", "Tokuyama SHADOW evaluation v1"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/tokuyama-readiness-v1.yml'
      - 'scripts/tokuyama-readiness-v1.js'
      - 'venues/tokuyama/config-v1.json'
      - 'tokuyama-shadow-evaluation-v1.json'
      - 'live/tokuyama/**/program/**'
      - 'live/tokuyama/**/shadow/**'
      - 'live/tokuyama/**/post/**'

permissions:
  contents: write

concurrency:
  group: tokuyama-readiness-v1
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh current main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Synthesize Tokuyama readiness
        run: |
          set -euo pipefail
          node --check scripts/tokuyama-readiness-v1.js
          node scripts/tokuyama-readiness-v1.js
          node - <<'NODE'
          const x=require('./venues/tokuyama/readiness-v1.json');
          if(x.venueCode!=='18'||x.modelEnabled!==true||x.tryEnabled!==true||x.realMoneyEnabled!==false)throw new Error('TOKUYAMA_VIRTUAL_OPERATION_SAFETY');
          if(x.operation?.active!==true||x.operation?.mainLogicFrozen!==true||x.operation?.sharedBankrollStartYen!==1000000)throw new Error('TOKUYAMA_OPERATION_CONTRACT');
          if(Number(x.history?.rows||0)<300&&x.history?.ready===true)throw new Error('FALSE_HISTORY_READY');
          console.log('TOKUYAMA_READINESS_PASS',x.phase,x.history.rows,x.baseline.holdoutRaces);
          NODE
      - name: Commit readiness when changed
        run: |
          set -euo pipefail
          cp venues/tokuyama/readiness-v1.json /tmp/tokuyama-readiness-v1.json
          git config user.name 'boat-command-tokuyama-readiness'
          git config user.email 'boat-command-tokuyama-readiness@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tokuyama-readiness-v1.json venues/tokuyama/readiness-v1.json
            git add venues/tokuyama/readiness-v1.json
            git diff --cached --quiet && { echo 'TOKUYAMA_READINESS_CURRENT'; exit 0; }
            git commit -m 'status(tokuyama): refresh centralized readiness gate'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          echo 'TOKUYAMA_READINESS_PUBLISH_FAILED'
          exit 1

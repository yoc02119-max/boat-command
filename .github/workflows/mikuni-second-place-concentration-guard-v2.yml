name: Mikuni second-place concentration guard v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/mikuni-second-place-concentration-guard-v2.js'
      - 'mikuni-research-model-v1.js'
      - 'mikuni-history-bootstrap-v1.json'
      - '.github/workflows/mikuni-second-place-concentration-guard-v2.yml'

permissions:
  contents: write

concurrency:
  group: mikuni-second-place-concentration-guard-v2
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run concentration-guard analysis
        run: |
          node --check scripts/mikuni-second-place-concentration-guard-v2.js
          node scripts/mikuni-second-place-concentration-guard-v2.js
      - name: Commit analysis report
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- mikuni-second-place-concentration-guard-v2.json)" ]; then
            echo NO_CHANGES
            exit 0
          fi
          git config user.name 'boat-command-shadow'
          git config user.email 'boat-command-shadow@users.noreply.github.com'
          git add mikuni-second-place-concentration-guard-v2.json
          git commit -m 'analysis(mikuni): evaluate second-place concentration guard'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1

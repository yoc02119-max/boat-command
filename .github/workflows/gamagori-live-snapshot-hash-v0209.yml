name: Gamagori LIVE snapshot hash guard v0.20.9

on:
  workflow_dispatch:
  push:
    paths:
      - 'live-snapshot-hash-guard-v0209.js'
      - 'live-result-v0204.js'
      - '.github/workflows/gamagori-live-snapshot-hash-v0209.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check live-snapshot-hash-guard-v0209.js
          node --check live-result-v0204.js
      - name: Enforce singleton snapshot hash bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'\n?<script src="live-snapshot-hash-guard-v0209\.js\?v=\d+"></script>','',s)
          anchor_re=r'(<script src="live-integrity-audit-v0208\.js\?v=\d+"></script>)'
          if not re.search(anchor_re,s):
              raise SystemExit('SNAPSHOT_HASH_ANCHOR_MISSING')
          tag='<script src="live-snapshot-hash-guard-v0209.js?v=214"></script>'
          s=re.sub(anchor_re,lambda m:m.group(1)+'\n'+tag,s,count=1)
          if s.count('live-snapshot-hash-guard-v0209.js')!=1:
              raise SystemExit('SNAPSHOT_HASH_SINGLETON_FAIL')
          p.write_text(s)
          PY
      - name: Commit app hash guard enablement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git commit -m 'app: maintain singleton Gamagori live snapshot hash bootstrap'
          git push

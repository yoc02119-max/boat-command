name: Gamagori ROI gate analysis v0.34.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamagori-roi-gate-analysis-v0340.yml'
      - 'scripts/gamagori-roi-gate-analysis-v0340.js'
      - 'gamagori-replay-predictions-v0333.json'
      - 'gamagori-replay-results-v0333.json'
      - 'gamagori-win-pattern-combo-v0339.json'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run leakage-safe ROI gate validation
        run: node scripts/gamagori-roi-gate-analysis-v0340.js
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamagori-roi-gate-analysis-v0340.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(gamagori): publish ROI gate validation v0.34.0'
          git push

name: Venue rich history parser probe v1

on:
  pull_request:
    paths:
      - '.github/workflows/venue-rich-history-parser-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lhasa
      - name: Probe rejected venue parsing on known dates
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe/b /tmp/probe/k
          for d in 260326 260327 260527; do
            ym="20${d:0:4}"
            curl -fsSL --retry 2 "https://www1.mbrace.or.jp/od2/B/$ym/b$d.lzh" -o /tmp/probe/b.lzh
            curl -fsSL --retry 2 "https://www1.mbrace.or.jp/od2/K/$ym/k$d.lzh" -o /tmp/probe/k.lzh
            rm -rf /tmp/probe/b/* /tmp/probe/k/*
            lha xw=/tmp/probe/b /tmp/probe/b.lzh >/dev/null
            lha xw=/tmp/probe/k /tmp/probe/k.lzh >/dev/null
            python3 - "$d" <<'PY'
          import sys,importlib.util,pathlib
          spec=importlib.util.spec_from_file_location('p','scripts/edogawa-rich-history-builder-v1.py')
          p=importlib.util.module_from_spec(spec);sys.modules[spec.name]=p;spec.loader.exec_module(p)
          d=sys.argv[1];b=next(pathlib.Path('/tmp/probe/b').rglob('*.*'));k=next(pathlib.Path('/tmp/probe/k').rglob('*.*'))
          for code in ('21','22','11','09'):
              section=p.block(p.read(b),code,'B')
              results=p.block(p.read(k),code,'K')
              lines=section.splitlines()
              print('DATE',d,'VENUE',code,'B_LINES',len(lines),'K_LINES',len(results.splitlines()),'RICH_RACES',len(p.parse_program(section)),'RESULT_RACES',len(p.parse_results(results)))
              print('HEAD',repr(lines[:4]))
              for line in lines:
                  n=p.norm(line)
                  if n[:1] in '123456' and ('A1' in n or 'A2' in n or 'B1' in n or 'B2' in n):
                      print('ENTRY',repr(n[:180]),'MATCH',bool(p.ENTRY.search(n)))
                      break
          PY
          done

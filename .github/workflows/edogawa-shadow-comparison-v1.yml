name: Edogawa SHADOW comparison v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Edogawa SHADOW research v1"]
    types: [completed]
  push:
    paths:
      - '.github/workflows/edogawa-shadow-comparison-v1.yml'
      - 'scripts/edogawa-shadow-comparison-v1.js'
      - 'live/edogawa/**/shadow/**'

permissions:
  contents: write

concurrency:
  group: edogawa-shadow-comparison-v1
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refresh to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Resolve latest SHADOW date
        id: date
        run: |
          set -euo pipefail
          DATE=$(python3 - <<'PY'
          from pathlib import Path
          dates=sorted(p.parent.parent.name for p in Path('live/edogawa').glob('20??-??-??/shadow/program-only') if p.exists())
          print(dates[-1] if dates else '')
          PY
          )
          if [ -z "$DATE" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Build result-free model comparison
        if: steps.date.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node --check scripts/edogawa-shadow-comparison-v1.js
          node scripts/edogawa-shadow-comparison-v1.js "${{ steps.date.outputs.date }}"
          node - <<'NODE'
          const fs=require('fs');
          const d=process.env.DATE;
          const x=JSON.parse(fs.readFileSync(`live/edogawa/${d}/shadow-comparison-v1.json`,'utf8'));
          if(x.schema!=='boat-command-edogawa-shadow-comparison-v1')throw new Error('SCHEMA');
          if(x.venueCode!=='03')throw new Error('TARGET');
          if(x.resultInput!==false||x.payoutInput!==false||x.researchOnly!==true)throw new Error('BOUNDARY');
          if(x.productionAffected!==false||x.bankrollAffected!==false)throw new Error('PRODUCTION_BOUNDARY');
          console.log('EDOGAWA_SHADOW_COMPARISON_PASS',x.summary);
          NODE
        env:
          DATE: ${{ steps.date.outputs.date }}

      - name: Commit comparison report
        if: steps.date.outputs.ready == 'true'
        run: |
          set -euo pipefail
          DATE="${{ steps.date.outputs.date }}"
          FILE="live/edogawa/$DATE/shadow-comparison-v1.json"
          git config user.name 'boat-command-edogawa-shadow-compare'
          git config user.email 'boat-command-edogawa-shadow-compare@users.noreply.github.com'
          git add "$FILE"
          git diff --cached --quiet && { echo 'EDOGAWA_SHADOW_COMPARISON_CURRENT'; exit 0; }
          git commit -m 'analysis(edogawa): refresh result-free SHADOW comparison'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1

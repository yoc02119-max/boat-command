name: Gamagori legacy result layer v0.20.4 (manual only)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (JST). Empty = today JST'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: gamagori-live-result-v0204
  cancel-in-progress: false

jobs:
  collect-and-enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate app result module
        run: node --check live-result-v0204.js

      - name: Enforce singleton result module bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          app_m=re.search(r'<script src="app\.js\?v=(\d+)"></script>',s)
          if not app_m:
              raise SystemExit('APP_BOOTSTRAP_CACHE_KEY_MISSING')
          cache_key=app_m.group(1)
          if s.count('live-result-v0204.js')!=1:
              raise SystemExit('RESULT_BOOTSTRAP_SINGLETON_FAIL')
          if f'live-result-v0204.js?v={cache_key}' not in s:
              raise SystemExit('RESULT_BOOTSTRAP_CACHE_KEY_MISMATCH')
          order=['live-main-lock-guard-v0320.js','live-lock-snapshot-v0203.js',
                 'live-result-v0204.js','live-snapshot-hash-guard-v0209.js']
          positions=[s.index(name) for name in order]
          if positions != sorted(positions):
              raise SystemExit('RESULT_BOOTSTRAP_ORDER_FAIL')
          print('RESULT_BOOTSTRAP_PASS',cache_key)
          PY

      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect available official results into separated POST-RACE layer
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          import requests
          from bs4 import BeautifulSoup

          JST=timezone(timedelta(hours=9))
          date=(os.environ.get('INPUT_DATE') or '').strip() or datetime.now(JST).strftime('%Y-%m-%d')
          hd=date.replace('-','')
          base=Path('live/gamagori')/date
          program_dir=base/'program'

          # The production predictor is program-only. POST-RACE polling is therefore
          # authorized only by the exact result-free program evidence used by the app.
          # Exhibition/old PRE packs are deliberately not required here.
          if not program_dir.exists():
              print('NO_PROGRAM_PRE_RACE_EVIDENCE',date)
              raise SystemExit(0)

          outdir=base/'post';outdir.mkdir(parents=True,exist_ok=True)
          made=[]
          headers={'User-Agent':'Mozilla/5.0 BOAT-COMMAND/0.32.0'}
          valid_methods={'逃げ','差し','まくり','まくり差し','抜き','恵まれ'}

          def validate_program_pack(path,race):
              try:
                  x=json.loads(path.read_text(encoding='utf-8'))
              except Exception as e:
                  raise RuntimeError(f'PROGRAM_PACK_INVALID_JSON race={race}: {e}')
              if x.get('schema')!='boat-command-program-pack-v1': raise RuntimeError(f'PROGRAM_PACK_SCHEMA_INVALID race={race}')
              if x.get('venue')!='GAMAGORI' or x.get('date')!=date or int(x.get('race',0))!=race: raise RuntimeError(f'PROGRAM_PACK_TARGET_INVALID race={race}')
              if x.get('programReady') is not True: raise RuntimeError(f'PROGRAM_PACK_NOT_READY race={race}')
              if x.get('resultEndpointsIncluded') is not False or x.get('resultIncluded') is not False or x.get('exhibitionIncluded') is not False: raise RuntimeError(f'PROGRAM_PACK_BOUNDARY_INVALID race={race}')
              boats=x.get('boats') if isinstance(x.get('boats'),list) else []
              if len(boats)!=6: raise RuntimeError(f'PROGRAM_PACK_BOAT_COUNT_INVALID race={race}')
              lanes=sorted(boats,key=lambda b:int(b.get('lane',0)))
              for i,b in enumerate(lanes,1):
                  if int(b.get('lane',0))!=i or str(b.get('class','')) not in {'A1','A2','B1','B2'}:
                      raise RuntimeError(f'PROGRAM_PACK_MAPPING_INVALID race={race}')
              return x

          def validate_existing(path,race):
              x=json.loads(path.read_text())
              if x.get('schema')!='boat-command-live-result-v1': raise RuntimeError(f'EXISTING_RESULT_SCHEMA_INVALID race={race}')
              if x.get('venue')!='GAMAGORI' or x.get('date')!=date or int(x.get('race',0))!=race: raise RuntimeError(f'EXISTING_RESULT_TARGET_INVALID race={race}')
              if x.get('preRaceDataIncluded') is not False or x.get('resultEndpointsIncluded') is not True: raise RuntimeError(f'EXISTING_RESULT_BOUNDARY_INVALID race={race}')
              if not re.fullmatch(r'[1-6]-[1-6]-[1-6]',str(x.get('trifecta',''))): raise RuntimeError(f'EXISTING_RESULT_TRIFECTA_INVALID race={race}')
              if not isinstance(x.get('payout100'),int) or x.get('payout100')<0: raise RuntimeError(f'EXISTING_RESULT_PAYOUT_INVALID race={race}')
              if x.get('exacta') is not None:
                  if not re.fullmatch(r'[1-6]-[1-6]',str(x.get('exacta',''))): raise RuntimeError(f'EXISTING_RESULT_EXACTA_INVALID race={race}')
                  if not isinstance(x.get('exactaPayout100'),int) or x.get('exactaPayout100')<0: raise RuntimeError(f'EXISTING_RESULT_EXACTA_PAYOUT_INVALID race={race}')
              if x.get('win') is not None:
                  if not re.fullmatch(r'[1-6]',str(x.get('win',''))): raise RuntimeError(f'EXISTING_RESULT_WIN_INVALID race={race}')
                  if not isinstance(x.get('winPayout100'),int) or x.get('winPayout100')<0: raise RuntimeError(f'EXISTING_RESULT_WIN_PAYOUT_INVALID race={race}')
              method=x.get('winningMethod')
              if method is not None and method not in valid_methods: raise RuntimeError(f'EXISTING_RESULT_METHOD_INVALID race={race}')

          for race in range(1,13):
              path=outdir/f'race-{race}-result.json'
              if path.exists():
                  validate_existing(path,race)
                  print('KEEP_IMMUTABLE_RESULT',race)
                  continue

              # WAIT remains fail-closed: without a verified program-only PRE-RACE
              # pack for this exact race, no official result endpoint is touched.
              program_pack=program_dir/f'race-{race}.json'
              if not program_pack.exists():
                  print('WAIT_PROGRAM_PACK',race)
                  continue
              try:
                  program_evidence=validate_program_pack(program_pack,race)
              except RuntimeError as e:
                  print('WAIT_PROGRAM_INVALID',race,str(e))
                  continue

              url=f'https://www.boatrace.jp/owpc/pc/race/raceresult?hd={hd}&jcd=07&rno={race}'
              try:
                  res=requests.get(url,headers=headers,timeout=20);res.raise_for_status()
              except Exception as e:
                  print('WAIT_FETCH',race,e);continue
              soup=BeautifulSoup(res.text,'html.parser')
              trifecta=None;payout=None
              exacta=None;exacta_payout=None
              win=None;win_payout=None
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)<3:
                      continue
                  label=cells[0].replace(' ','')
                  raw_pick=cells[1]
                  pm=re.search(r'([\d,]+)',cells[2].replace('¥','').replace('￥',''))
                  if label=='3連単':
                      m=re.search(r'([1-6])\s*[-–—]\s*([1-6])\s*[-–—]\s*([1-6])',raw_pick)
                      if m and pm:
                          trifecta='-'.join(m.groups());payout=int(pm.group(1).replace(',',''))
                  elif label=='2連単':
                      m=re.search(r'([1-6])\s*[-–—]\s*([1-6])',raw_pick)
                      if m and pm:
                          exacta='-'.join(m.groups());exacta_payout=int(pm.group(1).replace(',',''))
                  elif label=='単勝':
                      m=re.search(r'([1-6])',raw_pick)
                      if m and pm:
                          win=m.group(1);win_payout=int(pm.group(1).replace(',',''))
              if not trifecta or payout is None:
                  print('WAIT_RESULT',race);continue
              finish=[]
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)>=2 and cells[0] in {'１','２','３','４','５','６','1','2','3','4','5','6'} and re.fullmatch(r'[1-6]',cells[1].strip()):
                      finish.append(int(cells[1].strip()))
              plain=' '.join(soup.stripped_strings)
              mm=re.search(r'決まり手\s*(まくり差し|まくり|逃げ|差し|抜き|恵まれ)(?:\s|$)',plain)
              winning_method=mm.group(1) if mm else None
              payload={
                  'schema':'boat-command-live-result-v1','version':'0.32.0','venue':'GAMAGORI','date':date,'race':race,
                  'fetchedAt':datetime.now(JST).isoformat(),'officialSource':url,
                  'trifecta':trifecta,'payout100':payout,'finishOrder':finish[:6],
                  'exacta':exacta,'exactaPayout100':exacta_payout,
                  'win':win,'winPayout100':win_payout,
                  'winningMethod':winning_method,
                  'preRaceDataIncluded':False,'resultEndpointsIncluded':True,
                  'predictionEnabled':False,'hardLockEnabled':False,
                  'immutableAfterFirstWrite':True,
                  'preRaceEvidenceRequired':True,
                  'preRaceEvidenceType':'PROGRAM_ONLY',
                  'preRaceEvidencePath':str(program_pack).replace('\\','/'),
                  'preRaceEvidenceFetchedAt':program_evidence.get('fetchedAt')
              }
              path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
              made.append(race)
          print('RESULT_FILES_CREATED',made)
          PY

      - name: Refresh forward TRY status from newly collected POST-RACE results
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DATE="${INPUT_DATE:-}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Asia/Tokyo date +%F)"; fi
          GATE="live/gamagori/$DATE/shadow/all-race-try-gates-v0349.json"
          if [ -f "$GATE" ]; then
            node --check scripts/gamagori-forward-status-v0347.js
            node scripts/gamagori-forward-status-v0347.js
          else
            echo "TRY_GATE_NOT_READY $GATE"
          fi

      - name: Commit app enablement and POST-RACE relay files
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- index.html live/gamagori)" ]; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-result-relay'
          git config user.email 'boat-command-result-relay@users.noreply.github.com'
          git add index.html live/gamagori
          git commit -m 'live: maintain singleton result bootstrap and immutable result relay'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done
          echo 'PUSH_RETRY_EXHAUSTED' >&2
          exit 1

name: Gamagori LIVE result layer v0.20.4

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (JST). Empty = today JST'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/gamagori-live-result-v0204.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-live-result-v0204
  cancel-in-progress: false

jobs:
  collect-and-enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate app result module
        run: node --check live-result-v0204.js

      - name: Enable result module and bump app version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          s=s.replace('BOAT COMMAND v0.20.3','BOAT COMMAND v0.20.4')
          s=s.replace('v0.20.3 · LOCK SNAPSHOT','v0.20.4 · RESULT LAYER')
          s=s.replace('styles.css?v=203','styles.css?v=204')
          s=s.replace('app.js?v=203','app.js?v=204')
          for old in ['live-autopoll-v0199.js?v=203','live-predictor-v0200.js?v=203','live-autofill-v0201.js?v=203','live-lock-guard-v0202.js?v=203','live-lock-snapshot-v0203.js?v=203']:
              s=s.replace(old,old.replace('v=203','v=204'))
          tag='<script src="live-result-v0204.js?v=204"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY

      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect available official results into separated POST-RACE layer
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          import requests
          from bs4 import BeautifulSoup

          JST=timezone(timedelta(hours=9))
          date=(os.environ.get('INPUT_DATE') or '').strip() or datetime.now(JST).strftime('%Y-%m-%d')
          hd=date.replace('-','')
          outdir=Path('live/gamagori')/date/'post';outdir.mkdir(parents=True,exist_ok=True)
          made=[]
          headers={'User-Agent':'Mozilla/5.0 BOAT-COMMAND/0.20.4'}

          def validate_existing(path,race):
              x=json.loads(path.read_text())
              if x.get('schema')!='boat-command-live-result-v1': raise RuntimeError(f'EXISTING_RESULT_SCHEMA_INVALID race={race}')
              if x.get('venue')!='GAMAGORI' or x.get('date')!=date or int(x.get('race',0))!=race: raise RuntimeError(f'EXISTING_RESULT_TARGET_INVALID race={race}')
              if x.get('preRaceDataIncluded') is not False or x.get('resultEndpointsIncluded') is not True: raise RuntimeError(f'EXISTING_RESULT_BOUNDARY_INVALID race={race}')
              if not re.fullmatch(r'[1-6]-[1-6]-[1-6]',str(x.get('trifecta',''))): raise RuntimeError(f'EXISTING_RESULT_TRIFECTA_INVALID race={race}')
              if not isinstance(x.get('payout100'),int) or x.get('payout100')<0: raise RuntimeError(f'EXISTING_RESULT_PAYOUT_INVALID race={race}')

          for race in range(1,13):
              path=outdir/f'race-{race}-result.json'
              # POST-RACE relay is append-only evidence. Once a valid result file exists,
              # never refresh fetchedAt or overwrite it on later polling runs.
              if path.exists():
                  validate_existing(path,race)
                  print('KEEP_IMMUTABLE_RESULT',race)
                  continue

              url=f'https://www.boatrace.jp/owpc/pc/race/raceresult?hd={hd}&jcd=07&rno={race}'
              try:
                  res=requests.get(url,headers=headers,timeout=20);res.raise_for_status()
              except Exception as e:
                  print('WAIT_FETCH',race,e);continue
              soup=BeautifulSoup(res.text,'html.parser')
              trifecta=None;payout=None
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)>=3 and cells[0].replace(' ','')=='3連単':
                      m=re.search(r'([1-6])\s*[-–—]\s*([1-6])\s*[-–—]\s*([1-6])',cells[1])
                      pm=re.search(r'([\d,]+)',cells[2].replace('¥','').replace('￥',''))
                      if m and pm:
                          trifecta='-'.join(m.groups());payout=int(pm.group(1).replace(',',''));break
              if not trifecta or payout is None:
                  print('WAIT_RESULT',race);continue
              finish=[]
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)>=2 and cells[0] in {'１','２','３','４','５','６','1','2','3','4','5','6'} and re.fullmatch(r'[1-6]',cells[1].strip()):
                      finish.append(int(cells[1].strip()))
              payload={
                  'schema':'boat-command-live-result-v1','version':'0.20.4','venue':'GAMAGORI','date':date,'race':race,
                  'fetchedAt':datetime.now(JST).isoformat(),'officialSource':url,
                  'trifecta':trifecta,'payout100':payout,'finishOrder':finish[:6],
                  'preRaceDataIncluded':False,'resultEndpointsIncluded':True,
                  'predictionEnabled':False,'hardLockEnabled':False,
                  'immutableAfterFirstWrite':True
              }
              path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
              made.append(race)
          print('RESULT_FILES_CREATED',made)
          PY

      - name: Commit app enablement and POST-RACE relay files
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html live/gamagori; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-result-relay'
          git config user.email 'boat-command-result-relay@users.noreply.github.com'
          git add index.html live/gamagori
          git commit -m 'live: add immutable separated Gamagori post-race result relay'
          git push

name: Gamagori LIVE result layer v0.20.4

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (JST). Empty = today JST'
        required: false
        type: string
  schedule:
    # Gamagori is a night venue. Poll only the useful JST window (16:00-23:59),
    # every 30 minutes. Non-event days produce no relay changes and no commit.
    - cron: '*/30 7-14 * * *'
  push:
    paths:
      - '.github/workflows/gamagori-live-result-v0204.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-live-result-v0204
  cancel-in-progress: false

jobs:
  collect-and-enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate app result module
        run: node --check live-result-v0204.js

      - name: Enforce singleton result module bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text()
          s=s.replace('BOAT COMMAND v0.21.1','BOAT COMMAND v0.21.4')
          s=s.replace('v0.21.1 · RUNTIME AUDIT','v0.21.4 · RESULT METHOD')
          # Remove every prior cache-busted copy, then insert exactly one in canonical order.
          # The learning module cache version is intentionally not hard-coded: later app
          # audits may bump it independently, and POST-RACE collection must keep working.
          s=re.sub(r'\n?<script src="live-result-v0204\.js\?v=\d+"></script>','',s)
          learning_pat=r'<script src="live-learning-v0205\.js\?v=\d+"></script>'
          m=re.search(learning_pat,s)
          if not m:
              raise SystemExit('RESULT_BOOTSTRAP_ANCHOR_MISSING')
          tag='<script src="live-result-v0204.js?v=222"></script>'
          s=s[:m.start()]+tag+'\n'+s[m.start():]
          if s.count('live-result-v0204.js')!=1:
              raise SystemExit('RESULT_BOOTSTRAP_SINGLETON_FAIL')
          p.write_text(s)
          PY

      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect available official results into separated POST-RACE layer
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          import requests
          from bs4 import BeautifulSoup

          JST=timezone(timedelta(hours=9))
          date=(os.environ.get('INPUT_DATE') or '').strip() or datetime.now(JST).strftime('%Y-%m-%d')
          hd=date.replace('-','')
          base=Path('live/gamagori')/date
          pre_dir=base/'pre'

          # Fail closed before touching any result endpoint. A scheduled POST-RACE poll is
          # allowed only when BOAT COMMAND has already produced PRE-RACE evidence for this
          # exact Gamagori date. This avoids blind result polling on non-event days and
          # keeps the PRE/POST chain auditable.
          if not pre_dir.exists():
              print('NO_PRE_RACE_EVENT_EVIDENCE',date)
              raise SystemExit(0)

          outdir=base/'post';outdir.mkdir(parents=True,exist_ok=True)
          made=[]
          headers={'User-Agent':'Mozilla/5.0 BOAT-COMMAND/0.21.7'}
          valid_methods={'逃げ','差し','まくり','まくり差し','抜き','恵まれ'}

          def validate_pre_pack(path,race):
              try:
                  x=json.loads(path.read_text(encoding='utf-8'))
              except Exception as e:
                  raise RuntimeError(f'PRE_RACE_PACK_INVALID_JSON race={race}: {e}')
              if x.get('schema')!='boat-command-live-pre-race-pack-v1': raise RuntimeError(f'PRE_RACE_PACK_SCHEMA_INVALID race={race}')
              if x.get('venue')!='GAMAGORI' or x.get('date')!=date or int(x.get('race',0))!=race: raise RuntimeError(f'PRE_RACE_PACK_TARGET_INVALID race={race}')
              if x.get('timingStatus')!='VERIFIED': raise RuntimeError(f'PRE_RACE_PACK_TIMING_INVALID race={race}')
              if x.get('boatMappingVerified') is not True or x.get('weatherMappingVerified') is not True: raise RuntimeError(f'PRE_RACE_PACK_MAPPING_INVALID race={race}')
              if x.get('readyForPrediction') is not True: raise RuntimeError(f'PRE_RACE_PACK_NOT_READY race={race}')
              if x.get('resultEndpointsIncluded') is not False: raise RuntimeError(f'PRE_RACE_PACK_RESULT_BOUNDARY_INVALID race={race}')
              return x

          def validate_existing(path,race):
              x=json.loads(path.read_text())
              if x.get('schema')!='boat-command-live-result-v1': raise RuntimeError(f'EXISTING_RESULT_SCHEMA_INVALID race={race}')
              if x.get('venue')!='GAMAGORI' or x.get('date')!=date or int(x.get('race',0))!=race: raise RuntimeError(f'EXISTING_RESULT_TARGET_INVALID race={race}')
              if x.get('preRaceDataIncluded') is not False or x.get('resultEndpointsIncluded') is not True: raise RuntimeError(f'EXISTING_RESULT_BOUNDARY_INVALID race={race}')
              if not re.fullmatch(r'[1-6]-[1-6]-[1-6]',str(x.get('trifecta',''))): raise RuntimeError(f'EXISTING_RESULT_TRIFECTA_INVALID race={race}')
              if not isinstance(x.get('payout100'),int) or x.get('payout100')<0: raise RuntimeError(f'EXISTING_RESULT_PAYOUT_INVALID race={race}')
              method=x.get('winningMethod')
              if method is not None and method not in valid_methods: raise RuntimeError(f'EXISTING_RESULT_METHOD_INVALID race={race}')

          for race in range(1,13):
              path=outdir/f'race-{race}-result.json'
              # POST-RACE relay is append-only evidence. Once a valid result file exists,
              # never refresh fetchedAt or overwrite it on later polling runs.
              if path.exists():
                  validate_existing(path,race)
                  print('KEEP_IMMUTABLE_RESULT',race)
                  continue

              # No result endpoint request is made until this exact race has a fully
              # verified PRE-RACE pack. WAIT remains fail-closed.
              pre_pack=pre_dir/f'race-{race}-pack.json'
              if not pre_pack.exists():
                  print('WAIT_PRE_RACE_PACK',race)
                  continue
              validate_pre_pack(pre_pack,race)

              url=f'https://www.boatrace.jp/owpc/pc/race/raceresult?hd={hd}&jcd=07&rno={race}'
              try:
                  res=requests.get(url,headers=headers,timeout=20);res.raise_for_status()
              except Exception as e:
                  print('WAIT_FETCH',race,e);continue
              soup=BeautifulSoup(res.text,'html.parser')
              trifecta=None;payout=None
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)>=3 and cells[0].replace(' ','')=='3連単':
                      m=re.search(r'([1-6])\s*[-–—]\s*([1-6])\s*[-–—]\s*([1-6])',cells[1])
                      pm=re.search(r'([\d,]+)',cells[2].replace('¥','').replace('￥',''))
                      if m and pm:
                          trifecta='-'.join(m.groups());payout=int(pm.group(1).replace(',',''));break
              if not trifecta or payout is None:
                  print('WAIT_RESULT',race);continue
              finish=[]
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)>=2 and cells[0] in {'１','２','３','４','５','６','1','2','3','4','5','6'} and re.fullmatch(r'[1-6]',cells[1].strip()):
                      finish.append(int(cells[1].strip()))
              plain=' '.join(soup.stripped_strings)
              mm=re.search(r'決まり手\s*(まくり差し|まくり|逃げ|差し|抜き|恵まれ)(?:\s|$)',plain)
              winning_method=mm.group(1) if mm else None
              payload={
                  'schema':'boat-command-live-result-v1','version':'0.21.7','venue':'GAMAGORI','date':date,'race':race,
                  'fetchedAt':datetime.now(JST).isoformat(),'officialSource':url,
                  'trifecta':trifecta,'payout100':payout,'finishOrder':finish[:6],
                  'winningMethod':winning_method,
                  'preRaceDataIncluded':False,'resultEndpointsIncluded':True,
                  'predictionEnabled':False,'hardLockEnabled':False,
                  'immutableAfterFirstWrite':True,
                  'preRaceEvidenceRequired':True
              }
              path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
              made.append(race)
          print('RESULT_FILES_CREATED',made)
          PY

      - name: Commit app enablement and POST-RACE relay files
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html live/gamagori; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-result-relay'
          git config user.email 'boat-command-result-relay@users.noreply.github.com'
          git add index.html live/gamagori
          git commit -m 'live: maintain singleton result bootstrap and immutable result relay'
          git push
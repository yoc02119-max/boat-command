name: Gamagori bet-type ROI audit v0.34.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gamagori-bet-type-roi-v0342.py'
      - 'gamagori-replay-predictions-v0333.json'
      - 'gamagori-replay-results-v0333.json'
      - 'gamagori-win-pattern-combo-v0339.json'
      - '.github/workflows/gamagori-bet-type-roi-v0342.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-bet-type-roi-v0342
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Run bet-type ROI audit
        run: python scripts/gamagori-bet-type-roi-v0342.py

      - name: Commit audit output
        run: |
          set -euo pipefail
          if git diff --quiet -- gamagori-bet-type-roi-v0342.json; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-analysis'
          git config user.email 'boat-command-analysis@users.noreply.github.com'
          git add gamagori-bet-type-roi-v0342.json
          git commit -m 'analysis(gamagori): publish bet-type ROI audit v0.34.2'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo 'PUSH_RETRY_EXHAUSTED' >&2
          exit 1

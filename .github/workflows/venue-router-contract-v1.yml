name: venue-router-contract-v1

on:
  push:
    branches: [main]
    paths:
      - 'venue-registry-v1.js'
      - 'venue-runtime-v1.js'
      - 'portal.html'
      - 'github-live-data-v1.js'
      - 'scripts/portal-24venue-operational-contract-v1.js'
      - 'try-race-deeplink-v1.js'
      - 'scripts/try-race-deeplink-contract-v1.js'
      - 'scripts/try-deadline-countdown-contract-v1.js'
      - 'scripts/try-picks-stake-contract-v1.js'
      - 'scripts/try-progress-summary-contract-v1.js'
      - 'scripts/try-settled-inline-result-contract-v1.js'
      - 'scripts/try-result-waiting-state-contract-v1.js'
      - 'scripts/virtual-try-banner-contract-v1.js'
      - 'scripts/next-try-race-button-contract-v1.js'
      - 'scripts/try-reason-line-contract-v1.js'
      - 'venue.html'
      - 'index.html'
      - 'scripts/venue-router-contract-v1.js'
      - '.github/workflows/venue-router-contract-v1.yml'
  pull_request:
    paths:
      - 'venue-registry-v1.js'
      - 'venue-runtime-v1.js'
      - 'portal.html'
      - 'github-live-data-v1.js'
      - 'scripts/portal-24venue-operational-contract-v1.js'
      - 'try-race-deeplink-v1.js'
      - 'scripts/try-race-deeplink-contract-v1.js'
      - 'scripts/try-deadline-countdown-contract-v1.js'
      - 'scripts/try-picks-stake-contract-v1.js'
      - 'scripts/try-progress-summary-contract-v1.js'
      - 'scripts/try-settled-inline-result-contract-v1.js'
      - 'scripts/try-result-waiting-state-contract-v1.js'
      - 'scripts/virtual-try-banner-contract-v1.js'
      - 'scripts/next-try-race-button-contract-v1.js'
      - 'scripts/try-reason-line-contract-v1.js'
      - 'venue.html'
      - 'index.html'
      - 'scripts/venue-router-contract-v1.js'
      - '.github/workflows/venue-router-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated venue routing
        run: node scripts/venue-router-contract-v1.js
      - name: Verify portal 24-venue source of truth
        run: node scripts/portal-24venue-operational-contract-v1.js
      - name: Verify TRY race deep links
        run: node scripts/try-race-deeplink-contract-v1.js
      - name: Verify TRY deadline countdown
        run: node scripts/try-deadline-countdown-contract-v1.js
      - name: Verify TRY picks and stake summary
        run: node scripts/try-picks-stake-contract-v1.js
      - name: Verify daily TRY progress summary
        run: node scripts/try-progress-summary-contract-v1.js
      - name: Verify settled TRY inline results
        run: node scripts/try-settled-inline-result-contract-v1.js
      - name: Verify TRY result waiting state
        run: node scripts/try-result-waiting-state-contract-v1.js
      - name: Verify virtual TRY banner
        run: node scripts/virtual-try-banner-contract-v1.js
      - name: Verify next TRY race button
        run: node scripts/next-try-race-button-contract-v1.js
      - name: Verify one-line TRY prediction reason
        run: node scripts/try-reason-line-contract-v1.js

name: PRE-RACE Gamagori auto-chain v0.19.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Select next race and gate on PRE-RACE readiness
        id: gate
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%F)
          HD="${DATE//-/}"
          CODE=07
          BASE='https://www.boatrace.jp/owpc/pc/race'
          mkdir -p tmp_auto "live/gamagori/$DATE/pre"

          RACELIST="$BASE/racelist?hd=$HD&jcd=$CODE&rno=1"
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-AUTO-CHAIN/0.19.4' \
            "$RACELIST" -o tmp_auto/racelist.html

          export DATE RACELIST
          python3 - <<'PY'
          import os,re,json,html,datetime,pathlib
          from zoneinfo import ZoneInfo

          date=os.environ["DATE"]
          now=datetime.datetime.now(ZoneInfo("Asia/Tokyo"))
          rl=pathlib.Path("tmp_auto/racelist.html").read_text(encoding="utf-8",errors="replace")
          plain=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",rl)))
          times=re.findall(r"(?<!\d)([0-2]?\d:[0-5]\d)(?!\d)",plain)
          deadlines=times[:12] if len(times)>=12 else []

          selected=None
          for i,t in enumerate(deadlines,1):
              hh,mm=map(int,t.split(":"))
              dt=datetime.datetime.fromisoformat(date).replace(
                  hour=hh,minute=mm,tzinfo=ZoneInfo("Asia/Tokyo"))
              margin=(dt-now).total_seconds()/60
              if margin>=5:
                  selected={"race":i,"deadline":t,"marginMinutes":round(margin,1)}
                  break

          state={
              "schema":"boat-command-auto-chain-state-v1",
              "venue":"GAMAGORI","venueCode":"07","date":date,
              "fetchedAt":now.isoformat(),
              "minimumSafetyMarginMinutes":5,
              "deadlineCount":len(deadlines),
              "selected":selected,
              "status":"RACE_SELECTED" if selected and len(deadlines)==12 else
                       "NO_MORE_RACES_TODAY" if len(deadlines)==12 else
                       "SCHEDULE_UNVERIFIED",
              "resultEndpointsIncluded":False,
              "predictionEnabled":False,
              "hardLockEnabled":False
          }
          pathlib.Path("tmp_auto/state.json").write_text(json.dumps(state,ensure_ascii=False,indent=2))
          print(json.dumps(state,ensure_ascii=False))
          PY

          RACE=$(python3 -c 'import json; x=json.load(open("tmp_auto/state.json")); print(x["selected"]["race"] if x["selected"] else "")')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "race=$RACE" >> "$GITHUB_OUTPUT"

          if [ -z "$RACE" ]; then
            cp tmp_auto/state.json "live/gamagori/$DATE/pre/auto-chain.json"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFOREINFO="$BASE/beforeinfo?hd=$HD&jcd=$CODE&rno=$RACE"
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-AUTO-CHAIN/0.19.4' \
            "$BEFOREINFO" -o tmp_auto/beforeinfo.html

          export BEFOREINFO RACE
          python3 - <<'PY'
          import os,re,json,html,pathlib
          state=json.load(open("tmp_auto/state.json"))
          bi=pathlib.Path("tmp_auto/beforeinfo.html").read_text(encoding="utf-8",errors="replace")
          plain=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",bi)))

          # Gate must see all race-specific pre-race sections.
          need=("展示タイム","スタート展示","水面気象情報")
          present={k:(k in plain) for k in need}
          ready=all(present.values())

          state["beforeinfoSourceUrl"]=os.environ["BEFOREINFO"]
          state["preRaceSections"]=present
          state["preRaceDataReady"]=ready
          state["status"]="PRE_RACE_DATA_READY" if ready else "WAITING_FOR_PRE_RACE_DATA"
          state["readyToBuildVerifiedPack"]=ready

          out=pathlib.Path(f'live/gamagori/{state["date"]}/pre/auto-chain.json')
          out.write_text(json.dumps(state,ensure_ascii=False,indent=2))
          print(json.dumps({
              "status":state["status"],
              "selected":state["selected"],
              "preRaceSections":present,
              "readyToBuildVerifiedPack":ready
          },ensure_ascii=False))
          PY

          READY=$(python3 -c 'import json; x=json.load(open("live/gamagori/'"$DATE"'/pre/auto-chain.json")); print("true" if x.get("readyToBuildVerifiedPack") else "false")')
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Build verified pack only when READY
        if: steps.gate.outputs.ready == 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
          RACE: ${{ steps.gate.outputs.race }}
        run: |
          set -euo pipefail
          HD="${DATE//-/}"
          CODE=07
          BASE='https://www.boatrace.jp/owpc/pc/race'
          RACELIST="$BASE/racelist?hd=$HD&jcd=$CODE&rno=$RACE"
          BEFOREINFO="$BASE/beforeinfo?hd=$HD&jcd=$CODE&rno=$RACE"

          mkdir -p tmp_pack
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-AUTO-CHAIN/0.19.4' \
            "$RACELIST" -o tmp_pack/racelist.html
          sleep 2
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-AUTO-CHAIN/0.19.4' \
            "$BEFOREINFO" -o tmp_pack/beforeinfo.html

          export RACELIST BEFOREINFO
          python3 - <<'PY'
          import os,re,json,html,datetime,pathlib
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo

          date=os.environ["DATE"]; race=int(os.environ["RACE"])
          now=datetime.datetime.now(ZoneInfo("Asia/Tokyo"))

          def read(path):
              b=pathlib.Path(path).read_bytes()
              for enc in ("utf-8","cp932","shift_jis","euc_jp"):
                  try:return b.decode(enc)
                  except UnicodeDecodeError:pass
              return b.decode("utf-8","replace")

          rl=read("tmp_pack/racelist.html"); bi=read("tmp_pack/beforeinfo.html")

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth=0; self.in_cell=False
                  self.cell=[]; self.row=[]; self.table=[]; self.tables=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="table":
                      if self.depth==0:self.table=[]
                      self.depth+=1
                  elif tag in ("td","th") and self.depth:self.in_cell=True; self.cell=[]
                  elif tag=="tr" and self.depth:self.row=[]
                  elif tag=="br" and self.in_cell:self.cell.append(" / ")
              def handle_data(self,data):
                  if self.in_cell:self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ("td","th") and self.in_cell:
                      self.row.append(re.sub(r"\s+"," ",html.unescape("".join(self.cell))).strip())
                      self.in_cell=False; self.cell=[]
                  elif tag=="tr" and self.depth and self.row:
                      if any(self.row):self.table.append(self.row)
                      self.row=[]
                  elif tag=="table" and self.depth:
                      self.depth-=1
                      if self.depth==0 and self.table:self.tables.append(self.table); self.table=[]

          def tabs(text):
              p=P(); p.feed(text); return p.tables

          rlt=tabs(rl); bit=tabs(bi)

          plain_rl=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",rl)))
          times=re.findall(r"(?<!\d)([0-2]?\d:[0-5]\d)(?!\d)",plain_rl)
          deadline=times[race-1] if len(times)>=12 else None
          deadline_dt=None
          if deadline:
              hh,mm=map(int,deadline.split(":"))
              deadline_dt=datetime.datetime.fromisoformat(date).replace(
                  hour=hh,minute=mm,tzinfo=ZoneInfo("Asia/Tokyo"))
          timing="VERIFIED" if deadline_dt and now<=deadline_dt else "EXCLUDED_LATE"

          racer=None
          for t in rlt:
              joined=" ".join(" ".join(r) for r in t[:6])
              if all(k in joined for k in ("登録番号","級別","モーター","ボート")):
                  racer=t; break

          lane_map={"１":1,"２":2,"３":3,"４":4,"５":5,"６":6}
          boats={}
          if racer:
              for row in racer:
                  if not row: continue
                  raw=row[0].strip()
                  if raw not in set(lane_map)|set("123456"): continue
                  lane=lane_map.get(raw,int(raw) if raw.isdigit() else None)
                  joined=" | ".join(row)
                  m=re.search(r"(\d{4})\s*/\s*(A1|A2|B1|B2)\s+([^|/]+)",joined)
                  motor=boat=None
                  if len(row)>7:
                      mm=re.match(r"\s*(\d+)\s*/",row[6])
                      bb=re.match(r"\s*(\d+)\s*/",row[7])
                      motor=int(mm.group(1)) if mm else None
                      boat=int(bb.group(1)) if bb else None
                  if m:
                      boats[lane]={"lane":lane,"class":m.group(2),"motor":motor,"boat":boat}

          ex={}
          for t in bit:
              joined=" ".join(" ".join(r) for r in t[:5])
              if "展示" in joined and "タイム" in joined and "体重" in joined:
                  for row in t:
                      if not row or row[0] not in set("123456"): continue
                      lane=int(row[0]); et=tilt=None
                      if len(row)>4 and re.fullmatch(r"\d+\.\d+",row[4].strip()):et=float(row[4])
                      if len(row)>5 and re.fullmatch(r"-?\d+(?:\.\d+)?",row[5].strip()):tilt=float(row[5])
                      ex[lane]={"exhibitionTime":et,"tilt":tilt}
                  break

          st={}
          for t in bit:
              joined=" ".join(" ".join(r) for r in t)
              if "スタート展示" not in joined: continue
              for row in t:
                  s=" ".join(row)
                  m=re.search(r"([1-6])\s+(F)?\.?([0-9]{2})",s)
                  if m:st[int(m.group(1))]=("F." if m.group(2) else ".")+m.group(3)
              if st:break

          title_m=re.search(r'<p class="weather1_title">([^<]+)</p>',bi)
          weather_ref=html.unescape(title_m.group(1)).strip() if title_m else None
          def wx(kind,label,unit):
              block=re.search(rf'<div class="weather1_bodyUnit {re.escape(kind)}">(.*?)</div>\s*</div>',bi,re.S)
              source=block.group(1) if block else bi
              m=re.search(
                  rf'<span class="weather1_bodyUnitLabelTitle">\s*{label}\s*</span>\s*'
                  rf'<span class="weather1_bodyUnitLabelData">\s*([0-9]+(?:\.[0-9]+)?)\s*{unit}\s*</span>',
                  source,re.S)
              return float(m.group(1)) if m else None

          air=wx("is-direction","気温","℃")
          wind=wx("is-wind","風速","m")
          water=wx("is-waterTemperature","水温","℃")
          wave=wx("is-wave","波高","cm")

          final=[]
          for lane in range(1,7):
              b=boats.get(lane,{"lane":lane,"class":None,"motor":None,"boat":None})
              b.update(ex.get(lane,{"exhibitionTime":None,"tilt":None}))
              final.append(b)

          boat_ok=(len(boats)==6 and len(ex)==6 and len(st)==6 and
                   all(x["motor"] is not None and x["boat"] is not None for x in final))
          weather_ok=all(x is not None for x in (air,wind,water,wave))
          ready=boat_ok and weather_ok and timing=="VERIFIED"

          pack={
              "schema":"boat-command-live-pre-race-pack-v1",
              "venue":"GAMAGORI","venueCode":"07","date":date,"race":race,
              "fetchedAt":now.isoformat(),"deadline":deadline,"timingStatus":timing,
              "boats":final,
              "startExhibition":[{"course":c,"st":st.get(c)} for c in range(1,7)],
              "weather":{"reference":weather_ref,"airTempC":air,"windSpeedMps":wind,
                         "waterTempC":water,"waveHeightCm":wave},
              "boatMappingVerified":boat_ok,
              "weatherMappingVerified":weather_ok,
              "readyForPrediction":ready,
              "predictionEnabled":False,
              "hardLockEnabled":False,
              "resultEndpointsIncluded":False
          }
          out=pathlib.Path(f"live/gamagori/{date}/pre/race-{race}-pack.json")
          out.write_text(json.dumps(pack,ensure_ascii=False,indent=2))
          print(json.dumps({
              "race":race,"deadline":deadline,"boatMappingVerified":boat_ok,
              "weatherMappingVerified":weather_ok,"timingStatus":timing,
              "readyForPrediction":ready
          },ensure_ascii=False))
          PY
          rm -rf tmp_pack

      - name: Safety audit
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%F)
          python3 - <<'PY'
          import json,glob,os
          date=os.popen("TZ=Asia/Tokyo date +%F").read().strip()
          state=json.load(open(f"live/gamagori/{date}/pre/auto-chain.json"))
          assert state["resultEndpointsIncluded"] is False
          assert state["predictionEnabled"] is False
          assert state["hardLockEnabled"] is False
          if state.get("readyToBuildVerifiedPack"):
              race=state["selected"]["race"]
              pack=json.load(open(f"live/gamagori/{date}/pre/race-{race}-pack.json"))
              assert pack["resultEndpointsIncluded"] is False
              assert pack["predictionEnabled"] is False
              assert pack["hardLockEnabled"] is False
              if pack["readyForPrediction"]:
                  assert pack["boatMappingVerified"] and pack["weatherMappingVerified"]
                  assert pack["timingStatus"]=="VERIFIED"
          print("SAFETY PASS · AUTO-CHAIN · PRE-RACE ONLY · FAIL CLOSED")
          PY

      - name: Commit state and pack
        run: |
          DATE=$(TZ=Asia/Tokyo date +%F)
          git config user.name 'boat-command-relay'
          git config user.email 'boat-command-relay@users.noreply.github.com'
          git add "live/gamagori/$DATE/pre/"
          git diff --cached --quiet && exit 0
          git commit -m "live: gamagori $DATE auto-chain pre-race"
          git push

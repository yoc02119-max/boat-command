name: Period second-place expansion v1

on:
  pull_request:
    paths:
      - '.github/workflows/period-second-expansion-v1.yml'
      - 'scripts/period-second-expansion-v1.py'
      - 'rich-history-24/**'
      - 'racer-period-24/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run period-guided second-place expansion holdout
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/period-second-expansion-v1.py
          python3 scripts/period-second-expansion-v1.py
          python3 - <<'PY'
          import json
          x=json.load(open('research/period-second-expansion-v1.json',encoding='utf-8'))
          assert x['schema']=='boat-command-period-second-expansion-v1'
          assert x['researchOnly'] is True
          assert x['productionChanged'] is False
          assert x['predictionInputChanged'] is False
          assert x['tryChanged'] is False
          assert x['hardLockChanged'] is False
          assert x['promotionEligible'] is False
          assert x['featureBoundary']['resultUsedForTicketConstruction'] is False
          assert x['featureBoundary']['payoutUsedForTicketConstruction'] is False
          assert x['summary']['venues']==24
          assert x['summary']['holdoutRaces']>5000
          assert x['summary']['variants']['base4']['avgPoints']==4
          assert x['summary']['variants']['periodSecond6']['avgPoints']>=4
          print('PERIOD_SECOND_EXPANSION_BOUNDARY_PASS',x['summary'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: period-second-expansion-v1
          path: research/period-second-expansion-v1.json
          retention-days: 30
          if-no-files-found: error

      - name: Save research report to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp research/period-second-expansion-v1.json /tmp/period-second-expansion-v1.json
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p research
          cp /tmp/period-second-expansion-v1.json research/
          git config user.name 'boat-command-period-second-research'
          git config user.email 'boat-command-period-second-research@users.noreply.github.com'
          git add research/period-second-expansion-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'analysis(research): store period second-expansion holdout [skip ci]'
          git push origin "HEAD:$HEAD_REF"

name: Edogawa safety audit v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'venues/edogawa/**'
      - 'scripts/edogawa-**'
      - '.github/workflows/edogawa-**'
      - 'live/edogawa/**'
      - 'venue.html'
      - 'portal.html'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Verify Edogawa venue boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          cfg=json.loads(pathlib.Path('venues/edogawa/config-v1.json').read_text(encoding='utf-8'))
          assert cfg['venue']=='EDOGAWA' and cfg['venueCode']=='03'
          assert cfg['state']=='LIVE_SIMULATION'
          assert cfg['modelEnabled'] is True
          assert cfg['tryEnabled'] is True
          assert cfg['realMoneyEnabled'] is False
          op=cfg['operationPolicy']
          assert op['mode']=='30_DAY_VIRTUAL_OPERATION'
          assert op['mainModelVersion']=='EDOGAWA-RESEARCH-MODEL-V2'
          assert op['mainLogicFrozen'] is True
          assert op['realMoney'] is False
          assert op['waterAndTideUpgradeRunsAsSeparateShadow'] is True
          p=cfg['predictionPolicy']
          assert p['strictPreRaceOnly'] is True
          assert p['resultLookahead'] is False
          assert p['payoutLookahead'] is False
          assert p['noGamagoriModelReuse'] is True

          pre=pathlib.Path('.github/workflows/edogawa-pre-race-collector-v1.yml').read_text(encoding='utf-8')
          assert 'jcd=$CODE' in pre and 'CODE=03' in pre
          assert 'raceresult' not in pre
          assert "'predictionEnabled':False" in pre
          assert "'hardLockEnabled':False" in pre
          assert "'resultEndpointsIncluded':False" in pre
          assert "'payoutEndpointsIncluded':False" in pre

          program=pathlib.Path('.github/workflows/edogawa-program-snapshot-v1.yml').read_text(encoding='utf-8')
          assert 'jcd=03' in program
          assert 'raceresult' not in program
          assert "'resultEndpointsIncluded':False" in program
          assert "'resultIncluded':False" in program
          assert "'exhibitionIncluded':False" in program

          result=pathlib.Path('.github/workflows/edogawa-result-collector-v1.yml').read_text(encoding='utf-8')
          assert 'raceresult?hd=' in result and 'jcd=03' in result
          assert "'preRaceDataIncluded':False" in result
          assert "'predictionEnabled':False" in result
          assert "'hardLockEnabled':False" in result

          tide=pathlib.Path('.github/workflows/edogawa-tide-source-probe-v1.yml').read_text(encoding='utf-8')
          assert 'boatrace-edogawa.com' in tide
          assert 'raceresult' not in tide
          assert "'predictionEnabled':False" in tide
          assert "'resultEndpointsIncluded':False" in tide

          for pth in pathlib.Path('scripts').glob('edogawa-*'):
              s=pth.read_text(encoding='utf-8')
              if 'gamagori-main-model' in s.lower():
                  raise SystemExit(f'GAMAGORI_MODEL_REUSE_BLOCKED {pth}')

          print('EDOGAWA_SAFETY_AUDIT_PASS')
          PY

      - name: Verify pure feature contract
        run: |
          set -euo pipefail
          node --check edogawa-feature-contract-v1.js
          node --check scripts/edogawa-feature-contract-test-v1.js
          node scripts/edogawa-feature-contract-test-v1.js

      - name: Verify pure Edogawa research contracts
        run: |
          set -euo pipefail
          node --check edogawa-feature-contract-v1.js
          node --check edogawa-research-model-v1.js
          node --check edogawa-research-model-v2.js
          node --check edogawa-rich-model-v2.js
          node --check scripts/edogawa-lane-prior-v2-backtest-v1.js
          node --check scripts/edogawa-feature-contract-test-v1.js
          node --check scripts/edogawa-research-model-test-v1.js
          node --check scripts/edogawa-rich-model-test-v2.js
          node scripts/edogawa-feature-contract-test-v1.js
          node scripts/edogawa-research-model-test-v1.js
          node scripts/edogawa-rich-model-test-v2.js

      - name: Verify SHADOW evaluation boundary
        run: |
          set -euo pipefail
          node --check scripts/edogawa-shadow-research-v1.js
          node --check scripts/edogawa-rich-shadow-v1.js
          node --check scripts/edogawa-shadow-evaluate-v1.js
          node --check scripts/edogawa-shadow-evaluation-v1.js
          python3 - <<'PY'
          import datetime,glob,json,re
          from zoneinfo import ZoneInfo
          JST=ZoneInfo('Asia/Tokyo')
          for p in glob.glob('live/edogawa/*/shadow/*/race-*.json'):
              x=json.load(open(p,encoding='utf-8'))
              assert x['schema']=='boat-command-edogawa-shadow-research-v1'
              assert x['venue']=='EDOGAWA' and x['venueCode']=='03'
              assert x['researchOnly'] is True
              assert x['productionEnabled'] is False
              assert x['tryEnabled'] is False
              assert x['cashNeutral'] is True
              assert x['resultInput'] is False
              assert x['payoutInput'] is False
              assert x['immutableAfterFirstWrite'] is True
              from datetime import datetime,timezone,timedelta
              g=datetime.fromisoformat(str(x['generatedAt']).replace('Z','+00:00')).astimezone(timezone(timedelta(hours=9)))
              hh,mm=map(int,str(x['deadline']).split(':'))
              deadline=datetime.fromisoformat(str(x['date'])).replace(hour=hh,minute=mm,tzinfo=timezone(timedelta(hours=9)))
              margin=(deadline-g).total_seconds()/60
              assert margin>=3, (p,margin)
              src=x.get('sources') or {}
              assert isinstance(src.get('programSha256'),str) and re.fullmatch(r'[0-9a-f]{64}',src['programSha256'])
              assert isinstance(src.get('programPath'),str) and src['programPath'].startswith('live/edogawa/')
              if x['mode']=='FULL_PRE_RACE':
                  assert isinstance(src.get('preRaceSha256'),str) and re.fullmatch(r'[0-9a-f]{64}',src['preRaceSha256'])
                  assert isinstance(src.get('preRacePath'),str) and '/pre/' in src['preRacePath']
              assert len(x['picks'])==4 and len(set(x['picks']))==4
              assert all(re.fullmatch(r'[1-6]-[1-6]-[1-6]',v) for v in x['picks'])
          for p in glob.glob('live/edogawa/*/research-evaluation-v1.json'):
              x=json.load(open(p,encoding='utf-8'))
              assert x['schema']=='boat-command-edogawa-shadow-evaluation-v1'
              assert x['fundingScope']=='NONE_RESEARCH_ONLY'
              assert x['bankrollAffected'] is False
              assert x['tryAffected'] is False
              assert x['productionAffected'] is False
          print('EDOGAWA_SHADOW_EVALUATION_BOUNDARY_PASS')
          PY

      - name: Verify water validation boundary
        run: |
          set -euo pipefail
          node --check scripts/edogawa-water-feature-validation-v1.js
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('edogawa-water-feature-validation-v1.json')
          if p.exists():
              x=json.loads(p.read_text(encoding='utf-8'))
              assert x['schema']=='boat-command-edogawa-water-feature-validation-v1'
              assert x['venueCode']=='03'
              assert x['researchOnly'] is True
              assert x['predictionInput'] is False
              assert x['resultUsedOnlyAfterRace'] is True
              assert x['modelWeightsPromoted'] is False
          print('EDOGAWA_WATER_VALIDATION_BOUNDARY_PASS')
          PY

      - name: Verify v2 forward-candidate gate remains research only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('edogawa-lane-prior-v2-backtest-v1.json')
          if p.exists():
              x=json.loads(p.read_text(encoding='utf-8'))
              assert x['schema']=='boat-command-edogawa-lane-prior-v2-backtest-v1'
              assert x['venueCode']=='03'
              assert x['strictWalkForward'] is True
              assert x['sameDayRowsExcluded'] is True
              assert x['productionEnabled'] is False
              assert x['tryEnabled'] is False
              assert x['bankrollAffected'] is False
              assert isinstance(x['eligibleForForwardTest'],bool)
          print('EDOGAWA_V2_FORWARD_GATE_BOUNDARY_PASS')
          PY

      - name: Verify automatic promotion remains blocked
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          cfg=json.loads(pathlib.Path('venues/edogawa/config-v1.json').read_text(encoding='utf-8'))
          assert cfg['state']=='LIVE_SIMULATION'
          assert cfg['modelEnabled'] is True and cfg['tryEnabled'] is True
          assert cfg['realMoneyEnabled'] is False
          promotion=cfg['promotionPolicy']
          assert promotion['autoPromotion'] is False
          assert promotion['autoTryEnable'] is False
          assert promotion['realMoneyEnable'] is False
          op=cfg['operationPolicy']
          assert op['mode']=='30_DAY_VIRTUAL_OPERATION'
          assert op['mainLogicFrozen'] is True and op['realMoney'] is False
          if pathlib.Path('edogawa-baseline-backtest-v1.json').exists():
              x=json.loads(pathlib.Path('edogawa-baseline-backtest-v1.json').read_text(encoding='utf-8'))
              assert x['venueCode']=='03'
              assert x['productionEnabled'] is False
              assert x['tryEnabled'] is False
              assert x['promotionEligible'] is False
              assert len(x.get('promotionBlockers',[]))>=1
          print('EDOGAWA_PROMOTION_BLOCK_PASS')
          PY

      - name: Verify current stored Edogawa assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,re
          for p in glob.glob('live/edogawa/*/program/race-*.json'):
              x=json.load(open(p,encoding='utf-8'))
              assert x['venue']=='EDOGAWA' and x['venueCode']=='03'
              assert x['resultEndpointsIncluded'] is False
              assert x['resultIncluded'] is False
              assert x['exhibitionIncluded'] is False
          for p in glob.glob('live/edogawa/*/pre/race-*-pack.json'):
              x=json.load(open(p,encoding='utf-8'))
              assert x['venue']=='EDOGAWA' and x['venueCode']=='03'
              assert x['predictionEnabled'] is False
              assert x['hardLockEnabled'] is False
              assert x['resultEndpointsIncluded'] is False
              assert x['payoutEndpointsIncluded'] is False
          for p in glob.glob('live/edogawa/*/post/race-*-result.json'):
              x=json.load(open(p,encoding='utf-8'))
              assert x['venue']=='EDOGAWA' and x['venueCode']=='03'
              assert x['preRaceDataIncluded'] is False
              assert x['resultEndpointsIncluded'] is True
              assert x['predictionEnabled'] is False
              assert x['hardLockEnabled'] is False
              assert re.fullmatch(r'[1-6]-[1-6]-[1-6]',x['trifecta'])
          print('EDOGAWA_STORED_ASSET_AUDIT_PASS')
          PY

name: gamagori-shadow-feature-analysis-v0331
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gamagori-shadow-feature-analysis-v0331.js'
      - 'gamagori-shadow-pre-v0330.json'
      - 'gamagori-main-history-v0320.json'
      - '.github/workflows/gamagori-shadow-feature-analysis-v0331.yml'
permissions:
  contents: write
concurrency:
  group: gamagori-shadow-feature-analysis-v0331
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Analyze 360-race shadow features
        run: node scripts/gamagori-shadow-feature-analysis-v0331.js
      - name: Contract checks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('gamagori-shadow-feature-analysis-v0331.json','utf8'));
          if(r.rows!==360) throw new Error(`expected 360 rows, got ${r.rows}`);
          if(!r.strictWalkForward||!r.sameDayOutcomeExcluded) throw new Error('leak guard failed');
          if(r.designDates.length!==15||r.holdoutDates.length!==15) throw new Error('15/15 time split failed');
          if(r.decision!=='SHADOW_ONLY') throw new Error('LIVE boundary violated');
          console.log('PASS rows=360 split=15/15 SHADOW_ONLY');
          NODE
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamagori-shadow-feature-analysis-v0331.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(gamagori): add 360-race shadow feature report'
          git push

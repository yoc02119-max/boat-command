name: Naruto rapid build contract v1

on:
  pull_request:
    paths:
      - 'naruto-research-model-v1.js'
      - 'scripts/naruto-*.js'
      - 'venues/naruto/**'
      - '.github/workflows/naruto-*.yml'
      - 'venue-registry-v1.js'
      - 'shared-try-config-v1.json'
      - 'scripts/shared-try-contract-v1.js'
      - '.github/workflows/naruto-rapid-build-contract-v1.yml'
  push:
    branches: [main]
    paths:
      - 'naruto-research-model-v1.js'
      - 'scripts/naruto-*.js'
      - 'venues/naruto/**'
      - '.github/workflows/naruto-*.yml'
      - 'venue-registry-v1.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check naruto-research-model-v1.js
      - run: node --check scripts/naruto-history-analysis-v1.js
      - run: node --check scripts/naruto-baseline-backtest-v1.js
      - run: node --check scripts/naruto-shadow-research-v1.js
      - run: node --check scripts/naruto-shadow-evaluate-v1.js
      - run: node --check scripts/naruto-shadow-evaluation-v1.js
      - run: node --check scripts/naruto-readiness-v1.js
      - run: node scripts/naruto-rapid-build-contract-v1.js

name: PRE-RACE Gamagori live-test scheduler v0.19.5

on:
  workflow_dispatch:
  schedule:
    # 2026-09-08 final-day LIVE test, JST 14:40-20:50.
    # Keep polling every 5 minutes so WAIT automatically becomes READY when data appears.
    - cron: '40,45,50,55 5 8 9 *'
    - cron: '*/5 6-10 8 9 *'
    - cron: '0,5,10,15,20,25,30,35,40,45,50 11 8 9 *'

permissions:
  actions: write
  contents: read

concurrency:
  group: gamagori-live-test-scheduler-2026-09-08
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard live-test date
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          NOW_DATE=$(TZ=Asia/Tokyo date +%F)
          test "$NOW_DATE" = "2026-09-08" || { echo "OUTSIDE_TEST_DATE $NOW_DATE"; exit 1; }

      - name: Dispatch verified PRE-RACE auto-chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pre-race-gamagori-auto-chain-v0194.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "DISPATCHED · pre-race-gamagori-auto-chain-v0194.yml"

name: Gamagori LIVE integrity audit v0.20.8

on:
  workflow_dispatch:
  push:
    paths:
      - 'live-integrity-audit-v0208.js'
      - '.github/workflows/gamagori-live-integrity-v0208.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate integrity JavaScript
        run: node --check live-integrity-audit-v0208.js
      - name: Enforce singleton integrity bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'\n?<script src="live-integrity-audit-v0208\.js\?v=\d+"></script>','',s)
          anchor_re=r'(<script src="live-learning-guard-v0207\.js\?v=\d+"></script>)'
          if not re.search(anchor_re,s):
              raise SystemExit('INTEGRITY_ANCHOR_MISSING')
          tag='<script src="live-integrity-audit-v0208.js?v=214"></script>'
          s=re.sub(anchor_re,lambda m:m.group(1)+'\n'+tag,s,count=1)
          if s.count('live-integrity-audit-v0208.js')!=1:
              raise SystemExit('INTEGRITY_SINGLETON_FAIL')
          p.write_text(s)
          PY
      - name: Commit app integrity enablement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git commit -m 'app: maintain singleton Gamagori live integrity bootstrap'
          git push

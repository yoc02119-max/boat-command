name: Gamagori LIVE final lock guard v0.20.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-live-lock-guard-v0202.yml'
      - 'live-lock-guard-v0202.js'

permissions:
  contents: write

concurrency:
  group: gamagori-live-lock-guard-v0202
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate final lock guard JavaScript
        run: |
          set -euo pipefail
          node --check live-lock-guard-v0202.js

      - name: Enable module and bump app version
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="live-lock-guard-v0202.js?v=202"></script>'
          if tag not in s:
              s=s.replace('</body>',f'{tag}\n</body>')
          s=s.replace('BOAT COMMAND v0.20.1','BOAT COMMAND v0.20.2')
          s=s.replace('v0.20.1 · LIVE AUTO FILL','v0.20.2 · FINAL LOCK GUARD')
          s=s.replace('styles.css?v=201','styles.css?v=202')
          s=s.replace('app.js?v=201','app.js?v=202')
          p.write_text(s)
          print('ENABLED_V0202')
          PY

      - name: Commit app lock-guard enablement
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-relay'
          git config user.email 'boat-command-relay@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: enforce final Gamagori LIVE lock safety gate'
          git push

name: Karatsu history bootstrap recovery v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/karatsu-history-bootstrap-recovery-v2.yml'

permissions:
  contents: write

concurrency:
  group: karatsu-history-bootstrap-recovery-v2
  cancel-in-progress: false

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lhasa
      - name: Build 30-day Karatsu history shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          rm -rf karatsu-recovery-work karatsu-recovery-out
          mkdir -p karatsu-recovery-work karatsu-recovery-out
          python3 program-history-builder-v121.py --self-test
          sleep $((SHARD*2))

          python3 - <<'PY' > karatsu-recovery-work/dates.txt
          import datetime,os
          from zoneinfo import ZoneInfo
          today=datetime.datetime.now(ZoneInfo('Asia/Tokyo')).date()
          start=today-datetime.timedelta(days=180)
          shard=int(os.environ['SHARD'])
          a=start+datetime.timedelta(days=shard*30)
          b=min(a+datetime.timedelta(days=30),today)
          d=a
          while d<b:
              print(d.isoformat())
              d+=datetime.timedelta(days=1)
          PY

          : > karatsu-recovery-work/exceptions.txt
          mkdir -p karatsu-recovery-work/days

          while IFS= read -r d; do
            ymd="${d//-/}"; yyyy="${ymd:0:4}"; mm="${ymd:4:2}"; yy="${ymd:2:2}"; dd="${ymd:6:2}"; ym="${yyyy}${mm}"
            b="b${yy}${mm}${dd}.lzh"; k="k${yy}${mm}${dd}.lzh"
            rm -rf karatsu-recovery-work/one
            mkdir -p karatsu-recovery-work/one/raw karatsu-recovery-work/one/b karatsu-recovery-work/one/k karatsu-recovery-work/one/out

            bc="$(curl -sS -L --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 45 -o karatsu-recovery-work/one/raw/$b -w '%{http_code}' https://www1.mbrace.or.jp/od2/B/${ym}/$b || true)"
            kc="$(curl -sS -L --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 45 -o karatsu-recovery-work/one/raw/$k -w '%{http_code}' https://www1.mbrace.or.jp/od2/K/${ym}/$k || true)"
            if [[ "$bc" != "200" || "$kc" != "200" ]]; then
              echo "$d HTTP B=$bc K=$kc" >> karatsu-recovery-work/exceptions.txt
              sleep 2
              continue
            fi

            lha xw=karatsu-recovery-work/one/b karatsu-recovery-work/one/raw/$b >/dev/null 2>&1 || { echo "$d B_EXTRACT_FAIL" >> karatsu-recovery-work/exceptions.txt; sleep 2; continue; }
            lha xw=karatsu-recovery-work/one/k karatsu-recovery-work/one/raw/$k >/dev/null 2>&1 || { echo "$d K_EXTRACT_FAIL" >> karatsu-recovery-work/exceptions.txt; sleep 2; continue; }

            python3 program-history-builder-v121.py --b-dir karatsu-recovery-work/one/b --k-dir karatsu-recovery-work/one/k --out karatsu-recovery-work/one/out --venue 23 >/dev/null 2>&1 || { echo "$d BUILDER_FAIL" >> karatsu-recovery-work/exceptions.txt; sleep 2; continue; }

            python3 - "$d" <<'PY'
          import json,sys
          from pathlib import Path
          d=sys.argv[1]
          rows=[]
          for p in Path('karatsu-recovery-work/one/out/23').glob('*.json'):
              x=json.loads(p.read_text(encoding='utf-8'))
              rows += [r for r in x.get('races',[]) if r.get('d')==d]
          if not rows:
              raise SystemExit(0)
          ids=[r.get('id') for r in rows]
          if len(ids)!=len(set(ids)): raise SystemExit('DUPLICATE_DAY_IDS')
          if any(str(r.get('id','')).split('-')[3]!='23' for r in rows): raise SystemExit('WRONG_VENUE')
          if any(str(r.get('o','')).count('-')!=2 for r in rows): raise SystemExit('INVALID_RESULT')
          Path(f'karatsu-recovery-work/days/{d}.json').write_text(json.dumps(rows,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
            sleep 2
          done < karatsu-recovery-work/dates.txt

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[]
          for p in sorted(Path('karatsu-recovery-work/days').glob('*.json')):
              rows += json.loads(p.read_text(encoding='utf-8'))
          report={
            'shard':int(os.environ['SHARD']),
            'daysWithRaces':len({r['d'] for r in rows}),
            'races':len(rows),
            'exceptions':[x for x in Path('karatsu-recovery-work/exceptions.txt').read_text().splitlines() if x.strip()]
          }
          Path('karatsu-recovery-out/segment.json').write_text(json.dumps({'races':rows},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('karatsu-recovery-out/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(report)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: karatsu-history-recovery-shard-${{ matrix.shard }}
          path: karatsu-recovery-out/*.json
          retention-days: 14

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: karatsu-history-recovery-shard-*
          path: karatsu-history-recovery-shards
      - name: Merge and audit Karatsu history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json
          from collections import Counter
          from pathlib import Path
          from zoneinfo import ZoneInfo
          rows=[];reports=[]
          for p in Path('karatsu-history-recovery-shards').rglob('segment.json'):
              rows += json.loads(p.read_text(encoding='utf-8')).get('races',[])
          for p in Path('karatsu-history-recovery-shards').rglob('report.json'):
              reports.append(json.loads(p.read_text(encoding='utf-8')))
          rows.sort(key=lambda r:(r['d'],int(r['r'])))
          ids=[r['id'] for r in rows]
          assert len(ids)==len(set(ids))
          assert all(str(r.get('id','')).split('-')[3]=='23' for r in rows)
          assert all(len(r.get('c',[]))==6 for r in rows)
          assert all(str(r.get('o','')).count('-')==2 for r in rows)
          by=Counter(r['d'] for r in rows)
          cutoff=(datetime.datetime.now(ZoneInfo('Asia/Tokyo')).date()-datetime.timedelta(days=1)).isoformat()
          partial={d:n for d,n in by.items() if n!=12}
          out={
            'schema':'boat-command-program-history-v2',
            'builder':'KARATSU-HISTORY-BOOTSTRAP-V1',
            'venueCode':'23',
            'cutoff':cutoff,
            'resultUse':'HISTORICAL_ROWS_ONLY_STRICTLY_BEFORE_TARGET_DATE',
            'exhibitionIncluded':False,
            'waterFeaturesIncluded':False,
            'races':rows
          }
          audit={
            'schema':'boat-command-karatsu-history-audit-v1',
            'venueCode':'23',
            'windowDays':180,
            'cutoff':cutoff,
            'races':len(rows),
            'raceDays':len(by),
            'complete12RaceDays':sum(1 for n in by.values() if n==12),
            'partialOrCancelledDays':len(partial),
            'partialRaceCounts':partial,
            'exceptions':sum((r.get('exceptions',[]) for r in reports),[]),
            'duplicateIds':len(ids)-len(set(ids)),
            'readyForResearch':len(rows)>=300,
            'readyForProductionPrediction':False
          }
          Path('karatsu-history-bootstrap-v1.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('karatsu-history-audit-v1.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          if len(rows)<300:
              raise SystemExit('KARATSU_HISTORY_MIN_300_NOT_REACHED')
          PY

      - name: Publish audited Karatsu history safely
        run: |
          set -euo pipefail
          cp karatsu-history-bootstrap-v1.json /tmp/karatsu-history-bootstrap-v1.json
          cp karatsu-history-audit-v1.json /tmp/karatsu-history-audit-v1.json
          git config user.name 'boat-command-karatsu-history-recovery'
          git config user.email 'boat-command-karatsu-history-recovery@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/karatsu-history-bootstrap-v1.json karatsu-history-bootstrap-v1.json
            cp /tmp/karatsu-history-audit-v1.json karatsu-history-audit-v1.json
            git add karatsu-history-bootstrap-v1.json karatsu-history-audit-v1.json
            git diff --cached --quiet && { echo 'KARATSU_HISTORY_ALREADY_CURRENT'; exit 0; }
            git commit -m 'data(karatsu): publish accelerated audited history'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          echo 'KARATSU_HISTORY_RECOVERY_PUBLISH_FAILED' >&2
          exit 1

name: Gamagori LIVE performance summary fix v0.22.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamagori-live-performance-summary-v0227.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-live-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LIVE final score visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old='''function currentFinalScoreHtml(s){\n  const settled=settledRaces(s), skipped=skippedReplayRaces(s);\n  if(!s.replayRevealed||!settled.length)return "";'''
          new='''function currentFinalScoreHtml(s){\n  const settled=settledRaces(s), skipped=skippedReplayRaces(s);\n  // LIVE settlement is not a replay reveal. Once POST-RACE gating has opened and\n  // official settlements exist, show the performance summary without depending\n  // on the BACKTEST-only replayRevealed flag.\n  if((s.runType==="BACKTEST"&&!s.replayRevealed)||!settled.length)return "";'''
          if s.count(old)!=1:
              raise SystemExit(f'guard patch target count={s.count(old)}')
          s=s.replace(old,new,1)
          old2='''    kicker:s.retestMode?`RETEST FINAL SCORE ${s.retestRunId||""}｜今回の再検証成績`:"BACKTEST FINAL SCORE｜最終成績",'''
          new2='''    kicker:s.retestMode?`RETEST FINAL SCORE ${s.retestRunId||""}｜今回の再検証成績`:(s.runType==="LIVE"?"LIVE FINAL SCORE｜本番成績":"BACKTEST FINAL SCORE｜最終成績"),'''
          if s.count(old2)!=1:
              raise SystemExit(f'kicker patch target count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY

      - name: Verify syntax and regression contract
        run: |
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text()
          assert 'if((s.runType==="BACKTEST"&&!s.replayRevealed)||!settled.length)return "";' in s
          assert 's.runType==="LIVE"?"LIVE FINAL SCORE｜本番成績"' in s
          # Safety contracts must remain in the app after this display-only change.
          assert 'function isResultMode' in s
          assert 'function lockRace' in s
          print('GAMAGORI LIVE SUMMARY CONTRACT OK')
          PY
          git diff --check
          git diff -- app.js

      - name: Commit fix
        run: |
          if git diff --quiet -- app.js; then
            echo 'No app.js change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix: show Gamagori LIVE settlement performance summary'
          git push

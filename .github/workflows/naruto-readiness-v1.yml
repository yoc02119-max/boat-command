name: Naruto readiness v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Naruto history bootstrap 180d v1", "Naruto history analysis v1", "Naruto baseline backtest v1", "Naruto 12R program snapshot v1", "Naruto PRE-RACE collector v1", "Naruto SHADOW research v1", "Naruto POST-RACE result collector v1", "Naruto SHADOW evaluation v1"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/naruto-readiness-v1.yml'
      - 'scripts/naruto-readiness-v1.js'
      - 'venues/naruto/config-v1.json'
      - 'naruto-shadow-evaluation-v1.json'
      - 'live/naruto/**/program/**'
      - 'live/naruto/**/shadow/**'
      - 'live/naruto/**/post/**'

permissions:
  contents: write

concurrency:
  group: naruto-readiness-v1
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh current main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Synthesize Naruto readiness
        run: |
          set -euo pipefail
          node --check scripts/naruto-readiness-v1.js
          node scripts/naruto-readiness-v1.js
          node - <<'NODE'
          const x=require('./venues/naruto/readiness-v1.json');
          if(x.venueCode!=='14'||x.modelEnabled!==true||x.tryEnabled!==true||x.realMoneyEnabled!==false)throw new Error('NARUTO_VIRTUAL_OPERATION_SAFETY');
          if(x.operation?.active!==true||x.operation?.mainLogicFrozen!==true||x.operation?.sharedBankrollStartYen!==1000000)throw new Error('NARUTO_OPERATION_CONTRACT');
          if(Number(x.history?.rows||0)<300&&x.history?.ready===true)throw new Error('FALSE_HISTORY_READY');
          console.log('NARUTO_READINESS_PASS',x.phase,x.history.rows,x.baseline.holdoutRaces);
          NODE
      - name: Commit readiness when changed
        run: |
          set -euo pipefail
          cp venues/naruto/readiness-v1.json /tmp/naruto-readiness-v1.json
          git config user.name 'boat-command-naruto-readiness'
          git config user.email 'boat-command-naruto-readiness@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/naruto-readiness-v1.json venues/naruto/readiness-v1.json
            git add venues/naruto/readiness-v1.json
            git diff --cached --quiet && { echo 'NARUTO_READINESS_CURRENT'; exit 0; }
            git commit -m 'status(naruto): refresh centralized readiness gate'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          echo 'NARUTO_READINESS_PUBLISH_FAILED'
          exit 1

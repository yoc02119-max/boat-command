name: Omura display backfill 2026-09-20

on:
  push:
    branches:
      - repair/omura-2026-09-20-display
    paths:
      - '.github/workflows/omura-display-backfill-20260920.yml'

permissions:
  contents: write

concurrency:
  group: omura-display-backfill-20260920
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect historical result-free program
        run: |
          set -euo pipefail
          python3 scripts/venue-program-collector-v1.py \
            --code 24 --key OMURA --slug omura --date 2026-09-20

      - name: Install result parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect display-only official results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,pathlib,re,requests
          from bs4 import BeautifulSoup
          from zoneinfo import ZoneInfo

          DATE='2026-09-20'; CODE='24'; VENUE='OMURA'; SLUG='omura'
          JST=ZoneInfo('Asia/Tokyo')
          assert datetime.date.fromisoformat(DATE) < datetime.datetime.now(JST).date()
          base=pathlib.Path('live')/SLUG/DATE
          program_dir=base/'program'
          assert program_dir.is_dir()
          outdir=base/'post'; outdir.mkdir(parents=True,exist_ok=True)
          headers={'User-Agent':'BOAT-COMMAND-OMURA-DISPLAY-BACKFILL/1.0'}
          valid_methods={'逃げ','差し','まくり','まくり差し','抜き','恵まれ'}

          for race in range(1,13):
              program=json.loads((program_dir/f'race-{race}.json').read_text(encoding='utf-8'))
              assert program['schema']=='boat-command-program-pack-v1'
              assert program['venue']==VENUE and program['venueCode']==CODE
              assert program['date']==DATE and int(program['race'])==race
              assert program['resultEndpointsIncluded'] is False
              assert program['resultIncluded'] is False
              assert program['exhibitionIncluded'] is False

              path=outdir/f'race-{race}-result.json'
              if path.exists():
                  existing=json.loads(path.read_text(encoding='utf-8'))
                  assert existing['immutableAfterFirstWrite'] is True
                  continue

              url=f'https://www.boatrace.jp/owpc/pc/race/raceresult?hd={DATE.replace("-","")}&jcd={CODE}&rno={race}'
              res=requests.get(url,headers=headers,timeout=30)
              res.raise_for_status()
              soup=BeautifulSoup(res.text,'html.parser')
              trifecta=payout=exacta=exacta_payout=win=win_payout=None
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)<3: continue
                  label=cells[0].replace(' ',''); raw_pick=cells[1]
                  pm=re.search(r'([\d,]+)',cells[2].replace('¥','').replace('￥',''))
                  if label=='3連単':
                      m=re.search(r'([1-6])\s*[-–—]\s*([1-6])\s*[-–—]\s*([1-6])',raw_pick)
                      if m and pm:
                          trifecta='-'.join(m.groups()); payout=int(pm.group(1).replace(',',''))
                  elif label=='2連単':
                      m=re.search(r'([1-6])\s*[-–—]\s*([1-6])',raw_pick)
                      if m and pm:
                          exacta='-'.join(m.groups()); exacta_payout=int(pm.group(1).replace(',',''))
                  elif label=='単勝':
                      m=re.search(r'([1-6])',raw_pick)
                      if m and pm:
                          win=m.group(1); win_payout=int(pm.group(1).replace(',',''))
              assert trifecta and payout is not None, (race,'RESULT_NOT_READY')

              finish=[]
              for tr in soup.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
                  if len(cells)>=2 and cells[0] in {'１','２','３','４','５','６','1','2','3','4','5','6'} and re.fullmatch(r'[1-6]',cells[1].strip()):
                      finish.append(int(cells[1].strip()))
              plain=' '.join(soup.stripped_strings)
              mm=re.search(r'決まり手\s*(まくり差し|まくり|逃げ|差し|抜き|恵まれ)(?:\s|$)',plain)
              method=mm.group(1) if mm else None

              payload={
                  'schema':'boat-command-live-result-v1',
                  'version':'VENUE-DISPLAY-BACKFILL-V1',
                  'venue':VENUE,'venueCode':CODE,'slug':SLUG,'date':DATE,'race':race,
                  'fetchedAt':datetime.datetime.now(JST).isoformat(),
                  'officialSource':url,
                  'trifecta':trifecta,'payout100':payout,'finishOrder':finish[:6],
                  'exacta':exacta,'exactaPayout100':exacta_payout,
                  'win':win,'winPayout100':win_payout,
                  'winningMethod':method if method in valid_methods else None,
                  'preRaceDataIncluded':False,'resultEndpointsIncluded':True,
                  'predictionEnabled':False,'hardLockEnabled':False,'tryEnabled':False,
                  'immutableAfterFirstWrite':True,
                  'preRaceEvidenceRequired':False,
                  'evaluationEligible':False,
                  'preRaceEvidenceType':'NONE_DISPLAY_ONLY',
                  'preRaceEvidencePaths':[],
                  'preRaceEvidenceGeneratedAt':{},
                  'displayBackfill':True,
                  'backfillReason':'MISSING_LIVE_CAPTURE'
              }
              path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('OMURA_DISPLAY_RESULTS_BACKFILLED',len(list(outdir.glob('race-*-result.json'))))
          PY

      - name: Cross-check frozen history and refresh readiness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          date='2026-09-20'
          hist=json.loads(pathlib.Path('omura-history-bootstrap-v1.json').read_text(encoding='utf-8'))
          expected={int(x['r']):(x['o'],int(x['p'])) for x in hist['races'] if x.get('d')==date}
          assert len(expected)==12, len(expected)
          base=pathlib.Path('live/omura')/date
          programs=sorted((base/'program').glob('race-*.json'))
          results=sorted((base/'post').glob('race-*-result.json'))
          assert len(programs)==12 and len(results)==12
          for race in range(1,13):
              p=json.loads((base/f'program/race-{race}.json').read_text(encoding='utf-8'))
              r=json.loads((base/f'post/race-{race}-result.json').read_text(encoding='utf-8'))
              assert len(p['boats'])==6 and [b['lane'] for b in p['boats']]==[1,2,3,4,5,6]
              assert r['evaluationEligible'] is False
              assert r['preRaceEvidenceRequired'] is False
              assert r['preRaceEvidenceType']=='NONE_DISPLAY_ONLY'
              assert r['preRaceEvidencePaths']==[] and r['preRaceEvidenceGeneratedAt']=={}
              assert r['predictionEnabled'] is False and r['hardLockEnabled'] is False and r['tryEnabled'] is False
              assert r['immutableAfterFirstWrite'] is True
              assert re.fullmatch(r'[1-6]-[1-6]-[1-6]',r['trifecta'])
              assert (r['trifecta'],int(r['payout100']))==expected[race], (race,r['trifecta'],r['payout100'],expected[race])
          print('OMURA_HISTORY_CROSSCHECK_PASS')
          PY
          node --check scripts/venue-readiness-refresh-v1.js
          node scripts/venue-readiness-refresh-v1.js omura OMURA 24
          python3 - <<'PY'
          import json
          x=json.load(open('venues/omura/readiness-v1.json',encoding='utf-8'))
          assert x['latestDate']=='2026-09-20'
          assert x['current']['programReady'] is True
          assert x['current']['programRaceCount']==12
          assert x['current']['postResults']==12
          assert x['current']['shadowClassBaseline']==0
          assert x['current']['shadowProgramOnly']==0
          assert x['current']['evaluatedProgramOnly']==0
          assert x['forward']['programOnlyRaces']==0
          assert x['operation']['mode']=='SHADOW_ONLY' and x['operation']['active'] is False
          assert x['modelEnabled'] is False and x['tryEnabled'] is False and x['realMoneyEnabled'] is False
          print('OMURA_READINESS_BACKFILL_PASS')
          PY

      - name: Commit only display backfill artifacts
        run: |
          set -euo pipefail
          git config user.name 'boat-command-repair'
          git config user.email 'boat-command-repair@users.noreply.github.com'
          git add live/omura/2026-09-20/program live/omura/2026-09-20/post venues/omura/readiness-v1.json
          git diff --cached --quiet && { echo 'OMURA_BACKFILL_ALREADY_PRESENT'; exit 0; }
          git commit -m 'repair: restore Omura 2026-09-20 display data'
          git push origin HEAD:repair/omura-2026-09-20-display

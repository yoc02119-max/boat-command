name: Gamagori LIVE integration dedup v0.22.4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-live-integration-dedup-v0224.yml'
      - 'app.js'
      - 'gamagori-live-integration-v0198.js'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: gamagori-live-integration-dedup-v0224
  cancel-in-progress: true

jobs:
  dedup-audit:
    # Retired with the exhibition-free v0.32.0 runtime. Kept for manual legacy diagnostics only.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JavaScript syntax audit
        run: |
          set -euo pipefail
          node --check app.js
          node --check gamagori-live-integration-v0198.js

      - name: Verify single canonical loader plus one compatibility bridge
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.js').read_text(encoding='utf-8')
          compat = Path('gamagori-live-integration-v0198.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')

          app_loader = len(re.findall(r'\basync\s+function\s+loadVerifiedLiveRace\s*\(', app))
          compat_loader_decl = len(re.findall(r'\basync\s+function\s+loadVerifiedLiveRace\s*\(', compat))
          compat_bridge_assign = len(re.findall(r'window\.loadVerifiedLiveRace\s*=\s*async\s+function\s*\(', compat))
          compat_legacy_decl = len(re.findall(r'\bconst\s+BC_LIVE_V0198\s*=', compat))

          if app_loader != 1:
            raise SystemExit(f'CANONICAL_LIVE_LOADER_COUNT_INVALID:{app_loader}')
          if compat_loader_decl != 0 or compat_legacy_decl != 0:
            raise SystemExit(f'DUPLICATE_LIVE_GLOBALS_IN_COMPAT_ASSET: loader={compat_loader_decl} legacy={compat_legacy_decl}')
          if compat_bridge_assign != 1:
            raise SystemExit(f'LIVE_PACK_BRIDGE_COUNT_INVALID:{compat_bridge_assign}')
          for token in ['duplicateGlobalsDeclared:false','implementation:\'app.js\'','canonicalLoader=typeof window.loadVerifiedLiveRace']:
            if token not in compat:
              raise SystemExit(f'COMPAT_GUARD_TOKEN_MISSING:{token}')

          scripts = re.findall(r'<script\s+src="([^"]+)"', html)
          bases = [x.split('?',1)[0] for x in scripts]
          for required in ['app.js','gamagori-live-integration-v0198.js']:
            if bases.count(required) != 1:
              raise SystemExit(f'LIVE_INTEGRATION_SCRIPT_SINGLETON_INVALID:{required}:{bases.count(required)}')
          if bases.index('app.js') > bases.index('gamagori-live-integration-v0198.js'):
            raise SystemExit('LIVE_INTEGRATION_SCRIPT_ORDER_INVALID')

          print('GAMAGORI_LIVE_INTEGRATION_DEDUP_PASS')

      - name: Align compatibility asset cache with trial shell
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          shell = re.search(r'app\.js\?v=(\d+)', html)
          if not shell:
            raise SystemExit('APP_CACHE_KEY_MISSING')
          cache = shell.group(1)
          pattern = r'gamagori-live-integration-v0198\.js\?v=\d+'
          replacement = f'gamagori-live-integration-v0198.js?v={cache}'
          new, count = re.subn(pattern, replacement, html)
          if count != 1:
            raise SystemExit(f'LIVE_COMPAT_CACHE_KEY_MATCH_COUNT:{count}')
          p.write_text(new, encoding='utf-8')

      - name: Verify final cache key and PRE/POST boundary
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          compat = Path('gamagori-live-integration-v0198.js').read_text(encoding='utf-8')
          app_cache = re.search(r'app\.js\?v=(\d+)', html)
          compat_cache = re.search(r'gamagori-live-integration-v0198\.js\?v=(\d+)', html)
          if not app_cache or not compat_cache or app_cache.group(1) != compat_cache.group(1):
            raise SystemExit('LIVE_COMPAT_CACHE_KEY_NOT_ALIGNED')

          # The current core accepts only the explicit result-free PRE-RACE pack schema and
          # refuses any pack unless the producer asserts resultEndpointsIncluded === false.
          for token in ["boat-command-live-pre-race-pack-v1","pack.resultEndpointsIncluded!==false","./live/gamagori/${date}/pre/race-${race}-pack.json"]:
            if token not in app:
              raise SystemExit(f'PRE_RACE_CORE_BOUNDARY_MISSING:{token}')
          if 'resultEndpointsIncluded!==false' not in compat or 'No POST-RACE/result endpoint is referenced here.' not in compat:
            raise SystemExit('COMPAT_PRE_RACE_BOUNDARY_MISSING')
          if '/post/' in compat or 'raceresult' in compat.lower():
            raise SystemExit('COMPAT_POST_RACE_SURFACE_FOUND')
          print('GAMAGORI_LIVE_INTEGRATION_FINAL_PASS')

      - name: Commit cache-key repair
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'NO_INDEX_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: align Gamagori LIVE integration cache with trial shell'
          git pull --rebase origin main
          git push

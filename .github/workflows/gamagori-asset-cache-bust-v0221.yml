name: Gamagori asset cache-bust guard v0.22.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'gamagori-live-integration-v0198.js'
      - 'live-program-v0270.js'
      - 'live-autopoll-v0199.js'
      - 'live-predictor-v0200.js'
      - 'live-two-stage-v0260.js'
      - 'live-prediction-compact-v0261.js'
      - 'live-skip-gate-v0225.js'
      - 'live-autofill-v0201.js'
      - 'live-lock-guard-v0202.js'
      - 'live-lock-snapshot-v0203.js'
      - 'live-result-v0204.js'
      - 'live-learning-v0205.js'
      - 'live-learning-dashboard-v0206.js'
      - 'live-learning-guard-v0207.js'
      - 'live-integrity-audit-v0208.js'
      - 'live-snapshot-hash-guard-v0209.js'
      - 'development-status-v0217.js'
      - 'trial-readiness-v0218.js'
      - 'live-session-today-v0263.js'
      - 'trial-readiness-v0272.js'
      - 'live-manual-refresh-v0276.js'
      - '.github/workflows/gamagori-asset-cache-bust-v0221.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-asset-cache-bust-v0221
  cancel-in-progress: false

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh same-origin app asset cache keys
        shell: python
        run: |
          from pathlib import Path
          import re

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          # Ensure the manual refresh module is published in the live shell.
          if 'live-manual-refresh-v0276.js' not in html:
              anchor = '<script src="trial-readiness-v0272.js'
              pos = html.find(anchor)
              tag = '<script src="live-manual-refresh-v0276.js"></script>'
              if pos >= 0:
                  html = html[:pos] + tag + html[pos:]
              else:
                  html = html.replace('</body>', tag + '</body>')

          # Preserve the first include and remove exact duplicate runtime scripts.
          seen=set()
          def dedupe_script(m):
              path=m.group(1)
              base=path.split('?',1)[0]
              if base in seen:
                  return ''
              seen.add(base)
              return m.group(0)
          html=re.sub(r'<script\s+src="([^"]+\.js(?:\?v=\d+)?)"></script>\s*',dedupe_script,html)

          existing = [int(x) for x in re.findall(r'[?&]v=(\d+)', html)]
          token = str((max(existing) if existing else 0) + 1)
          Path('/tmp/boat-command-cache-token').write_text(token, encoding='utf-8')

          html = re.sub(r'href="manifest\.webmanifest(?:\?v=\d+)?"', f'href="manifest.webmanifest?v={token}"', html)
          html = re.sub(r'href="icon\.svg(?:\?v=\d+)?"', f'href="icon.svg?v={token}"', html)
          html = re.sub(r'href="styles\.css(?:\?v=\d+)?"', f'href="styles.css?v={token}"', html)
          html = re.sub(r'src="([^"]+\.js)(?:\?v=\d+)?"', rf'src="\1?v={token}"', html)
          html_path.write_text(html, encoding='utf-8')
          print(f'CACHE_TOKEN={token}')

      - name: Verify cache-bust and PWA metadata contract
        shell: python
        run: |
          from pathlib import Path
          import json, re

          html = Path('index.html').read_text(encoding='utf-8')
          token = Path('/tmp/boat-command-cache-token').read_text(encoding='utf-8').strip()
          if not token.isdigit():
              raise SystemExit('CACHE_TOKEN_INVALID')
          for asset in ('manifest.webmanifest','icon.svg','styles.css'):
              if f'{asset}?v={token}' not in html:
                  raise SystemExit(f'CACHE_KEY_MISSING:{asset}')

          scripts = re.findall(r'<script\s+src="([^"]+)"', html)
          if not scripts:
              raise SystemExit('APP_SCRIPTS_MISSING')
          bad = [s for s in scripts if not s.endswith(f'?v={token}')]
          if bad:
              raise SystemExit(f'STALE_SCRIPT_CACHE_KEYS:{bad}')
          bases=[s.split('?',1)[0] for s in scripts]
          dupes=sorted({s for s in bases if bases.count(s)>1})
          if dupes:
              raise SystemExit(f'DUPLICATE_RUNTIME_SCRIPTS:{dupes}')

          required={'live-two-stage-v0260.js','live-prediction-compact-v0261.js','live-manual-refresh-v0276.js'}
          missing=sorted(required-set(bases))
          if missing:
              raise SystemExit(f'GAMAGORI_TRIAL_UI_ASSET_MISSING:{missing}')

          all_tokens = [int(x) for x in re.findall(r'[?&]v=(\d+)', html)]
          if not all_tokens or len(set(all_tokens)) != 1 or all_tokens[0] != int(token):
              raise SystemExit(f'CACHE_KEYS_NOT_MONOTONIC:{all_tokens}')

          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('name') != 'BOAT COMMAND' or manifest.get('scope') != './':
              raise SystemExit('PWA_SCOPE_CONTRACT_CHANGED')
          if manifest.get('start_url') not in ('./','./portal.html'):
              raise SystemExit(f'PWA_START_URL_UNEXPECTED:{manifest.get("start_url")}')
          print(f'GAMAGORI_ASSET_CACHE_BUST_PASS token={token} scripts={len(scripts)} start_url={manifest.get("start_url")}')

      - name: Commit cache-safe app shell
        run: |
          if git diff --quiet -- index.html; then
            echo 'No cache metadata change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: refresh Gamagori iPad app asset cache keys v0.22.2'

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Cache-safe app shell pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push race on attempt ${attempt}; refreshing main before retry."
            sleep $((attempt * 2))
          done
          echo 'CACHE_BUST_PUSH_RETRIES_EXHAUSTED' >&2
          exit 1

name: Gamagori asset cache-bust guard v0.22.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'gamagori-live-integration-v0198.js'
      - 'live-autopoll-v0199.js'
      - 'live-predictor-v0200.js'
      - 'live-skip-gate-v0225.js'
      - 'live-autofill-v0201.js'
      - 'live-lock-guard-v0202.js'
      - 'live-lock-snapshot-v0203.js'
      - 'live-result-v0204.js'
      - 'live-learning-v0205.js'
      - 'live-learning-dashboard-v0206.js'
      - 'live-learning-guard-v0207.js'
      - 'live-integrity-audit-v0208.js'
      - 'live-snapshot-hash-guard-v0209.js'
      - 'development-status-v0217.js'
      - 'trial-readiness-v0218.js'
      - '.github/workflows/gamagori-asset-cache-bust-v0221.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-asset-cache-bust-v0221
  cancel-in-progress: false

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh same-origin app asset cache keys
        shell: python
        run: |
          from pathlib import Path
          import json, re

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          # Never roll a newer module back to an older cache key. Use one token
          # strictly greater than every existing numeric app-shell cache key.
          existing = [int(x) for x in re.findall(r'[?&]v=(\d+)', html)]
          token = str((max(existing) if existing else 0) + 1)
          Path('/tmp/boat-command-cache-token').write_text(token, encoding='utf-8')

          # iPad/Safari can retain same-origin assets across deploys. Keep the
          # semantic app version unchanged; only refresh deterministic asset URLs.
          html = re.sub(r'href="manifest\.webmanifest(?:\?v=\d+)?"', f'href="manifest.webmanifest?v={token}"', html)
          html = re.sub(r'href="icon\.svg(?:\?v=\d+)?"', f'href="icon.svg?v={token}"', html)
          html = re.sub(r'href="styles\.css(?:\?v=\d+)?"', f'href="styles.css?v={token}"', html)
          html = re.sub(r'src="([^"]+\.js)(?:\?v=\d+)?"', rf'src="\1?v={token}"', html)
          html_path.write_text(html, encoding='utf-8')

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['description'] = 'BOAT COMMAND v0.21.8 EARLY TRIAL — 蒲郡 strict-blind live/backtest analytics'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'CACHE_TOKEN={token}')

      - name: Verify cache-bust and PWA metadata contract
        shell: python
        run: |
          from pathlib import Path
          import json, re

          html = Path('index.html').read_text(encoding='utf-8')
          token = Path('/tmp/boat-command-cache-token').read_text(encoding='utf-8').strip()
          if not token.isdigit():
              raise SystemExit('CACHE_TOKEN_INVALID')
          if f'manifest.webmanifest?v={token}' not in html:
              raise SystemExit('MANIFEST_CACHE_KEY_MISSING')
          if f'icon.svg?v={token}' not in html:
              raise SystemExit('ICON_CACHE_KEY_MISSING')
          if f'styles.css?v={token}' not in html:
              raise SystemExit('CSS_CACHE_KEY_MISSING')

          scripts = re.findall(r'<script\s+src="([^"]+)"', html)
          if not scripts:
              raise SystemExit('APP_SCRIPTS_MISSING')
          bad = [s for s in scripts if not s.endswith(f'?v={token}')]
          if bad:
              raise SystemExit(f'STALE_SCRIPT_CACHE_KEYS:{bad}')

          # Guard against accidental rollback if this workflow is edited again.
          all_tokens = [int(x) for x in re.findall(r'[?&]v=(\d+)', html)]
          if not all_tokens or len(set(all_tokens)) != 1 or all_tokens[0] != int(token):
              raise SystemExit(f'CACHE_KEYS_NOT_MONOTONIC:{all_tokens}')

          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('name') != 'BOAT COMMAND' or manifest.get('start_url') != './' or manifest.get('scope') != './':
              raise SystemExit('PWA_SCOPE_CONTRACT_CHANGED')
          if 'v0.21.8 EARLY TRIAL' not in manifest.get('description',''):
              raise SystemExit('PWA_DESCRIPTION_STALE')
          print(f'GAMAGORI_ASSET_CACHE_BUST_PASS token={token}')

      - name: Commit cache-safe app shell
        run: |
          if git diff --quiet -- index.html manifest.webmanifest; then
            echo 'No cache metadata change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest
          git commit -m 'fix: refresh Gamagori iPad app asset cache keys v0.22.1'
          git push

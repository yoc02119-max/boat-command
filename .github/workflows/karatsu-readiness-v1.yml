name: Karatsu readiness v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Karatsu history bootstrap 180d v1", "Karatsu history bootstrap recovery v2", "Karatsu history analysis v1", "Karatsu baseline backtest v1", "Karatsu 12R program snapshot v1", "Karatsu PRE-RACE collector v1", "Karatsu SHADOW research v1", "Karatsu POST-RACE result collector v1", "Karatsu SHADOW evaluation v1"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/karatsu-readiness-v1.yml'
      - 'scripts/karatsu-readiness-v1.js'
      - 'venues/karatsu/config-v1.json'
      - 'karatsu-shadow-evaluation-v1.json'
      - 'live/karatsu/**/program/**'
      - 'live/karatsu/**/shadow/**'
      - 'live/karatsu/**/post/**'

permissions:
  contents: write

concurrency:
  group: karatsu-readiness-v1
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh current main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Synthesize Karatsu readiness
        run: |
          set -euo pipefail
          node --check scripts/karatsu-readiness-v1.js
          node scripts/karatsu-readiness-v1.js
          node - <<'NODE'
          const x=require('./venues/karatsu/readiness-v1.json');
          if(x.venueCode!=='23'||x.modelEnabled!==true||x.tryEnabled!==true||x.realMoneyEnabled!==false)throw new Error('KARATSU_VIRTUAL_OPERATION_SAFETY');
          if(x.operation?.active!==true||x.operation?.mainLogicFrozen!==true||x.operation?.sharedBankrollStartYen!==1000000)throw new Error('KARATSU_OPERATION_CONTRACT');
          if(Number(x.history?.rows||0)<300&&x.history?.ready===true)throw new Error('FALSE_HISTORY_READY');
          console.log('KARATSU_READINESS_PASS',x.phase,x.history.rows,x.baseline.holdoutRaces);
          NODE
      - name: Commit readiness when changed
        run: |
          set -euo pipefail
          cp venues/karatsu/readiness-v1.json /tmp/karatsu-readiness-v1.json
          git config user.name 'boat-command-karatsu-readiness'
          git config user.email 'boat-command-karatsu-readiness@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/karatsu-readiness-v1.json venues/karatsu/readiness-v1.json
            git add venues/karatsu/readiness-v1.json
            git diff --cached --quiet && { echo 'KARATSU_READINESS_CURRENT'; exit 0; }
            git commit -m 'status(karatsu): refresh centralized readiness gate'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          echo 'KARATSU_READINESS_PUBLISH_FAILED'
          exit 1

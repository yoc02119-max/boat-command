name: Gamagori second-place diagnostic v0.33.7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamagori-second-place-analysis-v0337.yml'
      - 'scripts/gamagori-second-place-analysis-v0337.js'
      - 'gamagori-shadow-pre-v0330.json'
      - 'gamagori-replay-predictions-v0333.json'
      - 'gamagori-replay-results-v0333.json'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run leakage-safe second-place diagnostic
        run: node scripts/gamagori-second-place-analysis-v0337.js
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamagori-second-place-analysis-v0337.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(gamagori): publish second-place diagnostic'
          git push

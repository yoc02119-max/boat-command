name: BOAT COMMAND personal agent v0.33.5

on:
  push:
    paths:
      - 'index.html'
      - 'boat-command-agent-v0335.js'
      - 'boat-ai-visual-v0312.js'
      - 'boat-voice-agent-v0296.js'
      - 'boat-chatgpt-voice-v0298.js'
      - 'scripts/boat-command-agent-boundary-v0335.js'
      - '.github/workflows/boat-command-agent-v0335.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check boat-command-agent-v0335.js
          node --check boat-ai-visual-v0312.js
          node --check boat-voice-agent-v0296.js
          node --check boat-chatgpt-voice-v0298.js
          node --check scripts/boat-command-agent-boundary-v0335.js
      - name: Agent permission boundary
        run: node scripts/boat-command-agent-boundary-v0335.js
      - name: Current LIVE prediction files untouched
        run: |
          git diff --exit-code HEAD^ -- \
            app.js \
            live-program-v0270.js \
            gamagori-main-model-v0320.js \
            live-main-autofill-v0320.js \
            live-main-prediction-v0320.js \
            live-main-lock-guard-v0320.js \
            trial-lock-all-v0327.js \
            live-lock-snapshot-v0203.js \
            live-result-v0204.js \
            live-snapshot-hash-guard-v0209.js \
            live-session-today-v0263.js \
            live-manual-refresh-v0276.js \
            trial-readiness-v0272.js \
            live-performance-v0323.js
      - name: Loaded order and minimal UI
        shell: python
        run: |
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          required=['boat-ai-core-v0290.js','boat-command-agent-v0335.js','boat-voice-agent-v0296.js','boat-chatgpt-voice-v0298.js','boat-ai-visual-v0312.js']
          positions=[h.index(x) for x in required]
          assert positions==sorted(positions), positions
          assert h.count('boat-command-agent-v0335.js')==1
          assert '<em>REPLAY</em>' in h and ('v0.33.6' in h or 'v0.33.7' in h)
          agent=Path('boat-command-agent-v0335.js').read_text(encoding='utf-8')
          voice=Path('boat-voice-agent-v0296.js').read_text(encoding='utf-8')
          bridge=Path('boat-chatgpt-voice-v0298.js').read_text(encoding='utf-8')
          visual=Path('boat-ai-visual-v0312.js').read_text(encoding='utf-8')
          assert 'BOAT_COMMAND_AGENT_V0335' in voice
          assert 'embedded:true' in bridge and 'opensExternalPage:false' in bridge
          assert 'window.open(' not in bridge
          assert 'boat-command-agent-event' in visual and 'VOICE / AI TRANSCRIPT' in visual
          assert not __import__('re').search(r'(?:result|payout|exhibition)s?\\.json',agent,__import__('re').I)
          print('AGENT_UI_CONTRACT_PASS')

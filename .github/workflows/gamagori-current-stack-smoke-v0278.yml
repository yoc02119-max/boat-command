name: Gamagori current LIVE stack smoke v0.27.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-current-stack-smoke-v0278.yml'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'live-program-v0270.js'
      - 'live-two-stage-v0260.js'
      - 'live-manual-refresh-v0276.js'
      - 'live-session-today-v0263.js'
      - 'trial-readiness-v0272.js'
      - 'live-autopoll-v0199.js'
      - 'live-predictor-v0200.js'
      - 'live-autofill-v0201.js'
      - 'live-lock-guard-v0202.js'
      - 'live-lock-snapshot-v0203.js'
      - 'live-result-v0204.js'
      - 'live-snapshot-hash-guard-v0209.js'
      - 'live/gamagori/**/program/**'

permissions:
  contents: read

concurrency:
  group: gamagori-current-stack-smoke-v0278
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax audit current Gamagori LIVE modules
        run: |
          set -euo pipefail
          for f in app.js live-program-v0270.js live-autopoll-v0199.js live-predictor-v0200.js live-two-stage-v0260.js live-autofill-v0201.js live-lock-guard-v0202.js live-lock-snapshot-v0203.js live-result-v0204.js live-snapshot-hash-guard-v0209.js live-session-today-v0263.js live-manual-refresh-v0276.js trial-readiness-v0272.js; do
            node --check "$f"
          done
      - name: Verify current DOM, script order and single cache key
        shell: python
        run: |
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          ids=['sessionDate','modeBadge','runType','predictionList','resultGate','resultSummary','resultList','raceStrip']
          miss=[x for x in ids if not re.search(rf'id=["\']{x}["\']',h)]
          assert not miss, f'DOM_MISSING:{miss}'
          required=['app.js','live-program-v0270.js','live-autopoll-v0199.js','live-predictor-v0200.js','live-two-stage-v0260.js','live-autofill-v0201.js','live-lock-guard-v0202.js','live-lock-snapshot-v0203.js','live-result-v0204.js','live-snapshot-hash-guard-v0209.js','live-session-today-v0263.js','live-manual-refresh-v0276.js','trial-readiness-v0272.js']
          srcs=re.findall(r'<script\s+src="([^"]+)"',h); bases=[x.split('?',1)[0] for x in srcs]
          miss=[x for x in required if x not in bases]; assert not miss, f'SCRIPT_MISSING:{miss}'
          pos=[bases.index(x) for x in required]; assert pos==sorted(pos), f'SCRIPT_ORDER_BAD:{pos}'
          keys=[]
          for x in srcs:
            m=re.search(r'[?&]v=(\d+)',x)
            assert m, f'CACHE_KEY_MISSING:{x}'
            keys.append(m.group(1))
          assert len(set(keys))==1, f'CACHE_KEYS_MIXED:{sorted(set(keys))}'
          print('CURRENT_STACK_CONTRACT_PASS', keys[0])
      - name: Verify today's result-free 12R program snapshot when present
        shell: python
        run: |
          from pathlib import Path
          import datetime,json
          from zoneinfo import ZoneInfo
          d=datetime.datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          base=Path('live/gamagori')/d/'program'
          if not base.exists():
            print('PROGRAM_NOT_PUBLISHED_YET',d)
            raise SystemExit(0)
          manifest=json.loads((base/'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('allProgramReady') is True and manifest.get('races')==12
          assert manifest.get('exhibitionIncluded') is False
          assert manifest.get('resultIncluded') is False and manifest.get('resultEndpointsIncluded') is False
          for n in range(1,13):
            p=json.loads((base/f'race-{n}.json').read_text(encoding='utf-8'))
            assert p.get('schema')=='boat-command-program-pack-v1'
            assert p.get('race')==n and len(p.get('boats',[]))==6
            assert [b.get('lane') for b in p['boats']]==[1,2,3,4,5,6]
            assert all(b.get('class') in ('A1','A2','B1','B2') for b in p['boats'])
            assert p.get('exhibitionIncluded') is False
            assert p.get('resultIncluded') is False and p.get('resultEndpointsIncluded') is False
          print('PROGRAM_12_OF_12_RESULT_FREE_PASS',d)
      - name: Verify public app and current assets
        env:
          APP_URL: https://yoc02119-max.github.io/boat-command/
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/public.html -w '%{http_code}' --max-time 20 "${APP_URL}?v=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = 200 ] && grep -Fq 'live-program-v0270.js?v=' /tmp/public.html && grep -Fq 'live-manual-refresh-v0276.js?v=' /tmp/public.html && grep -Fq 'trial-readiness-v0272.js?v=' /tmp/public.html; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = 1
          for asset in app.js live-program-v0270.js live-two-stage-v0260.js live-manual-refresh-v0276.js trial-readiness-v0272.js; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "${APP_URL}${asset}?v=${GITHUB_RUN_ID}" || true)
            test "$code" = 200 || { echo "PUBLIC_ASSET_FAIL $code $asset"; exit 1; }
          done
          echo PUBLIC_CURRENT_STACK_PASS

name: Gamagori early trial readiness v0.21.8 + skip gate v0.22.5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-early-trial-readiness-v0218.yml'
      - 'trial-readiness-v0218.js'
      - 'live-skip-gate-v0225.js'
      - 'gamagori-live-integration-v0198.js'
      - 'index.html'
      - 'portal.html'
      - 'manifest.webmanifest'

permissions:
  contents: read

concurrency:
  group: gamagori-early-trial-readiness
  cancel-in-progress: true

jobs:
  readiness-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax audit
        run: |
          set -euo pipefail
          node --check trial-readiness-v0218.js
          node --check live-skip-gate-v0225.js
          node --check gamagori-live-integration-v0198.js

      - name: Verify read-only trial gate and critical DOM contract
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          gate = Path('trial-readiness-v0218.js').read_text(encoding='utf-8')
          skip = Path('live-skip-gate-v0225.js').read_text(encoding='utf-8')
          compat = Path('gamagori-live-integration-v0198.js').read_text(encoding='utf-8')

          required_ids = [
            'sessionDate','modeBadge','runType','strategyVersion','predictionList','lockAllBtn',
            'resultGate','resultGateBadge','resultSummary','resultList','raceStrip',
            'chat','prompt','send','liveDate','liveRace'
          ]
          missing_ids = [x for x in required_ids if not re.search(rf'id=["\']{re.escape(x)}["\']', html)]
          if missing_ids:
            raise SystemExit(f'CRITICAL_DOM_ID_MISSING: {missing_ids}')

          forbidden_literals = ['raceresult', 'result?jcd=', 'officialResult', 'fetchResult', 'settleRace(']
          bad = [x for x in forbidden_literals if x in gate]
          mutation_patterns = [
            r'(^|\n)\s*lockRace\s*=(?!=)',
            r'window\.lockRace\s*=(?!=)',
            r'(^|\n)\s*saveStore\s*\('
          ]
          bad_patterns = [p for p in mutation_patterns if re.search(p, gate)]
          if bad or bad_patterns:
            raise SystemExit(f'TRIAL_GATE_MUST_BE_READ_ONLY: literals={bad} patterns={bad_patterns}')

          required_tokens = [
            'productionMutation:false',
            'predictionQualityCertified:false',
            'liveSkipGate:',
            'skipExcludedFromLockTarget:true',
            'bcFinalLiveLockAudit',
            'bcVerifyLiveLockSnapshotV0203',
            'bcVerifyLiveLockSnapshotHashV0209',
            "status:ok?'READY_FOR_EARLY_TRIAL':'HOLD'",
          ]
          missing_tokens = [x for x in required_tokens if x not in gate]
          if missing_tokens:
            raise SystemExit(f'READINESS_GUARD_TOKEN_MISSING: {missing_tokens}')

          if 'waitFailClosed:true' not in skip or 'resultLookahead:false' not in skip:
            raise SystemExit('LIVE_SKIP_FAIL_CLOSED_CONTRACT_MISSING')
          if "if(bcLiveUnresolvedV0225(s).length)return false" not in skip:
            raise SystemExit('LIVE_WAIT_RESULT_GATE_MISSING')
          if 'duplicateGlobalsDeclared:false' not in compat:
            raise SystemExit('LIVE_INTEGRATION_COMPAT_GUARD_MISSING')
          if 'predictionDomScoped:true' not in compat or 'raceIdentityFailClosed:true' not in compat:
            raise SystemExit('LIVE_INTEGRATION_DOM_SCOPE_GUARD_MISSING')

          result = Path('live-result-v0204.js').read_text(encoding='utf-8')
          lock = Path('live-lock-guard-v0202.js').read_text(encoding='utf-8')
          hguard = Path('live-snapshot-hash-guard-v0209.js').read_text(encoding='utf-8')
          if 'resultEndpointsIncluded:true' not in result or 'bcVerifyLiveLockSnapshotHashV0209' not in result:
            raise SystemExit('POST_RACE_FAIL_CLOSED_CONTRACT_MISSING')
          if 'bcGlobalLiveResultGateV0222' not in result or 'if(!globalGate.ok)return' not in result:
            raise SystemExit('POST_RACE_GLOBAL_GATE_MISSING')
          if "r.liveDataStatus!=='READY'" not in lock or 'minMarginMinutes:3' not in lock or "suggestion?.status!=='CANDIDATE'" not in lock:
            raise SystemExit('PRE_RACE_LOCK_FAIL_CLOSED_CONTRACT_MISSING')
          if "computed!==stored" not in hguard:
            raise SystemExit('SNAPSHOT_HASH_RECOMPUTE_MISSING')

          print('EARLY_TRIAL_READINESS_STATIC_AUDIT_PASS')
          print('critical_dom_contract=true')
          print('live_skip_wait_contract=true')
          print('pre_post_boundary_preserved=true')

      - name: Verify portal launcher and PWA contract
        shell: python
        run: |
          from pathlib import Path
          import json, re

          portal = Path('portal.html').read_text(encoding='utf-8')
          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))

          if manifest.get('display') != 'standalone' or manifest.get('scope') != './':
            raise SystemExit('PORTAL_PWA_DISPLAY_SCOPE_BAD')
          if manifest.get('start_url') != './portal.html':
            raise SystemExit(f"PORTAL_PWA_START_URL_BAD:{manifest.get('start_url')}")
          if not re.search(r'<link\s+rel="manifest"\s+href="manifest\.webmanifest\?v=\d+"', portal):
            raise SystemExit('PORTAL_MANIFEST_LINK_MISSING_OR_UNVERSIONED')
          if "const active=name==='蒲郡'" not in portal or 'btn.disabled=!active' not in portal:
            raise SystemExit('PORTAL_ONLY_GAMAGORI_ACTIVE_CONTRACT_BAD')
          if "if(active)btn.onclick=()=>location.href='./'" not in portal:
            raise SystemExit('PORTAL_GAMAGORI_ENTRY_LINK_BAD')
          for required_id in ['portalBankroll','portalProfit','portalTodayProfit','portalTodayRoi','portalTotalRoi','venueGrid']:
            if f'id="{required_id}"' not in portal:
              raise SystemExit(f'PORTAL_CRITICAL_ID_MISSING:{required_id}')
          forbidden = ['live/gamagori/${date}/post/', 'race-result', 'raceresult', 'officialResult', 'fetchResult']
          hits = [x for x in forbidden if x in portal]
          if hits:
            raise SystemExit(f'PORTAL_RESULT_LOOKAHEAD_SURFACE_FOUND:{hits}')
          print('PORTAL_LAUNCHER_PWA_CONTRACT_PASS')

      - name: Verify final script order, singleton loads, and unified cache key
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          srcs = re.findall(r'<script\s+src="([^"]+)"', html)
          bases = [x.split('?',1)[0] for x in srcs]
          required = [
            'app.js','gamagori-live-integration-v0198.js','live-autopoll-v0199.js','live-predictor-v0200.js',
            'live-skip-gate-v0225.js','live-autofill-v0201.js','live-lock-guard-v0202.js','live-lock-snapshot-v0203.js',
            'live-result-v0204.js','live-learning-v0205.js','live-learning-dashboard-v0206.js','live-learning-guard-v0207.js',
            'live-integrity-audit-v0208.js','live-snapshot-hash-guard-v0209.js','development-status-v0217.js',
            'trial-readiness-v0218.js'
          ]
          missing = [x for x in required if x not in bases]
          if missing:
            raise SystemExit(f'MISSING_REQUIRED_SCRIPT: {missing}')
          duplicates = sorted({x for x in bases if bases.count(x)>1})
          if duplicates:
            raise SystemExit(f'DUPLICATE_SCRIPT_LOAD: {duplicates}')
          pos = [bases.index(x) for x in required]
          if pos != sorted(pos):
            raise SystemExit('SAFETY_SCRIPT_ORDER_CHANGED')

          versions=[]
          for src in srcs:
            m=re.search(r'[?&]v=(\d+)',src)
            if not m:
              raise SystemExit(f'SCRIPT_CACHE_KEY_MISSING:{src}')
            versions.append(int(m.group(1)))
          if len(set(versions)) != 1:
            raise SystemExit(f'CACHE_KEYS_NOT_UNIFIED:{versions}')

          shell_versions=[]
          for pattern in [r'manifest\.webmanifest\?v=(\d+)',r'icon\.svg\?v=(\d+)',r'styles\.css\?v=(\d+)']:
            m=re.search(pattern,html)
            if not m:
              raise SystemExit(f'SHELL_CACHE_KEY_MISSING:{pattern}')
            shell_versions.append(int(m.group(1)))
          if shell_versions != [versions[0]]*3:
            raise SystemExit(f'SHELL_SCRIPT_CACHE_MISMATCH:shell={shell_versions}:scripts={versions[0]}')

          print(f'EARLY_TRIAL_READINESS_FINAL_AUDIT_PASS cache={versions[0]}')

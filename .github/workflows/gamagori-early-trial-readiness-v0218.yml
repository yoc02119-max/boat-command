name: Gamagori early trial readiness v0.21.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-early-trial-readiness-v0218.yml'
      - 'trial-readiness-v0218.js'

permissions:
  contents: write

jobs:
  readiness-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax audit
        run: node --check trial-readiness-v0218.js

      - name: Verify read-only trial gate and critical DOM contract
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          gate = Path('trial-readiness-v0218.js').read_text(encoding='utf-8')

          required_ids = [
            'sessionDate','modeBadge','runType','strategyVersion','predictionList','lockAllBtn',
            'resultGate','resultGateBadge','resultSummary','resultList','raceStrip',
            'chat','prompt','send','liveDate','liveRace'
          ]
          missing_ids = [x for x in required_ids if not re.search(rf'id=["\']{re.escape(x)}["\']', html)]
          if missing_ids:
            raise SystemExit(f'CRITICAL_DOM_ID_MISSING: {missing_ids}')

          forbidden = ['raceresult', 'result?jcd=', 'officialResult', 'fetchResult', 'settleRace(', 'lockRace=']
          bad = [x for x in forbidden if x in gate]
          if bad:
            raise SystemExit(f'TRIAL_GATE_MUST_BE_READ_ONLY: {bad}')

          required_tokens = [
            'productionMutation:false',
            'predictionQualityCertified:false',
            'bcFinalLiveLockAudit',
            'bcVerifyLiveLockSnapshotV0203',
            'bcVerifyLiveLockSnapshotHashV0209',
            "status:ok?'READY_FOR_EARLY_TRIAL':'HOLD'",
          ]
          missing_tokens = [x for x in required_tokens if x not in gate]
          if missing_tokens:
            raise SystemExit(f'READINESS_GUARD_TOKEN_MISSING: {missing_tokens}')

          result = Path('live-result-v0204.js').read_text(encoding='utf-8')
          lock = Path('live-lock-guard-v0202.js').read_text(encoding='utf-8')
          hguard = Path('live-snapshot-hash-guard-v0209.js').read_text(encoding='utf-8')
          if 'resultEndpointsIncluded:true' not in result or 'bcVerifyLiveLockSnapshotHashV0209' not in result:
            raise SystemExit('POST_RACE_FAIL_CLOSED_CONTRACT_MISSING')
          if "r.liveDataStatus!=='READY'" not in lock or 'minMarginMinutes:3' not in lock:
            raise SystemExit('PRE_RACE_LOCK_FAIL_CLOSED_CONTRACT_MISSING')
          if "computed!==stored" not in hguard:
            raise SystemExit('SNAPSHOT_HASH_RECOMPUTE_MISSING')

          print('EARLY_TRIAL_READINESS_STATIC_AUDIT_PASS')
          print('critical_dom_contract=true')
          print('trial_gate_read_only=true')
          print('pre_post_boundary_preserved=true')

      - name: Enable v0.21.8 readiness gate after all safety modules
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('BOAT COMMAND v0.21.7', 'BOAT COMMAND v0.21.8')
          html = html.replace('v0.21.7 · EARLY TRIAL', 'v0.21.8 · EARLY TRIAL')

          anchor = '<script src="development-status-v0217.js?v=217"></script>'
          script = '<script src="trial-readiness-v0218.js?v=218"></script>'
          if script not in html:
            if anchor not in html:
              raise SystemExit('READINESS_INSERT_ANCHOR_MISSING')
            html = html.replace(anchor, anchor + '\n' + script)

          p.write_text(html, encoding='utf-8')

      - name: Verify final script order and singleton loads
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          srcs = re.findall(r'<script\s+src="([^"]+)"', html)
          bases = [x.split('?',1)[0] for x in srcs]
          required = [
            'app.js','live-autopoll-v0199.js','live-predictor-v0200.js','live-autofill-v0201.js',
            'live-lock-guard-v0202.js','live-lock-snapshot-v0203.js','live-result-v0204.js',
            'live-learning-v0205.js','live-learning-dashboard-v0206.js','live-learning-guard-v0207.js',
            'live-integrity-audit-v0208.js','live-snapshot-hash-guard-v0209.js','development-status-v0217.js',
            'trial-readiness-v0218.js'
          ]
          missing = [x for x in required if x not in bases]
          if missing:
            raise SystemExit(f'MISSING_REQUIRED_SCRIPT: {missing}')
          duplicates = sorted({x for x in bases if bases.count(x)>1})
          if duplicates:
            raise SystemExit(f'DUPLICATE_SCRIPT_LOAD: {duplicates}')
          pos = [bases.index(x) for x in required]
          if pos != sorted(pos):
            raise SystemExit('SAFETY_SCRIPT_ORDER_CHANGED')
          print('EARLY_TRIAL_READINESS_FINAL_AUDIT_PASS')

      - name: Commit app enablement
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'app: enable Gamagori early-trial readiness gate v0.21.8'
          git push

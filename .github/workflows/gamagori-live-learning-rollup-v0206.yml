name: Gamagori LIVE learning rollup v0.20.6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-live-learning-rollup-v0206.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate learning rollup JavaScript
        run: node --check live-learning-dashboard-v0206.js

      - name: Enforce singleton rollup bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Remove every existing copy regardless of cache-buster.
          s=re.sub(r'\n?<script src="live-learning-dashboard-v0206\.js\?v=\d+"></script>','',s)
          anchor_re=r'(<script src="live-learning-v0205\.js\?v=\d+"></script>)'
          if not re.search(anchor_re,s):
              raise SystemExit('LEARNING_ROLLUP_ANCHOR_MISSING')
          tag='<script src="live-learning-dashboard-v0206.js?v=214"></script>'
          s=re.sub(anchor_re,lambda m:m.group(1)+'\n'+tag,s,count=1)
          if s.count('live-learning-dashboard-v0206.js')!=1:
              raise SystemExit('LEARNING_ROLLUP_SINGLETON_FAIL')
          p.write_text(s)
          PY

      - name: Verify PRE/POST boundary markers remain explicit
        run: |
          grep -q 'live-result-v0204.js' index.html
          grep -q 'live-learning-v0205.js' index.html
          grep -q 'live-learning-dashboard-v0206.js' index.html
          grep -q 'resultUsedForPrediction===false' live-learning-dashboard-v0206.js
          grep -q 'autoModelUpdate:false' live-learning-dashboard-v0206.js

      - name: Commit app learning rollup enablement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git commit -m 'app: maintain singleton Gamagori LIVE learning rollup bootstrap'
          git push

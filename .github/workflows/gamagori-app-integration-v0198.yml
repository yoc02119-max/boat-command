name: Gamagori app LIVE integration v0.19.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-app-integration-v0198.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-app-integration-v0198
  cancel-in-progress: false

jobs:
  patch-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append LIVE integration module
        run: |
          set -euo pipefail
          MARKER='// BOAT COMMAND GAMAGORI LIVE INTEGRATION v0.19.8'
          if ! grep -Fq "$MARKER" app.js; then
            printf '\n\n' >> app.js
            cat gamagori-live-integration-v0198.js >> app.js
            echo 'PATCHED_APP_JS'
          else
            echo 'APP_ALREADY_PATCHED'
          fi

      - name: Bump app cache version
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BOAT COMMAND v0.18.0','BOAT COMMAND v0.19.8')
          s=s.replace('v0.18.0 · PROGRAM COMPOSITION','v0.19.8 · LIVE VERIFIED')
          s=s.replace('app.js?v=180','app.js?v=198')
          s=s.replace('styles.css?v=180','styles.css?v=198')
          p.write_text(s)
          PY

      - name: Commit integration
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js index.html; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-relay'
          git config user.email 'boat-command-relay@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'feat: connect verified Gamagori LIVE relay to prediction UI'
          git push

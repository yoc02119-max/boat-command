name: Gamagori LINE day status v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-line-day-status-v1.yml'
  schedule:
    # 13:00-23:00 JST, hourly. Output only commits when the status changes.
    - cron: '0 4-14 * * *'

permissions:
  contents: write

concurrency:
  group: gamagori-line-day-status-v1
  cancel-in-progress: false

jobs:
  build-day-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official Gamagori sources
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%F)
          HD="${DATE//-/}"
          YM=$(TZ=Asia/Tokyo date +%Y%m)
          MONTH_START=$(TZ=Asia/Tokyo date +%Y-%m-01)
          NEXT_YM=$(TZ=Asia/Tokyo date -d "$MONTH_START +1 month" +%Y%m)

          RACELIST_URL="https://www.boatrace.jp/owpc/pc/race/racelist?hd=$HD&jcd=07&rno=1"
          SCHEDULE_URL="https://www.boatrace.jp/owsp/sp/race/monthlyschedule?ym=$YM"
          NEXT_SCHEDULE_URL="https://www.boatrace.jp/owsp/sp/race/monthlyschedule?ym=$NEXT_YM"

          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-LINE-DAY-STATUS/1' \
            "$RACELIST_URL" -o /tmp/gamagori-racelist.html
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-LINE-DAY-STATUS/1' \
            "$SCHEDULE_URL" -o /tmp/gamagori-schedule-current.html
          curl -fsSL --connect-timeout 20 --max-time 60 \
            --user-agent 'BOAT-COMMAND-LINE-DAY-STATUS/1' \
            "$NEXT_SCHEDULE_URL" -o /tmp/gamagori-schedule-next.html

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "RACELIST_URL=$RACELIST_URL" >> "$GITHUB_ENV"
          echo "SCHEDULE_URL=$SCHEDULE_URL" >> "$GITHUB_ENV"
          echo "NEXT_SCHEDULE_URL=$NEXT_SCHEDULE_URL" >> "$GITHUB_ENV"

      - name: Build machine-readable day status
        shell: python
        run: |
          from pathlib import Path
          from datetime import date
          import html as htmlmod
          import json
          import os
          import re

          def plain_text(raw):
              return htmlmod.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', raw)))

          def parse_gamagori_links(path):
              raw = Path(path).read_text(encoding='utf-8', errors='replace')
              rows = re.findall(
                  r'<a[^>]+href=["\'][^"\']*assen\?hd=(\d{8})(?:&amp;|&)jcd=07[^"\']*["\'][^>]*>(.*?)</a>',
                  raw,
                  flags=re.I | re.S,
              )
              out = []
              for yyyymmdd, inner in rows:
                  try:
                      start = date.fromisoformat(f'{yyyymmdd[:4]}-{yyyymmdd[4:6]}-{yyyymmdd[6:]}')
                  except ValueError:
                      continue
                  title = plain_text(inner).strip()
                  if not title:
                      title = '蒲郡開催'
                  out.append({'start': start, 'title': title})
              return out

          raw = Path('/tmp/gamagori-racelist.html').read_text(encoding='utf-8', errors='replace')
          plain = plain_text(raw)
          times = re.findall(r'(?<!\d)([0-2]?\d:[0-5]\d)(?!\d)', plain)
          active = len(times) >= 12
          deadlines = [
              {'race': i + 1, 'deadlineJst': t}
              for i, t in enumerate(times[:12])
          ] if active else []

          today = date.fromisoformat(os.environ['DATE'])
          events = (
              parse_gamagori_links('/tmp/gamagori-schedule-current.html') +
              parse_gamagori_links('/tmp/gamagori-schedule-next.html')
          )

          deduped = {}
          for e in events:
              deduped[(e['start'].isoformat(), e['title'])] = e

          future = sorted(
              (e for e in deduped.values() if e['start'] > today),
              key=lambda e: (e['start'], e['title'])
          )

          next_event = None
          if future:
              e = future[0]
              next_event = {
                  'startDateJst': e['start'].isoformat(),
                  'title': e['title'],
                  'daysUntil': (e['start'] - today).days,
              }

          payload = {
              'schema': 'boat-command-gamagori-day-status-v1',
              'venue': '蒲郡',
              'venueCode': 'GAMAGORI-01',
              'dateJst': os.environ['DATE'],
              'eventActive': active,
              'raceCount': 12 if active else 0,
              'deadlines': deadlines,
              'statusReason': 'ACTIVE_EVENT' if active else 'NO_EVENT_DETECTED',
              'nextEvent': next_event,
              'scheduleStatus': 'OK' if next_event else 'NOT_FOUND',
              'source': {
                  'officialRacelist': os.environ['RACELIST_URL'],
                  'officialMonthlySchedule': [
                      os.environ['SCHEDULE_URL'],
                      os.environ['NEXT_SCHEDULE_URL'],
                  ],
                  'deadlineExtraction': 'first 12 HH:MM values; same contract as production guard v0.19.6',
                  'nextEventExtraction': 'official monthly schedule assen links filtered to jcd=07',
              }
          }

          out = Path('line/gamagori-day-status.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))

      - name: Validate day status contract
        shell: python
        run: |
          import json
          from datetime import date
          from pathlib import Path

          p = json.loads(Path('line/gamagori-day-status.json').read_text(encoding='utf-8'))
          assert p['schema'] == 'boat-command-gamagori-day-status-v1'
          assert p['venueCode'] == 'GAMAGORI-01'
          if p['eventActive']:
              assert p['raceCount'] == 12
              assert len(p['deadlines']) == 12
              assert [x['race'] for x in p['deadlines']] == list(range(1, 13))
          else:
              assert p['raceCount'] == 0
              assert p['deadlines'] == []

          if p['nextEvent'] is not None:
              n = p['nextEvent']
              assert date.fromisoformat(n['startDateJst']) > date.fromisoformat(p['dateJst'])
              assert isinstance(n['title'], str) and n['title'].strip()
              assert isinstance(n['daysUntil'], int) and n['daysUntil'] > 0

          print('GAMAGORI_LINE_DAY_STATUS_CONTRACT_PASS')

      - name: Commit day status when changed
        run: |
          if [ -z "$(git status --porcelain -- line/gamagori-day-status.json)" ]; then
            echo 'No Gamagori day status change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add line/gamagori-day-status.json
          git commit -m 'chore: refresh Gamagori LINE day status'
          git push

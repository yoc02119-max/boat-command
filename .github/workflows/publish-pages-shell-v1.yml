name: Publish stable Pages shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'portal.html'
      - 'performance.html'
      - 'performance-v2.html'
      - 'daily-lab.html'
      - 'developer-lock-v1.json'
      - 'venue.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'venue-model-cycle-fleet-v1.json'
      - 'venue-model-cycle-policy-v1.json'
      - 'venues/**/model-cycle-v1.json'
      - 'venues/**/model-candidates-v1.json'
      - '.github/workflows/publish-pages-shell-v1.yml'

permissions:
  contents: write

concurrency:
  group: pages-shell-publish
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update gh-pages only for shell/runtime changes
        run: |
          git fetch origin gh-pages
          git push --force-with-lease=refs/heads/gh-pages:refs/remotes/origin/gh-pages origin HEAD:refs/heads/gh-pages

name: JARVIS v0.33.7 smoke

on:
  push:
    branches: [jarvis-completion-v0336, 'shadow/jarvis-real-ai-v0337']
  pull_request:
    branches: [main]
    paths:
      - 'boat-command-agent-v0335.js'
      - 'boat-jarvis-*.js'
      - 'api/jarvis/*.js'
      - 'lib/jarvis-security.js'
      - 'vercel.json'
      - 'index.html'
      - 'tests/jarvis-v0336-*.mjs'
      - 'tests/jarvis-v0337-*.mjs'
      - '.github/workflows/jarvis-v0336-smoke.yml'
      - '.github/workflows/jarvis-codex-executor-v0337.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in boat-command-agent-v0335.js boat-voice-agent-v0296.js boat-ai-visual-v0312.js boat-jarvis-cloud-v0337.js boat-jarvis-llm-client-v0336.js boat-jarvis-conversation-v0336.js boat-jarvis-core-v0336.js boat-jarvis-app-controller-v0336.js boat-jarvis-development-bridge-v0336.js boat-jarvis-executor-contract-v0336.js boat-jarvis-runtime-v0336.js boat-jarvis-ui-v0336.js api/jarvis/chat.js api/jarvis/github.js lib/jarvis-security.js tests/jarvis-v0337-cloud-boundary.mjs tests/jarvis-v0338-voice-route.mjs; do
            node --check "$f"
          done
      - name: JARVIS static smoke
        run: node tests/jarvis-v0336-static-smoke.mjs
      - name: JARVIS intent and safety contract
        run: node tests/jarvis-v0336-intent-contract.mjs
      - name: JARVIS representative runtime cases
        run: node tests/jarvis-v0336-runtime-cases.mjs
      - name: JARVIS cloud security boundary
        run: node tests/jarvis-v0337-cloud-boundary.mjs
      - name: JARVIS voice route
        run: node tests/jarvis-v0338-voice-route.mjs
      - name: LIVE prediction freeze
        run: node scripts/gamagori-live-freeze-contract-v0333.js

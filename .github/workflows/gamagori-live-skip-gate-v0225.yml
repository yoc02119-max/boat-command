name: Gamagori LIVE skip-safe result gate v0.22.5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamagori-live-skip-gate-v0225.yml'
      - 'live-skip-gate-v0225.js'

permissions:
  contents: write

concurrency:
  group: gamagori-live-skip-gate-v0225
  cancel-in-progress: true

jobs:
  enable-skip-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax and safety audit
        run: |
          set -euo pipefail
          node --check live-skip-gate-v0225.js
          grep -Fq "waitFailClosed:true" live-skip-gate-v0225.js
          grep -Fq "resultLookahead:false" live-skip-gate-v0225.js
          grep -Fq "if(bcLiveUnresolvedV0225(s).length)return false" live-skip-gate-v0225.js
          if grep -Eqi 'resultlist|/result\?|payout100|bcLoadResult|fetch\(.+post' live-skip-gate-v0225.js; then
            echo 'POST_RACE_LOGIC_MUST_NOT_EXIST_IN_SKIP_GATE'
            exit 1
          fi

      - name: Insert skip gate after predictor and before autofill
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          script='<script src="live-skip-gate-v0225.js?v=225"></script>'
          if script not in html:
            anchor_re=r'(<script src="live-predictor-v0200\.js\?v=\d+"></script>)'
            html,count=re.subn(anchor_re,rf'\1\n{script}',html,count=1)
            if count!=1:
              raise SystemExit('PREDICTOR_INSERT_ANCHOR_MISSING')
          if html.count('live-skip-gate-v0225.js')!=1:
            raise SystemExit('SKIP_GATE_SCRIPT_SINGLETON_INVALID')
          p.write_text(html,encoding='utf-8')

      - name: Verify final dependency order and result boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          html=Path('index.html').read_text(encoding='utf-8')
          srcs=re.findall(r'<script\s+src="([^"]+)"',html)
          bases=[x.split('?',1)[0] for x in srcs]
          required=['app.js','live-predictor-v0200.js','live-skip-gate-v0225.js','live-autofill-v0201.js','live-lock-guard-v0202.js','live-lock-snapshot-v0203.js','live-result-v0204.js']
          missing=[x for x in required if x not in bases]
          if missing:
            raise SystemExit(f'MISSING_SCRIPT:{missing}')
          pos=[bases.index(x) for x in required]
          if pos!=sorted(pos):
            raise SystemExit('LIVE_SKIP_GATE_SCRIPT_ORDER_INVALID')
          result=Path('live-result-v0204.js').read_text(encoding='utf-8')
          if 'bcGlobalLiveResultGateV0222' not in result or 'if(!globalGate.ok)return' not in result:
            raise SystemExit('POST_RACE_GLOBAL_GATE_MISSING')
          lock=Path('live-lock-guard-v0202.js').read_text(encoding='utf-8')
          if "suggestion?.status!=='CANDIDATE'" not in lock:
            raise SystemExit('LIVE_LOCK_CANDIDATE_GATE_MISSING')
          print('GAMAGORI_LIVE_SKIP_GATE_CHAIN_PASS')

      - name: Commit app wiring
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'NO_INDEX_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: enable Gamagori LIVE skip-safe POST-RACE gate'
          git push

name: Second-place venue gate v1

on:
  pull_request:
    paths:
      - '.github/workflows/second-place-venue-gate-v1.yml'
      - 'scripts/second-place-venue-gate-v1.py'
      - 'scripts/racer-period-second-place-audit-v1.py'
      - 'rich-history-24/**'
      - 'racer-period-24/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run calibration-only venue gate audit
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/second-place-venue-gate-v1.py
          python3 scripts/second-place-venue-gate-v1.py
          python3 - <<'PY'
          import json
          x=json.load(open('research/second-place-venue-gate-v1.json',encoding='utf-8'))
          assert x['schema']=='boat-command-second-place-venue-gate-v1'
          assert x['researchOnly'] is True
          assert x['productionChanged'] is False
          assert x['predictionInputChanged'] is False
          assert x['tryChanged'] is False
          assert x['hardLockChanged'] is False
          assert x['promotionEligible'] is False
          assert x['gateSelectionUsesHoldout'] is False
          assert x['firstPredictionFrozen'] is True
          assert x['summary']['venues']==24
          assert x['summary']['holdoutRaces']>5000
          assert abs(x['summary']['headAccuracyDelta']) < 1e-12
          print('SECOND_PLACE_VENUE_GATE_BOUNDARY_PASS',x['summary'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: second-place-venue-gate-v1
          path: research/second-place-venue-gate-v1.json
          retention-days: 30
          if-no-files-found: error

      - name: Save report to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp research/second-place-venue-gate-v1.json /tmp/second-place-venue-gate-v1.json
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p research
          cp /tmp/second-place-venue-gate-v1.json research/
          git config user.name 'boat-command-second-place-gate'
          git config user.email 'boat-command-second-place-gate@users.noreply.github.com'
          git add research/second-place-venue-gate-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'analysis(research): store second-place venue gate audit [skip ci]'
          git push origin "HEAD:$HEAD_REF"

name: Point expansion SHADOW v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/point-expansion-*.js'
      - 'scripts/*shadow-research-v1.js'
      - '.github/workflows/point-expansion-shadow-v1.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: point-expansion-shadow-v1
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline and PRE-RACE contracts
        run: node scripts/point-expansion-shadow-test-v1.js
      - name: Compare frozen variants per venue and model configuration
        run: node scripts/point-expansion-report-v1.js /tmp/point-expansion-report-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: point-expansion-shadow-report
          path: /tmp/point-expansion-report-v1.json
          retention-days: 30

name: Developer mode contract v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'daily-lab.html'
      - 'api/developer-auth.js'
      - 'api/jarvis/github.js'
      - 'scripts/developer-mode-contract-v1.js'
      - '.github/workflows/developer-mode-contract-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/developer-mode-contract-v1.js

name: Mikuni history analysis v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Mikuni history bootstrap 180d v1"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: mikuni-history-analysis-v1
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh main after bootstrap
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            git fetch origin main && git reset --hard origin/main
            test -f mikuni-history-bootstrap-v1.json && exit 0
            sleep 5
          done
          exit 1
      - name: Analyze Mikuni venue structure
        run: |
          set -euo pipefail
          node --check scripts/mikuni-history-analysis-v1.js
          node scripts/mikuni-history-analysis-v1.js
          node - <<'NODE'
          const x=require('./mikuni-history-analysis-v1.json');
          if(x.schema!=='boat-command-mikuni-history-analysis-v1'||x.venueCode!=='10'||x.races<300)throw new Error('MIKUNI_ANALYSIS_TARGET');
          if(x.modelPolicy.crossVenueWeightsReused!==false||x.modelPolicy.productionEnabled!==false)throw new Error('MIKUNI_MODEL_BOUNDARY');
          if(!x.firstToSecond?.['1']||!Number.isFinite(x.trifecta?.entropyBits))throw new Error('MIKUNI_TRANSITION_FEATURES');
          console.log('MIKUNI_HISTORY_ANALYSIS_PASS',x.races);
          NODE
      - name: Commit Mikuni analysis
        run: |
          set -euo pipefail
          cp mikuni-history-analysis-v1.json /tmp/mikuni-history-analysis-v1.json
          git config user.name 'boat-command-mikuni-analysis'
          git config user.email 'boat-command-mikuni-analysis@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mikuni-history-analysis-v1.json mikuni-history-analysis-v1.json
            git add mikuni-history-analysis-v1.json
            git diff --cached --quiet && { echo 'MIKUNI_ANALYSIS_CURRENT'; exit 0; }
            git commit -m 'analysis(mikuni): publish venue-specific historical structure'
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1

name: Tokuyama SHADOW research v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tokuyama history bootstrap 180d v1", "Tokuyama baseline backtest v1", "Tokuyama 12R program snapshot v1"]
    types: [completed]
  schedule:
    - cron: '*/5 0-8,22-23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tokuyama-shadow-research-v1.yml'
      - 'scripts/tokuyama-shadow-research-v1.js'
      - 'tokuyama-research-model-v1.js'

permissions:
  contents: write

concurrency:
  group: tokuyama-shadow-research-v1
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Resolve JST date
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Create immutable Tokuyama research snapshots
        run: |
          set -euo pipefail
          node --check tokuyama-research-model-v1.js
          node --check scripts/tokuyama-shadow-research-v1.js
          node scripts/tokuyama-shadow-research-v1.js "${{ steps.date.outputs.date }}"
      - name: Audit research boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,glob,json,re
          from zoneinfo import ZoneInfo
          JST=ZoneInfo('Asia/Tokyo')
          paths=glob.glob('live/tokuyama/*/shadow/class-baseline/race-*.json')+glob.glob('live/tokuyama/*/shadow/program-only/race-*.json')
          for p in paths:
              x=json.load(open(p,encoding='utf-8'))
              assert x['schema']=='boat-command-tokuyama-shadow-research-v1'
              assert x['venue']=='TOKUYAMA' and x['venueCode']=='18'
              assert x['mode'] in {'CLASS_BASELINE','PROGRAM_ONLY'}
              if '/class-baseline/' in p: assert x['mode']=='CLASS_BASELINE'
              if '/program-only/' in p: assert x['mode']=='PROGRAM_ONLY'
              assert x['resultInput'] is False and x['payoutInput'] is False
              assert x['researchOnly'] is True and x['productionEnabled'] is False and x['tryEnabled'] is False
              assert x['cashNeutral'] is True and x['immutableAfterFirstWrite'] is True
              assert len(x['picks'])==4 and len(set(x['picks']))==4
              assert all(re.fullmatch(r'[1-6]-[1-6]-[1-6]',v) for v in x['picks'])
              assert abs(float(x['probabilitySum'])-1)<1e-9
              d=datetime.date.fromisoformat(x['date']);hh,mm=map(int,str(x['deadline']).split(':'))
              deadline=datetime.datetime(d.year,d.month,d.day,hh,mm,tzinfo=JST)
              generated=datetime.datetime.fromisoformat(str(x['generatedAt']).replace('Z','+00:00')).astimezone(JST)
              assert (deadline-generated).total_seconds()/60>=3
          print('TOKUYAMA_SHADOW_BOUNDARY_PASS')
          PY
      - name: Publish only new immutable shadow files
        run: |
          set -euo pipefail
          DATE="${{ steps.date.outputs.date }}"
          SHADOW="live/tokuyama/$DATE/shadow"
          [ -d "$SHADOW" ] || { echo 'NO_TOKUYAMA_SHADOW_FILES'; exit 0; }
          rm -rf /tmp/tokuyama-shadow-publish
          mkdir -p /tmp/tokuyama-shadow-publish
          cp -a "$SHADOW/." /tmp/tokuyama-shadow-publish/
          git config user.name 'boat-command-tokuyama-shadow'
          git config user.email 'boat-command-tokuyama-shadow@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$SHADOW"
            while IFS= read -r src; do
              rel="${src#/tmp/tokuyama-shadow-publish/}"; dst="$SHADOW/$rel"
              [ -f "$dst" ] && continue
              mkdir -p "$(dirname "$dst")"; cp "$src" "$dst"
            done < <(find /tmp/tokuyama-shadow-publish -type f -name '*.json' | sort)
            git add "$SHADOW"
            git diff --cached --quiet && { echo 'TOKUYAMA_SHADOW_CURRENT'; exit 0; }
            git commit -m 'shadow(tokuyama): freeze paired result-free research snapshots'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1

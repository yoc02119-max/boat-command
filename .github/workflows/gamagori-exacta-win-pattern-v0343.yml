name: Gamagori exacta win-pattern search v0.34.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gamagori-exacta-win-pattern-v0343.py'
      - 'gamagori-replay-predictions-v0333.json'
      - 'gamagori-replay-results-v0333.json'
      - 'gamagori-win-pattern-combo-v0339.json'
      - '.github/workflows/gamagori-exacta-win-pattern-v0343.yml'

permissions:
  contents: write

concurrency:
  group: gamagori-exacta-win-pattern-v0343
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Run exacta win-pattern search
        run: python scripts/gamagori-exacta-win-pattern-v0343.py

      - name: Commit cache and report
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- gamagori-exacta-payouts-v0343.json gamagori-exacta-win-pattern-v0343.json)" ]; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'boat-command-analysis'
          git config user.email 'boat-command-analysis@users.noreply.github.com'
          git add gamagori-exacta-payouts-v0343.json gamagori-exacta-win-pattern-v0343.json
          git commit -m 'analysis(gamagori): publish exacta win-pattern search v0.34.3'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo 'PUSH_RETRY_EXHAUSTED' >&2
          exit 1
